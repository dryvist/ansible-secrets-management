---
- name: Reject an OpenBao single-object selector during reconcile
  ansible.builtin.assert:
    that:
      - not (openbao_reconcile_mode | default(false) | bool)
    fail_msg: >-
      {{ openbao_single_object_label }} selection is not available while
      openbao_reconcile_mode is true.
    quiet: true

- name: Resolve the selected OpenBao object
  ansible.builtin.set_fact:
    openbao_single_object_targets: >-
      {{ openbao_single_object_candidates
         | selectattr('name', 'equalto', openbao_single_object_selector) | list }}

- name: Require the OpenBao selector to match exactly one managed object
  ansible.builtin.assert:
    that:
      - openbao_single_object_targets | length == 1
    fail_msg: >-
      {{ openbao_single_object_label }} selector
      '{{ openbao_single_object_selector }}' matched
      {{ openbao_single_object_targets | length }} managed objects; exactly one
      is required.
    quiet: true
