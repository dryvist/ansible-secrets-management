---
# Revoke every stored pr-reconcile secret_id while its bind is empty (fail closed).
# 07b keeps the role and its policy, but issues no standing secret_id while the
# /32 is empty. A secret_id issued before the bind was emptied stays live until
# it is destroyed, so this block destroys each one by accessor. It skips cleanly
# when the role does not exist. It runs only on a privileged run: the reconcile
# identity holds no secret-id grant (see 10b), so a reconcile run reports the
# revocation it could not perform. Runs on openbao_cli_host, like 10b.

- name: Read whether the pr-reconcile AppRole exists while its bind is empty
  ansible.builtin.command:
    cmd: "bao read -format=json auth/approle/role/{{ openbao_github_pr_reconcile_approle_name }}"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  register: openbao_pr_reconcile_role_read
  no_log: true
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - openbao_bootstrap_token is defined
    - not (openbao_reconcile_mode | default(false))
    - openbao_pr_reconcile_secret_id_cidr | length == 0

# A read that fails for any reason other than absence says nothing about whether
# stored secret_ids exist. Fail on it rather than skip the revocation.
- name: FAIL -- the pr-reconcile role read failed for a reason other than absence
  ansible.builtin.fail:
    msg: >-
      Reading the pr-reconcile AppRole failed with rc {{ openbao_pr_reconcile_role_read.rc }}:
      {{ openbao_pr_reconcile_role_read.stderr | default('') }}
      Only "No value found" means the role is absent. Any other failure leaves
      stored secret_ids unknown, so this run must not skip their revocation.
  when:
    - openbao_bootstrap_token is defined
    - not (openbao_reconcile_mode | default(false))
    - openbao_pr_reconcile_secret_id_cidr | length == 0
    - (openbao_pr_reconcile_role_read.rc | default(0)) != 0
    - "'No value found' not in (openbao_pr_reconcile_role_read.stderr | default(''))"

- name: Report that the pr-reconcile role is absent, so no secret_id can be stored for it
  ansible.builtin.debug:
    msg: >-
      The pr-reconcile AppRole does not exist. No stored pr-reconcile secret_id
      can exist, so the revocation has nothing to destroy.
  when:
    - openbao_bootstrap_token is defined
    - not (openbao_reconcile_mode | default(false))
    - openbao_pr_reconcile_secret_id_cidr | length == 0
    - (openbao_pr_reconcile_role_read.rc | default(0)) != 0
    - "'No value found' in (openbao_pr_reconcile_role_read.stderr | default(''))"

- name: List the stored pr-reconcile secret_id accessors
  ansible.builtin.command:
    cmd: "bao list -format=json auth/approle/role/{{ openbao_github_pr_reconcile_approle_name }}/secret-id"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  register: openbao_pr_reconcile_accessor_list
  no_log: true
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - openbao_bootstrap_token is defined
    - not (openbao_reconcile_mode | default(false))
    - openbao_pr_reconcile_secret_id_cidr | length == 0
    - (openbao_pr_reconcile_role_read.rc | default(1)) == 0

# "No value found" is the list result when no secret_id is stored. Any other
# failure could hide a live secret_id, so it stops the run.
- name: FAIL -- listing the pr-reconcile secret_ids failed for a reason other than none stored
  ansible.builtin.fail:
    msg: >-
      Listing the pr-reconcile secret_id accessors failed with rc {{ openbao_pr_reconcile_accessor_list.rc }}:
      {{ openbao_pr_reconcile_accessor_list.stderr | default('') }}
      A stored secret_id may still be live, so this run must not skip its revocation.
  when:
    - openbao_bootstrap_token is defined
    - not (openbao_reconcile_mode | default(false))
    - openbao_pr_reconcile_secret_id_cidr | length == 0
    - (openbao_pr_reconcile_role_read.rc | default(1)) == 0
    - (openbao_pr_reconcile_accessor_list.rc | default(0)) != 0
    - "'No value found' not in (openbao_pr_reconcile_accessor_list.stderr | default(''))"

- name: Collect the pr-reconcile secret_id accessors to destroy
  ansible.builtin.set_fact:
    openbao_pr_reconcile_accessors: >-
      {{ (openbao_pr_reconcile_accessor_list.stdout | default('[]', true) | from_json)
         if (openbao_pr_reconcile_accessor_list.rc | default(1)) == 0 else [] }}
  no_log: true
  when:
    - openbao_bootstrap_token is defined
    - not (openbao_reconcile_mode | default(false))
    - openbao_pr_reconcile_secret_id_cidr | length == 0
    - (openbao_pr_reconcile_role_read.rc | default(1)) == 0

# One destroy per accessor, scoped to the pr-reconcile role path alone. The
# accessor list above comes from that same path, so no other AppRole is touched.
- name: Destroy each stored pr-reconcile secret_id by accessor while its bind is empty
  ansible.builtin.command:
    cmd: >-
      bao write auth/approle/role/{{ openbao_github_pr_reconcile_approle_name }}/secret-id-accessor/destroy
      secret_id_accessor={{ item }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  loop: "{{ openbao_pr_reconcile_accessors | default([]) }}"
  loop_control:
    label: "pr-reconcile secret_id accessor"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - not (openbao_reconcile_mode | default(false))
    - openbao_pr_reconcile_secret_id_cidr | length == 0
    - (openbao_pr_reconcile_role_read.rc | default(1)) == 0
    - openbao_pr_reconcile_accessors | default([]) | length > 0

- name: Report the pr-reconcile secret_id revocation for this run
  ansible.builtin.debug:
    msg: >-
      pr-reconcile secret_ids destroyed by accessor this run:
      {{ openbao_pr_reconcile_accessors | default([]) | length }}.
  when:
    - openbao_bootstrap_token is defined
    - not (openbao_reconcile_mode | default(false))
    - openbao_pr_reconcile_secret_id_cidr | length == 0
    - (openbao_pr_reconcile_role_read.rc | default(1)) == 0

# A reconcile run has no secret-id grant, so it cannot destroy these. Say so
# instead of reporting a clean converge while a secret_id may still be live.
- name: Report the pr-reconcile secret_id revocation that this reconcile run cannot perform
  ansible.builtin.debug:
    msg: >-
      OPENBAO_PR_RECONCILE_SECRET_ID_CIDR is empty, so stored pr-reconcile
      secret_ids must be destroyed. This reconcile run holds no secret-id grant
      and did not destroy them. Run with OPENBAO_PROVISIONING_TOKEN to revoke them.
  when:
    - openbao_bootstrap_token is defined
    - openbao_reconcile_mode | default(false)
    - openbao_pr_reconcile_secret_id_cidr | length == 0
