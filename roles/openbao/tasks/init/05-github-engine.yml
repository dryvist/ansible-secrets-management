---
- name: Read the staged GitHub plugin binary's sha256
  ansible.builtin.stat:
    path: "{{ openbao_plugin_dir }}/{{ openbao_github_plugin_command }}"
    checksum_algorithm: sha256
  register: openbao_github_plugin_stat
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool

- name: Assert the GitHub plugin binary is staged
  ansible.builtin.assert:
    that:
      - openbao_github_plugin_stat.stat.exists
    fail_msg: >-
      {{ openbao_plugin_dir }}/{{ openbao_github_plugin_command }} is missing.
      Re-run the full role so every Raft voter receives the plugin first.
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool

- name: Check whether the GitHub plugin version is registered
  ansible.builtin.command:
    cmd: >-
      bao plugin info -format=json
      -version={{ openbao_github_plugin_catalog_version }}
      secret {{ openbao_github_plugin_name }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  register: openbao_github_plugin_check
  no_log: true
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool

- name: Register the GitHub secrets plugin version
  ansible.builtin.command:
    cmd: >-
      bao plugin register
      -sha256={{ openbao_github_plugin_stat.stat.checksum }}
      -command={{ openbao_github_plugin_command }}
      -version={{ openbao_github_plugin_catalog_version }}
      secret {{ openbao_github_plugin_name }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  register: openbao_github_plugin_register
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool
    - (openbao_github_plugin_check.rc | default(1)) != 0

- name: Enable the GitHub secrets engine
  ansible.builtin.command:
    cmd: >-
      bao secrets enable -path={{ openbao_github_mount }}
      -plugin-version={{ openbao_github_plugin_catalog_version }}
      {{ openbao_github_plugin_name }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool
    - (openbao_github_mount ~ '/') not in (openbao_mounts_raw.stdout | from_json).keys()

- name: Tune the existing GitHub mount to the declared plugin version
  ansible.builtin.command:
    cmd: >-
      bao secrets tune -plugin-version={{ openbao_github_plugin_catalog_version }}
      {{ openbao_github_mount }}/
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  register: openbao_github_plugin_tune
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool
    - (openbao_github_mount ~ '/') in (openbao_mounts_raw.stdout | from_json).keys()
    - >-
      ((openbao_mounts_raw.stdout | from_json)[openbao_github_mount ~ '/'].plugin_version
       | default('')) != openbao_github_plugin_catalog_version

- name: Reload the GitHub plugin across the Raft cluster after an upgrade
  ansible.builtin.command:
    cmd: "bao plugin reload -plugin={{ openbao_github_plugin_name }} -scope=global"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool
    - >-
      openbao_github_plugin_tune is changed
      or openbao_github_plugin_install_task is changed

- name: Read the GitHub engine configuration
  ansible.builtin.command:
    cmd: "bao read -format=json {{ openbao_github_mount }}/config"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  register: openbao_github_config_check
  no_log: true
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool

- name: Assert the GitHub engine configuration read succeeded
  ansible.builtin.assert:
    that:
      - openbao_github_config_check.rc == 0
    fail_msg: The GitHub secrets engine config read failed; nothing was written.
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool

# A virgin mount answers the config read with rc=0 and app_id=0 — "endpoint
# readable" is NOT "App configured" (issue #1079: gating first configuration
# on rc alone made the first-config path unreachable and tripped the drift
# assert against app_id 0). Configured means a non-zero app_id is stored.
- name: Determine whether the GitHub App is actually configured
  ansible.builtin.set_fact:
    openbao_github_app_configured: >-
      {{ (openbao_github_config_check.rc | default(1)) == 0
         and ((openbao_github_config_check.stdout | default('{}', true)
               | from_json).data.app_id | default(0, true) | int) != 0 }}
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool

- name: Require the GitHub App credentials for first configuration
  ansible.builtin.assert:
    that:
      - openbao_github_app_id | length > 0
      - openbao_github_app_private_key | length > 0
    fail_msg: >-
      The GitHub secrets engine is unconfigured. Supply OPENBAO_GITHUB_APP_ID
      and OPENBAO_GITHUB_APP_PRIVATE_KEY for this one-time sealed write.
  no_log: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool
    - not (openbao_github_app_configured | default(false) | bool)

- name: Refuse an unexpected GitHub App ID drift
  ansible.builtin.assert:
    that:
      - >-
        (openbao_github_config_check.stdout | from_json).data.app_id | string
        == openbao_github_app_id | string
    fail_msg: >-
      The configured GitHub App ID differs from OPENBAO_GITHUB_APP_ID. Rotate
      the App key deliberately; a routine converge will not replace it.
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool
    - openbao_github_app_configured | default(false) | bool
    - >-
      openbao_github_app_id | length > 0
      or openbao_github_mount in openbao_github_app_key_rotate_mounts

- name: Require the GitHub App private key for a declared key rotation
  ansible.builtin.assert:
    that:
      - openbao_github_app_private_key | length > 0
    fail_msg: >-
      {{ openbao_github_mount }} is listed in openbao_github_app_key_rotate_mounts
      but no private key is supplied. Supply the new key, or remove the mount
      from the list.
  no_log: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool
    - openbao_github_app_configured | default(false) | bool
    - openbao_github_mount in openbao_github_app_key_rotate_mounts

- name: Write the GitHub App credentials (first configuration or declared key rotation)
  ansible.builtin.include_tasks: github_app_config_write.yml
  vars:
    openbao_github_app_config_mount: "{{ openbao_github_mount }}"
    openbao_github_app_config_app_id: "{{ openbao_github_app_id }}"
    openbao_github_app_config_private_key: "{{ openbao_github_app_private_key }}"
  no_log: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool
    - openbao_github_app_id | length > 0
    - openbao_github_app_private_key | length > 0
    - >-
      not (openbao_github_app_configured | default(false) | bool)
      or openbao_github_mount in openbao_github_app_key_rotate_mounts

- name: Require both GitHub App installation IDs
  ansible.builtin.assert:
    that:
      - openbao_github_dryvist_installation_id | int > 0
      - openbao_github_personal_installation_id | int > 0
    fail_msg: >-
      Add OPENBAO_GITHUB_ADMIN_DRYVIST_INSTALLATION_ID and
      OPENBAO_GITHUB_ADMIN_PERSONAL_INSTALLATION_ID to the env document
      (secret/platform/ansible/env) after installing the admin App on both
      accounts.
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool

- name: Assert the repo-create permission map is exactly administration:write
  ansible.builtin.assert:
    that:
      - openbao_github_repo_create_permissions.keys() | list == ['administration']
      - openbao_github_repo_create_permissions.administration == 'write'
    fail_msg: >-
      openbao_github_repo_create_permissions must be exactly
      {administration: write}. Widening it defeats the narrow-tier design —
      a token minted from this set must never gain contents/pull_requests
      (push) or any other permission; add a new tier instead of broadening
      this one.
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool

- name: Assert the CI resolver permission map is exactly its four write permissions
  ansible.builtin.assert:
    that:
      - openbao_github_ci_resolver_permissions.keys() | list == ['actions', 'checks', 'contents', 'pull_requests']
      - openbao_github_ci_resolver_permissions.actions == 'write'
      - openbao_github_ci_resolver_permissions.checks == 'write'
      - openbao_github_ci_resolver_permissions.contents == 'write'
      - openbao_github_ci_resolver_permissions.pull_requests == 'write'
    fail_msg: >-
      openbao_github_ci_resolver_permissions must be exactly
      {actions: write, checks: write, contents: write, pull_requests: write};
      add a new tier instead of widening this one.
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool

- name: Assert the OpenHands permission map is exactly its four permissions
  ansible.builtin.assert:
    that:
      - openbao_github_openhands_permissions.keys() | list == ['checks', 'contents', 'metadata', 'pull_requests']
      - openbao_github_openhands_permissions.checks == 'read'
      - openbao_github_openhands_permissions.contents == 'write'
      - openbao_github_openhands_permissions.metadata == 'read'
      - openbao_github_openhands_permissions.pull_requests == 'write'
    fail_msg: >-
      openbao_github_openhands_permissions must be exactly
      {checks: read, contents: write, metadata: read, pull_requests: write};
      add a new tier instead of widening this one.
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool

- name: Assert the pr-reconcile permission map is exactly its five permissions
  ansible.builtin.assert:
    that:
      - >-
        openbao_github_pr_reconcile_permissions.keys() | list
        == ['contents', 'issues', 'metadata', 'pull_requests', 'statuses']
      - openbao_github_pr_reconcile_permissions.contents == 'write'
      - openbao_github_pr_reconcile_permissions.issues == 'write'
      - openbao_github_pr_reconcile_permissions.metadata == 'read'
      - openbao_github_pr_reconcile_permissions.pull_requests == 'write'
      - openbao_github_pr_reconcile_permissions.statuses == 'write'
      - >-
        (openbao_github_pr_reconcile_permission_sets
         | map(attribute='permissions')
         | selectattr('workflows', 'defined') | list) == []
      - >-
        (openbao_github_pr_reconcile_permission_sets
         | map(attribute='permissions')
         | selectattr('administration', 'defined') | list) == []
    fail_msg: >-
      openbao_github_pr_reconcile_permissions must be exactly
      {contents: write, issues: write, metadata: read, pull_requests: write,
      statuses: write}; no set may hold workflows or administration. Add a new
      tier instead of widening this one.
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool

- name: Assert the org-admin permission map is exactly organization_administration:write
  ansible.builtin.assert:
    that:
      - openbao_github_org_admin_permissions.keys() | list == ['organization_administration']
      - openbao_github_org_admin_permissions.organization_administration == 'write'
    fail_msg: >-
      openbao_github_org_admin_permissions must be exactly
      {organization_administration: write}; add a new tier instead of
      broadening this one.
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool

- name: Assert the org-secrets permission map is exactly organization_secrets:write
  ansible.builtin.assert:
    that:
      - openbao_github_org_secrets_permissions.keys() | list == ['organization_secrets']
      - openbao_github_org_secrets_permissions.organization_secrets == 'write'
    fail_msg: >-
      openbao_github_org_secrets_permissions must be exactly
      {organization_secrets: write}; add a new tier instead of broadening it.
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool

# Runs on the controller (openbao_cli_host, resolved in init/02): one module
# execution per declared permission set. Same CLI, same rc/stdout, so the
# drift comparison below reads unchanged.
- name: Read the GitHub token permission sets
  ansible.builtin.command:
    cmd: >-
      bao read -format=json
      {{ openbao_github_mount }}/permissionset/{{ item.name }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  loop: "{{ openbao_github_admin_permission_sets }}"
  loop_control:
    label: "{{ item.name }}"
  register: openbao_github_permission_set_checks
  no_log: true
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool

# Body carries the stored token-request shape: installation_id always, plus
# the permissions map and the repository list on the sets that declare them.
# Admin-tier sets stay permissions-less on purpose — an omitted map IS the full
# App ceiling, which is what break-glass means. An omitted `repositories` means
# every repository of the installation, so a set that scopes itself to named
# repositories MUST carry the field here or it would be stored unbounded.
# Drift on any of the three re-POSTs the set.
- name: Reconcile the GitHub token permission sets
  ansible.builtin.uri:
    url: >-
      {{ openbao_cli_addr }}/v1/{{ openbao_github_mount
      }}/permissionset/{{ item.0.name }}
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_bootstrap_token }}"
    body_format: json
    body: >-
      {{ {'installation_id': item.0.installation_id | int}
         | combine({'permissions': item.0.permissions}
                   if item.0.permissions is defined else {})
         | combine({'repositories': item.0.repositories}
                   if item.0.repositories is defined else {}) }}
    status_code:
      - 200
      - 204
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  loop: >-
    {{ openbao_github_admin_permission_sets
       | zip(openbao_github_permission_set_checks.results | default([])) | list }}
  loop_control:
    label: "{{ item.0.name }}"
  no_log: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_github_engine_enabled | bool
    - >-
      (item.1.rc | default(1)) != 0
      or ((item.1.stdout | from_json).data.installation_id | int)
         != (item.0.installation_id | int)
      or ((item.1.stdout | from_json).data.permissions | default({}, true))
         != (item.0.permissions | default({}, true))
      or ((item.1.stdout | from_json).data.repositories | default([], true))
         != (item.0.repositories | default([], true))

# --- OAuthapp secrets engine (external, mounted; no credential configured) --
# The plugin binary was staged on every voter by main.yml. Its archive hash is
# pinned for integrity but does not provide publisher authentication.
