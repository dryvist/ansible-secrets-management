---
# Split out of 08-rbac-policies.yml to stay inside the per-file token budget.
# The seam is RENDER (there: build the desired content for every declared
# policy on the controller) vs RECONCILE (here: read what is actually stored
# and write only what differs). Included last from 08-rbac-policies.yml, so
# task order and names are unchanged from before the split.
# The reads and the write below run on the controller (openbao_cli_host, resolved in
# init/02). Measured on the target: 559s for the per-policy reads alone, one
# module execution per policy on proxmox_pct_remote. Same `bao` CLI, same
# rc/stdout/stderr, so the map build and the write gate below are unchanged.
# The roster live check (08a) runs only on a real converge, not under --check
# (openbao_roster_live_check_enabled), so in check mode its fact stays at the
# empty role default. That default also defines the name on every play, which is
# exactly why the old `is not defined` gate here never fired: the empty roster
# list then stood in for the live list, every per-policy read was skipped, and
# the check-mode report below listed unchanged policies as pending writes. Take
# the full list in check mode, where the roster list is never authoritative; an
# apply run keeps the roster audit's list as its source.
- name: List existing policies
  ansible.builtin.command:
    cmd: bao policy list -format=json
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  register: openbao_policies_raw
  no_log: true
  changed_when: false
  check_mode: false
  when:
    - openbao_bootstrap_token is defined
    - ansible_check_mode

- name: Resolve existing RBAC policy names from the roster audit or list result
  ansible.builtin.set_fact:
    openbao_existing_policy_names: >-
      {{ openbao_roster_live_policy_names
         if (openbao_roster_live_check_enabled | bool)
         else (openbao_policies_raw.stdout | default('[]', true) | from_json) }}
  when: openbao_bootstrap_token is defined

- name: Read existing RBAC policy contents
  ansible.builtin.command:
    cmd: "bao policy read -format=json {{ item.name }}"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  loop: >-
    {{ openbao_rbac_policy_targets }}
  loop_control:
    label: "{{ item.name }}"
  register: openbao_existing_policy_reads
  no_log: true
  changed_when: false
  check_mode: false
  # Every other probe in this file tolerates a non-zero rc; this one did not, so
  # a single denied read aborted the whole block before any policy was written.
  # The map build below already guards on `rc == 0`, so a failed read is an
  # expected, handled input -- not a reason to stop. The capability gate above
  # is what turns a genuine scope shortfall into a loud failure.
  failed_when: false
  when:
    - openbao_bootstrap_token is defined
    - item.name in openbao_existing_policy_names

- name: FAIL -- an existing RBAC policy read was DENIED, so absence cannot be concluded
  vars:
    _denied: >-
      {{ openbao_existing_policy_reads.results | default([])
         | rejectattr('skipped', 'defined')
         | selectattr('rc', 'defined')
         | rejectattr('rc', 'equalto', 0)
         | selectattr('stderr', 'search', '403')
         | map(attribute='item') | map(attribute='name') | list }}
  ansible.builtin.assert:
    that:
      - _denied | length == 0
    fail_msg: >-
      Existing RBAC policy reads were denied (403) for: {{ _denied | join(', ') }}.
      A denied read does not mean the policy is absent, so this run must not
      attempt a write based on that result.
    quiet: true
  when: openbao_bootstrap_token is defined

# Both sides are `trim`ed and read from the CORRECT key, because the write below
# is a no-op only when the two compare equal -- and it was never equal:
#
#   * `bao policy read -format=json` returns {"policy": ...} at TOP LEVEL. The
#     old expression read `.data.policy`, which does not exist, so every entry
#     resolved to '' and every policy looked changed on every converge.
#   * The server appends a trailing newline on write, so even with the right key
#     the stored text is the rendered text plus "\n" and an exact != is always
#     true.
#
# Measured live: rendered 475 bytes vs stored 476, differing only in that
# newline, `stripped_equal` true on every sampled policy. Either defect alone
# rewrites all 56 policies on every run while honestly reporting "changed", so
# fixing only one would have looked like a fix and changed nothing.
# Same O(n^2)-combine-loop fix as the render task above: build {key, value}
# pairs in a plain list (O(1) append) and dict-ify once at the end, rather
# than re-copying the accumulated dict on every one of ~60 iterations.
- name: Build the existing RBAC policy content map
  ansible.builtin.set_fact:
    openbao_existing_policy_map: "{{ _openbao_existing_policy_pairs | items2dict }}"
  vars:
    _openbao_existing_policy_pairs: >-
      {%- set _pairs = [] -%}
      {%- for result in (openbao_existing_policy_reads.results | default([])) -%}
      {%- if not (result.skipped | default(false)) and (result.rc | default(1)) == 0 -%}
      {%- set _policy = (result.stdout | default('{}') | from_json).policy -%}
      {%- set _ = _pairs.append(
          {'key': result.item.name, 'value': (_policy | default('') | trim)}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ _pairs }}
  no_log: true
  when: openbao_bootstrap_token is defined

- name: Resolve RBAC policies that are missing or changed
  ansible.builtin.set_fact:
    openbao_changed_policy_names: >-
      {%- set _names = [] -%}
      {%- for policy in openbao_rbac_policy_targets -%}
      {%- if policy.name not in openbao_existing_policy_names
         or (openbao_existing_policy_map | default({})).get(policy.name, '')
            != (openbao_rendered_policy_map | default({})).get(policy.name, '') -%}
      {%- set _ = _names.append(policy.name) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ _names }}
  when:
    - ansible_check_mode
    - openbao_bootstrap_token is defined

- name: Report RBAC policies that would be written in check mode
  ansible.builtin.debug:
    msg: >-
      {{ ('Would write RBAC policies: ' ~ (openbao_changed_policy_names | join(', ')))
         if openbao_changed_policy_names | length > 0
         else 'No RBAC policy writes are needed.' }}
  when:
    - ansible_check_mode
    - openbao_bootstrap_token is defined

- name: Report retired RBAC policies that would be deleted in check mode
  ansible.builtin.debug:
    msg: >-
      {{ ('Would delete retired RBAC policies: ' ~ (_retired | join(', ')))
         if _retired | length > 0
         else 'No retired RBAC policy deletes are needed.' }}
  vars:
    _retired: >-
      {{ openbao_retired_policies
         | select('in', openbao_existing_policy_names)
         | list
         + ([] if (openbao_reconcile_mode | default(false) | bool)
            else (openbao_existing_policy_names
                  | select('match', '^' ~ (openbao_retired_terrakube_prefix | regex_escape)) | list)) }}
  when:
    - openbao_select | default({}) | length == 0
    - ansible_check_mode
    - openbao_bootstrap_token is defined

# Selecting policy objects acknowledges their text changes. Full-set runs
# require an explicit selection before replacing existing policy text.
- name: Resolve existing RBAC policies whose rendered text differs from live
  ansible.builtin.set_fact:
    openbao_policy_text_changes: >-
      {%- set _names = [] -%}
      {%- for policy in openbao_reachable_policies -%}
      {%- if policy.name in openbao_existing_policy_names
         and (openbao_existing_policy_map | default({})).get(policy.name, '')
            != (openbao_rendered_policy_map | default({})).get(policy.name, '') -%}
      {%- set _ = _names.append(policy.name) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ _names | sort }}
  when:
    - openbao_bootstrap_token is defined
    - openbao_select | default({}) | length == 0

- name: Refuse policy text changes that are not acknowledged
  ansible.builtin.assert:
    that:
      - openbao_policy_text_changes | length == 0
    fail_msg: >-
      Existing RBAC policy text changes require selection:
      {{ openbao_policy_text_changes | join(', ') }}.
      Run exactly these policies with
      -e '{{ {"openbao_select": {"policies": openbao_policy_text_changes}} | to_json }}'.
    quiet: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_select | default({}) | length == 0

- name: Write the RBAC policies that are missing or changed
  ansible.builtin.command:
    cmd: "bao policy write {{ item.name }} -"
    stdin: "{{ (openbao_rendered_policy_map | default({}))[item.name] }}"
    stdin_add_newline: true
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  loop: >-
    {{ openbao_rbac_policy_targets }}
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  changed_when: true
  register: openbao_rbac_policy_write_results
  failed_when: >-
    (openbao_rbac_policy_write_results.rc | default(1) | int) != 0
    and not (
      openbao_reconcile_mode | default(false) | bool
      and item.name in openbao_reconcile_pinned_policy_names
    )
  when:
    - openbao_bootstrap_token is defined
    - >-
      item.name not in openbao_existing_policy_names
      or
      (openbao_existing_policy_map | default({})).get(item.name, '')
      !=
      (openbao_rendered_policy_map | default({})).get(item.name, '')

- name: Resolve pinned RBAC policy write outcomes
  ansible.builtin.set_fact:
    openbao_pinned_rbac_write_outcomes: >-
      {%- set denied = [] -%}
      {%- set other_failures = [] -%}
      {%- for result in (openbao_rbac_policy_write_results.results | default([])) -%}
      {%- if not (result.skipped | default(false))
         and result.item.name in openbao_reconcile_pinned_policy_names
         and (result.rc | default(1) | int) != 0 -%}
      {%- set message = result.stderr | default('') | lower -%}
      {%- set target = denied if 'permission denied' in message else other_failures -%}
      {%- set _ = target.append(result.item.name) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ {
        'permission_denied': denied | unique | sort | list,
        'other_failures': other_failures | unique | sort | list
      } }}
  when:
    - openbao_bootstrap_token is defined
    - openbao_reconcile_mode | default(false) | bool

- name: Fail when a pinned RBAC policy write has another error
  ansible.builtin.fail:
    msg: >-
      Pinned RBAC policy writes failed for reasons other than permission
      denied: {{ openbao_pinned_rbac_write_outcomes.other_failures | join(', ') }}.
  when:
    - openbao_bootstrap_token is defined
    - openbao_reconcile_mode | default(false) | bool
    - openbao_pinned_rbac_write_outcomes.other_failures | length > 0

- name: OpenBao pinned RBAC policies need a provisioning run
  ansible.builtin.debug:
    msg: >-
      needs provisioning run:
      {{ openbao_pinned_rbac_write_outcomes.permission_denied | join(', ') }}
  # Reported as changed: the converge telemetry counts ok and skipped alike, and the Splunk alert keys on changed>0.
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_reconcile_mode | default(false) | bool
    - openbao_pinned_rbac_write_outcomes.permission_denied | length > 0

# Named retired policies (07c-approle-undeclared-exceptions.yml) are deleted
# during reconcile. Prefix-discovered Terrakube policy cleanup requires a
# provisioning token because reconcile has no wildcard ACL grant.
- name: Delete retired RBAC policies that still exist
  ansible.builtin.command:
    cmd: "bao policy delete {{ item }}"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  loop: >-
    {{ openbao_retired_policies
       | select('in', openbao_existing_policy_names) | list
       + ([] if (openbao_reconcile_mode | default(false) | bool)
          else (openbao_existing_policy_names
                | select('match', '^' ~ (openbao_retired_terrakube_prefix | regex_escape)) | list)) }}
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_select | default({}) | length == 0
