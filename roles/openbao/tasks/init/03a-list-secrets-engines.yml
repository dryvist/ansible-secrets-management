---
# The enabled-engines listing that the engine, per-App mount and KV seed tasks
# read as openbao_mounts_raw. init.yml imports it on its own, tagged with each of
# those tasks' tags, so a scoped run (for example --tags github) registers the
# listing without running the KV seed in init/03. Runs on the controller (openbao_cli_host,
# init/02). Read-only, and failed_when: false, so it never changes the cluster or
# fails the run itself.
- name: List enabled secrets engines
  ansible.builtin.command:
    cmd: bao secrets list -format=json
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  register: openbao_mounts_raw
  no_log: true
  changed_when: false
  check_mode: false
  failed_when: false
  when: openbao_bootstrap_token is defined
