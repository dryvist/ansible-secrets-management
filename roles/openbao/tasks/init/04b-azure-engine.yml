---

- name: Read the staged Azure plugin binary sha256
  ansible.builtin.stat:
    path: "{{ openbao_plugin_dir }}/{{ openbao_azure_plugin_command }}"
    checksum_algorithm: sha256
  register: openbao_azure_plugin_stat
  when:
    - openbao_bootstrap_token is defined
    - openbao_azure_engine_enabled | bool

- name: Assert the Azure plugin binary is staged
  ansible.builtin.assert:
    that:
      - openbao_azure_plugin_stat.stat.exists
    fail_msg: >-
      {{ openbao_plugin_dir }}/{{ openbao_azure_plugin_command }} is missing —
      the staging phase in main.yml should have extracted it. Re-run the full
      role (not init in isolation).
  when:
    - openbao_bootstrap_token is defined
    - openbao_azure_engine_enabled | bool
    - not ansible_check_mode or openbao_azure_plugin_stat.stat.exists

- name: Check whether the Azure plugin is already registered
  ansible.builtin.command:
    cmd: >-
      bao plugin info -format=json
      -version={{ openbao_azure_plugin_catalog_version }}
      secret {{ openbao_azure_plugin_name }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  register: openbao_azure_plugin_check
  no_log: true
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - openbao_bootstrap_token is defined
    - openbao_azure_engine_enabled | bool

- name: Register the Azure plugin pinned to the staged binary sha256
  ansible.builtin.command:
    cmd: >-
      bao plugin register
      -sha256={{ openbao_azure_plugin_stat.stat.checksum }}
      -command={{ openbao_azure_plugin_command }}
      -version={{ openbao_azure_plugin_catalog_version }}
      secret {{ openbao_azure_plugin_name }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_azure_engine_enabled | bool
    - (openbao_azure_plugin_check.rc | default(1)) != 0

- name: Enable the Azure secrets engine
  ansible.builtin.command:
    cmd: >-
      bao secrets enable -path={{ openbao_azure_mount }}
      -plugin-version={{ openbao_azure_plugin_catalog_version }}
      {{ openbao_azure_plugin_name }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_azure_engine_enabled | bool
    - (openbao_azure_mount ~ '/') not in (openbao_mounts_raw.stdout | from_json).keys()

- name: Tune the Azure mount to the declared plugin version
  ansible.builtin.command:
    cmd: >-
      bao secrets tune -plugin-version={{ openbao_azure_plugin_catalog_version }}
      {{ openbao_azure_mount }}/
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  register: openbao_azure_plugin_tune
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_azure_engine_enabled | bool
    - (openbao_azure_mount ~ '/') in (openbao_mounts_raw.stdout | from_json).keys()
    - >-
      ((openbao_mounts_raw.stdout | from_json)[openbao_azure_mount ~ '/'].plugin_version
       | default('')) != openbao_azure_plugin_catalog_version

- name: Reload the Azure plugin across the Raft cluster after an upgrade
  ansible.builtin.command:
    cmd: "bao plugin reload -plugin={{ openbao_azure_plugin_name }} -scope=global"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_azure_engine_enabled | bool
    - >-
      openbao_azure_plugin_tune is changed
      or (openbao_azure_plugin_install_task | default({})) is changed

# The engine config holds the service principal OpenBao uses to mint client
# secrets.
- name: Check whether the Azure engine config already exists
  ansible.builtin.command:
    cmd: "bao read -format=json {{ openbao_azure_mount }}/config"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  register: openbao_azure_config_check
  no_log: true
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - openbao_bootstrap_token is defined
    - openbao_azure_engine_enabled | bool

# An unconfigured Azure mount still answers the config read, with an empty
# client_id, so the read result alone does not prove the config exists.
- name: Decide whether the Azure engine config is missing
  ansible.builtin.set_fact:
    openbao_azure_config_missing: >-
      {{ (openbao_azure_config_check.rc | default(1)) != 0
         or ((((openbao_azure_config_check.stdout | default('', true)) or '{}')
               | from_json).get('data') or {}).get('client_id', '') | length == 0 }}
  no_log: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_azure_engine_enabled | bool

- name: Refuse to leave the Azure engine mounted with no config and no service principal supplied
  ansible.builtin.fail:
    msg: >-
      The Azure secrets engine at {{ openbao_azure_mount }}/ has no config
      yet, and OPENBAO_AZURE_TENANT_ID/OPENBAO_AZURE_CLIENT_ID/
      OPENBAO_AZURE_CLIENT_SECRET/OPENBAO_AZURE_SUBSCRIPTION_ID are unset.
      Re-run with those env vars
      set, or set openbao_azure_engine_enabled: false to skip Azure entirely.
  when:
    - openbao_bootstrap_token is defined
    - openbao_azure_engine_enabled | bool
    - openbao_azure_config_missing | bool
    - >-
      (openbao_azure_tenant_id | length == 0)
      or (openbao_azure_client_id | length == 0)
      or (openbao_azure_client_secret | length == 0)
      or (openbao_azure_subscription_id | length == 0)

# Write-once: a routine converge never overwrites the engine config; rotation is
# a deliberate, separate operator action.
- name: Configure the Azure engine service principal (first configuration only)
  ansible.builtin.uri:
    url: "{{ openbao_cli_addr }}/v1/{{ openbao_azure_mount }}/config"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_bootstrap_token }}"
    body_format: json
    body:
      tenant_id: "{{ openbao_azure_tenant_id }}"
      client_id: "{{ openbao_azure_client_id }}"
      client_secret: "{{ openbao_azure_client_secret }}"
      subscription_id: "{{ openbao_azure_subscription_id }}"
    status_code:
      - 200
      - 204
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_azure_engine_enabled | bool
    - openbao_azure_config_missing | bool
    - openbao_azure_tenant_id | length > 0
    - openbao_azure_client_id | length > 0
    - openbao_azure_client_secret | length > 0
    - openbao_azure_subscription_id | length > 0

- name: Check whether the openbao-iac-admin Azure role already exists
  ansible.builtin.command:
    cmd: "bao read -format=json {{ openbao_azure_mount }}/roles/{{ openbao_azure_iac_admin_role_name }}"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  register: openbao_azure_iac_admin_role_check
  no_log: true
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - openbao_bootstrap_token is defined
    - openbao_azure_engine_enabled | bool
    - openbao_azure_iac_admin_application_object_id | length > 0

- name: Create the openbao-iac-admin Azure role (existing application, add-if-missing)
  ansible.builtin.command:
    cmd: >-
      bao write {{ openbao_azure_mount }}/roles/{{ openbao_azure_iac_admin_role_name }}
      application_object_id={{ openbao_azure_iac_admin_application_object_id }}
      ttl={{ openbao_azure_iac_admin_ttl }}
      max_ttl={{ openbao_azure_iac_admin_ttl }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - openbao_azure_engine_enabled | bool
    - openbao_azure_iac_admin_application_object_id | length > 0
    - (openbao_azure_iac_admin_role_check.rc | default(1)) != 0
