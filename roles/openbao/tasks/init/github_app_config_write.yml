---
# Write one GitHub App mount's credentials. Parameters:
#   openbao_github_app_config_mount        the mount to configure
#   openbao_github_app_config_app_id       the App ID
#   openbao_github_app_config_private_key  the App private key (PEM)
- name: "Write the App credentials on mount {{ openbao_github_app_config_mount }}"
  ansible.builtin.uri:
    url: "{{ openbao_cli_addr }}/v1/{{ openbao_github_app_config_mount }}/config"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_bootstrap_token }}"
    body_format: json
    body:
      app_id: "{{ openbao_github_app_config_app_id | int | string }}"
      prv_key: "{{ openbao_github_app_config_private_key }}"
      exclude_repository_metadata: true
    status_code:
      - 200
      - 204
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  no_log: true
