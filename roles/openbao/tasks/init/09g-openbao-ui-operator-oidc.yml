---
# Normal human login for the OpenBao UI and CLI. This OIDC mount and role are
# independent of the phone-approved JWT elevation mount and its break-glass
# policies.

- name: Refuse a conflicting auth method at the operator OIDC path
  ansible.builtin.assert:
    that:
      - _operator_oidc_mount not in _operator_auth_methods or _operator_oidc_type == 'oidc'
    fail_msg: >-
      Auth path {{ openbao_operator_oidc_auth_path }}/ is already occupied by
      {{ _operator_oidc_type | default('an unknown auth method') }}, not OIDC.
      Refusing to replace or reuse that mount.
    quiet: true
  vars:
    _operator_auth_methods: "{{ openbao_auth_raw.stdout | from_json }}"
    _operator_oidc_mount: "{{ openbao_operator_oidc_auth_path ~ '/' }}"
    _operator_oidc_type: "{{ _operator_auth_methods.get(_operator_oidc_mount, {}).get('type', '') }}"
  when: openbao_bootstrap_token is defined

- name: Assert the OpenBao UI OIDC inputs and generated secret are available
  ansible.builtin.assert:
    that:
      - openbao_authelia_jwt_issuer | length > 0
      - openbao_authelia_operator_group | length > 0
      - openbao_operator_oidc_public_url is match('^https://[^/]+$')
      - openbao_operator_oidc_client_secret_field in openbao_generated_app_secrets.authelia
    fail_msg: >-
      Set OPENBAO_AUTHELIA_ISSUER_URL, OPENBAO_AUTHELIA_OPERATOR_GROUP and
      BAO_ADDR (the public OpenBao HTTPS base URL). The OpenBao UI OIDC client
      secret must also be declared in openbao_generated_app_secrets.authelia.
    quiet: true
  when: openbao_bootstrap_token is defined

- name: Enable the OpenBao UI OIDC auth method
  ansible.builtin.command:
    cmd: "bao auth enable -path={{ openbao_operator_oidc_auth_path }} oidc"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  no_log: true
  changed_when: true
  when:
    - openbao_bootstrap_token is defined
    - (openbao_operator_oidc_auth_path ~ '/') not in (openbao_auth_raw.stdout | from_json).keys()

- name: Read the Authelia OpenBao UI client secret from OpenBao
  ansible.builtin.command:
    cmd: >-
      bao kv get -field={{ openbao_operator_oidc_client_secret_field }}
      {{ openbao_kv_mount }}/{{
      authelia_oidc_openbao_ui_client_secret_path
      | default(openbao_generated_app_secret_paths.get('authelia', 'apps/authelia'), true) }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  register: openbao_operator_oidc_client_secret
  no_log: true
  changed_when: false
  check_mode: false
  when: openbao_bootstrap_token is defined

- name: Configure Authelia as the OpenBao UI OIDC provider
  ansible.builtin.command:
    cmd: "bao write auth/{{ openbao_operator_oidc_auth_path }}/config -"
    stdin: >-
      {{ {'oidc_discovery_url': openbao_operator_oidc_discovery_url,
            'oidc_client_id': openbao_operator_oidc_client_id,
            'oidc_client_secret': openbao_operator_oidc_client_secret.stdout,
            'default_role': openbao_operator_oidc_role_name} | to_json }}
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  no_log: true
  changed_when: true
  when: openbao_bootstrap_token is defined

- name: Reconcile the OpenBao UI operator OIDC role
  ansible.builtin.command:
    cmd: >-
      bao write auth/{{ openbao_operator_oidc_auth_path }}/role/{{
      openbao_operator_oidc_role_name }} -
    stdin: "{{ _operator_oidc_role | to_json }}"
  environment:
    BAO_ADDR: "{{ openbao_cli_addr }}"
    BAO_TOKEN: "{{ openbao_bootstrap_token }}"
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  vars:
    ansible_become: "{{ openbao_cli_become }}"
    _operator_oidc_role: >-
      {{ lookup('ansible.builtin.template', 'openbao-ui-operator-oidc-role.json.j2')
         | from_json }}
  no_log: true
  changed_when: true
  when: openbao_bootstrap_token is defined
