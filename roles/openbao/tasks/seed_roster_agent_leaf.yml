---
# Seeds one roster agent or registry caller key leaf (apps/<agent> or
# apps/<agent>-gw). Its KV custom metadata names the owner. This file does its own
# token and owner checks, so the result does not depend on task order or on 08a running.
- name: Skip the roster key leaf seed in check mode
  ansible.builtin.debug:
    msg: >-
      Roster key leaf seed skipped for apps/{{ openbao_seed_app }}: it needs the
      converge token and runs only on a real converge.
  when: openbao_roster_live_check_mode | bool

- name: Seed the roster key leaf after its owner check
  when: not (openbao_roster_live_check_mode | bool)
  block:
    - name: Refuse roster writes without a converge token
      ansible.builtin.include_tasks:
        file: roster_converge_token_assert.yml

    - name: Read the roster key leaf's KV metadata
      ansible.builtin.command:
        cmd: "bao kv metadata get -format=json {{ openbao_kv_mount }}/apps/{{ openbao_seed_app }}"
      environment:
        BAO_ADDR: "{{ openbao_cli_addr }}"
        BAO_TOKEN: "{{ openbao_bootstrap_token }}"
      delegate_to: "{{ openbao_cli_host }}"
      become: "{{ openbao_cli_become }}"
      vars:
        ansible_become: "{{ openbao_cli_become }}"
      register: openbao_seed_leaf_metadata
      failed_when:
        - openbao_seed_leaf_metadata.rc != 0
        - openbao_absent_stderr_marker not in (openbao_seed_leaf_metadata.stderr | default(''))
      changed_when: false
      check_mode: false
      no_log: true

    - name: Write the roster key leaf with its owner marker
      ansible.builtin.include_tasks:
        file: seed_roster_agent_leaf_owner.yml
        apply:
          tags:
            - openbao_kv_seed
      tags:
        - openbao_kv_seed
