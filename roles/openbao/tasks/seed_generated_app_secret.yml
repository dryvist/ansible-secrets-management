---
# Adapt the existing field-name map to the shared seed_generated interface.
# The source map stays a list of names because policies and consumers use it
# directly; generation-only details live here at the write boundary.
- name: Reset the shared app-secret field declarations
  ansible.builtin.set_fact:
    openbao_seed_shared_fields: []

- name: Add a shared declaration for each generated app-secret field
  ansible.builtin.set_fact:
    openbao_seed_shared_fields: >-
      {{ openbao_seed_shared_fields + [
           {
             'name': item,
             'length': (openbao_app_secret_username_length
                        if item.endswith(openbao_app_secret_username_suffix)
                        else openbao_app_secret_key_length if item == 'secret_key'
                        else openbao_app_secret_length),
             'charset': ('lower_alpha'
                         if item.endswith(openbao_app_secret_username_suffix)
                         else 'alnum'),
             'prefix': (openbao_app_secret_router_key_prefix
                        if (item.endswith(openbao_app_secret_router_key_suffix)
                            or item in openbao_app_secret_router_key_fields)
                        else '')
           }
           | combine(
               {'valid_pattern': '^sk-'}
               if (item.endswith(openbao_app_secret_router_key_suffix)
                   or item in openbao_app_secret_router_key_fields)
               else {}
             )
         ] }}
  loop: "{{ openbao_seed_fields }}"
  loop_control:
    label: "{{ item }}"
  no_log: true

- name: Seed the generated app secret through the shared contract
  delegate_to: "{{ openbao_cli_host }}"
  become: "{{ openbao_cli_become }}"
  delegate_facts: false
  vars:
    ansible_become: "{{ openbao_cli_become }}"
  block:
    - name: Call shared generate-if-absent seeding
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
        apply:
          tags:
            - openbao_kv_seed
      vars:
        openbao_secrets_seed_addr: "{{ openbao_cli_addr }}"
        openbao_secrets_seed_token: "{{ openbao_bootstrap_token }}"
        openbao_secrets_seed_mount: "{{ openbao_kv_mount }}"
        openbao_secrets_seed_path: "{{ openbao_seed_app_path }}"
        openbao_secrets_seed_fields: "{{ openbao_seed_shared_fields }}"
        openbao_secrets_seed_rotate_fields: >-
          {{ (openbao_seed_rotate_fields | default([]))
             | intersect(openbao_seed_fields) }}
        openbao_secrets_seed_register: openbao_seed_final_values

- name: Accumulate final generated app-secret values for later callers
  ansible.builtin.set_fact:
    openbao_seeded_app_secret_values: >-
      {{ (openbao_seeded_app_secret_values | default({}))
         | combine({openbao_seed_app: openbao_seed_final_values}) }}
  no_log: true
