---
- name: Validate the Azure role list
  ansible.builtin.assert:
    that:
      - openbao_azure_roles is sequence
      - openbao_azure_roles is not string
      - openbao_azure_roles | select('mapping') | list | length == openbao_azure_roles | length
      - openbao_azure_roles | map(attribute='name', default='') | unique | list | length == openbao_azure_roles | length
      - openbao_azure_tenant_id | length > 0
    fail_msg: >-
      Azure role input must be a JSON list of unique role objects, and
      OPENBAO_AZURE_TENANT_ID must be supplied when roles are declared.
  no_log: true
  when: openbao_azure_engine_enabled | bool

- name: Validate each Azure role object
  ansible.builtin.assert:
    that:
      - item.name | default('') | string is match('^[A-Za-z0-9_-]+$')
      - item.application_object_id is defined
      - item.application_object_id is string
      - item.application_object_id | length == 36
      - item.application_object_id | replace('-', '') is match('^[0-9a-fA-F]{32}$')
      - item.application_object_id.split('-') | map('length') | list == [8, 4, 4, 4, 12]
      - item.ttl is string
      - item.ttl | length > 0
      - item.max_ttl is string
      - item.max_ttl | length > 0
      - item.gated is boolean
    fail_msg: "An Azure role object has invalid fields."
  loop: "{{ openbao_azure_roles }}"
  loop_control:
    label: role
  no_log: true
  when: openbao_azure_engine_enabled | bool

- name: Assert the Azure role and policy names are unique
  ansible.builtin.assert:
    that:
      - openbao_approles | map(attribute='name') | unique | list | length == openbao_approles | length
      - openbao_policies | map(attribute='name') | unique | list | length == openbao_policies | length
    fail_msg: "Azure role input conflicts with an existing OpenBao declaration."
  no_log: true
  when: openbao_azure_engine_enabled | bool

# --- Phase 5c: stage the AWS secrets engine plugin (external, all nodes) -----
# The AWS engine is not builtin (see defaults) — stage its checksum-verified
# release tarball from the controller exactly like the server .deb, on EVERY
# node: the plugin catalog is cluster-replicated but each node execs its OWN
# copy of the binary, which must match the registered sha256.
#
# Every controller-side staging task here carries `check_mode: false`. Ansible
# skips a delegated get_url/command under --check, but the tasks that read
# what it staged — `file` lookups, checksum asserts, signature verification —
# have no check-mode of their own and fail on a path that was never created.
# Without these the role could not be dry-run at all. They touch only the
# controller's own scratch space, so running them under --check changes
# nothing on any managed host.
- name: Stage the AWS plugin checksums file on controller
  ansible.builtin.get_url:
    url: "{{ openbao_aws_plugin_checksums_url }}"
    dest: "/tmp/openbao-{{ openbao_aws_plugin_release_tag }}-checksums.txt"
    mode: "0644"
    force: true
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  run_once: true
  when: openbao_aws_engine_enabled | bool
  check_mode: false

- name: Stage the AWS plugin detached signature on controller
  ansible.builtin.get_url:
    url: "{{ openbao_aws_plugin_signature_url }}"
    dest: "/tmp/{{ openbao_aws_plugin_tarball }}.sig"
    mode: "0644"
    force: true
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  run_once: true
  when: openbao_aws_engine_enabled | bool
  check_mode: false

- name: Build the OpenBao release verification keyring on controller
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --yes
      - --dearmor
      - --output
      - /tmp/openbao-release.gpg
      - "{{ role_path }}/files/openbao-release.asc"
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  run_once: true
  changed_when: false
  when: openbao_aws_engine_enabled | bool or openbao_azure_engine_enabled | bool
  check_mode: false

- name: Read the expected SHA256 values for the AWS plugin release
  ansible.builtin.set_fact:
    openbao_aws_plugin_sha256: >-
      {{ (lookup('file', '/tmp/openbao-' ~ openbao_aws_plugin_release_tag ~ '-checksums.txt')
          | regex_search('([0-9a-f]{64})\s+' ~ (openbao_aws_plugin_tarball | regex_escape), '\1')
          | first) }}
    openbao_aws_plugin_binary_sha256: >-
      {{ (lookup('file', '/tmp/openbao-' ~ openbao_aws_plugin_release_tag ~ '-checksums.txt')
          | regex_search('([0-9a-f]{64})\s+' ~ (openbao_aws_plugin_binary | regex_escape) ~ '$', '\1', multiline=True)
          | first) }}
  run_once: true
  when: openbao_aws_engine_enabled | bool

- name: Assert a checksum was found for the AWS plugin tarball
  ansible.builtin.assert:
    that:
      - openbao_aws_plugin_sha256 is defined
      - openbao_aws_plugin_sha256 | length == 64
      - openbao_aws_plugin_binary_sha256 is defined
      - openbao_aws_plugin_binary_sha256 | length == 64
    fail_msg: >-
      Could not find a SHA256 for {{ openbao_aws_plugin_tarball }} in the
      upstream checksums file. Did the asset naming change for
      {{ openbao_aws_plugin_release_tag }}?
  run_once: true
  when: openbao_aws_engine_enabled | bool

- name: Stage the AWS plugin tarball on controller (checksum-verified)
  ansible.builtin.get_url:
    url: "{{ openbao_aws_plugin_tarball_url }}"
    dest: "/tmp/{{ openbao_aws_plugin_tarball }}"
    checksum: "sha256:{{ openbao_aws_plugin_sha256 }}"
    mode: "0644"
    force: true
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  run_once: true
  when: openbao_aws_engine_enabled | bool
  check_mode: false

- name: Verify the AWS plugin release signature
  ansible.builtin.command:
    argv:
      - gpgv
      - --keyring
      - /tmp/openbao-release.gpg
      - "/tmp/{{ openbao_aws_plugin_tarball }}.sig"
      - "/tmp/{{ openbao_aws_plugin_tarball }}"
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  run_once: true
  changed_when: false
  when: openbao_aws_engine_enabled | bool
  check_mode: false

- name: Extract the AWS plugin binary into the plugin directory
  ansible.builtin.unarchive:
    src: "/tmp/{{ openbao_aws_plugin_tarball }}"
    dest: "{{ openbao_plugin_dir }}"
    include:
      - "{{ openbao_aws_plugin_binary }}"
    owner: root
    group: "{{ openbao_group }}"
    mode: "0750"
  when: openbao_aws_engine_enabled | bool

- name: Verify the extracted AWS plugin binary
  ansible.builtin.stat:
    path: "{{ openbao_plugin_dir }}/{{ openbao_aws_plugin_binary }}"
    checksum_algorithm: sha256
  register: openbao_aws_extracted_plugin
  when: openbao_aws_engine_enabled | bool

- name: Assert the extracted AWS plugin matches the signed release
  ansible.builtin.assert:
    that:
      - openbao_aws_extracted_plugin.stat.checksum == openbao_aws_plugin_binary_sha256
    fail_msg: "The extracted AWS plugin SHA256 does not match the signed release manifest"
  when: openbao_aws_engine_enabled | bool

- name: Install the immutable AWS plugin command
  ansible.builtin.copy:
    src: "{{ openbao_plugin_dir }}/{{ openbao_aws_plugin_binary }}"
    dest: "{{ openbao_plugin_dir }}/{{ openbao_aws_plugin_command }}"
    remote_src: true
    owner: root
    group: "{{ openbao_group }}"
    mode: "0750"
  register: openbao_aws_plugin_install_task
  when: openbao_aws_engine_enabled | bool

