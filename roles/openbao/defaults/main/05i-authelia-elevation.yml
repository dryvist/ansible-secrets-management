---
# Phone-approved elevation. Authelia approves a device-code login and issues an
# OIDC token; OpenBao trades that token at auth/authelia/login for a short-lived
# token scoped to exactly one policy. The issuer and the operator subject arrive
# by environment and are never committed.
# Off by default. When true, the converge requires OPENBAO_AUTHELIA_ISSUER_URL,
# OPENBAO_ELEVATE_SUBJECT and the workstation CIDR class.
openbao_authelia_elevation_enabled: false
openbao_authelia_jwt_auth_path: authelia
# Empty when unset. 09e-authelia-elevation.yml asserts it is non-empty before
# any write, so an unset variable fails the converge instead of configuring a
# malformed issuer.
openbao_authelia_jwt_issuer: "{{ lookup('env', 'OPENBAO_AUTHELIA_ISSUER_URL') | default('', true) }}"
# The `sub` claim of the operator's Authelia identity.
openbao_elevate_subject: "{{ lookup('env', 'OPENBAO_ELEVATE_SUBJECT') | default('', true) }}"
openbao_human_unlock_untrusted_policy_name: human-unlock-untrusted
openbao_elevate_token_ttl: 5m
openbao_elevate_token_max_ttl: 5m
# Maximum age, in seconds, of the Authelia authentication accepted at login.
openbao_elevate_max_age: 120
# One JWT role per client. The audience is the Authelia client id; the policy
# is the only grant the resulting token carries.
openbao_elevate_roles:
  - name: elevate-trusted
    audience: bao-elevate-trusted
    policy: "{{ openbao_human_unlock_policy_name }}"
  - name: elevate-untrusted
    audience: bao-elevate-untrusted
    policy: "{{ openbao_human_unlock_untrusted_policy_name }}"
  - name: elevate-policy-sync
    audience: bao-elevate-policy-sync
    policy: "{{ openbao_policy_sync_unlock_policy_name }}"
