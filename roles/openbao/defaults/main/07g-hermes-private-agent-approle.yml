---
openbao_hermes_guest_agent_approle_defaults:
  secret_id_num_uses: "{{ openbao_approle_secret_id_num_uses }}"
  token_ttl: "{{ openbao_approle_token_ttl }}"
  token_max_ttl: "{{ openbao_approle_token_max_ttl }}"
  manage_secret_id: false
openbao_hermes_private_agent_approles: >-
  {{ ([openbao_hermes_guest_agent_approle_defaults | combine({
        'name': openbao_hermes_private_agent_approle_name,
        'policy': openbao_hermes_private_agent_policy_name,
        'secret_id_bound_cidrs': openbao_hermes_private_agent_secret_id_cidr})]
     if openbao_hermes_private_agent_secret_id_cidr | length > 0 else []) }}
openbao_pepper_approles: >-
  {{ ([openbao_hermes_guest_agent_approle_defaults | combine({
        'name': openbao_pepper_approle_name,
        'policy': openbao_pepper_policy_name,
        'secret_id_bound_cidrs': openbao_pepper_secret_id_cidr})]
     if openbao_pepper_secret_id_cidr | length > 0 else []) }}
