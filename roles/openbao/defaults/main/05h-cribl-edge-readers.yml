---
openbao_cribl_edge_mac_a_app: cribl-edge-macbook
openbao_cribl_edge_mac_b_app: cribl-edge-mac-studio
openbao_cribl_edge_mac_a_policy_name: cribl-edge-mac-a
openbao_cribl_edge_mac_a_approle_name: cribl-edge-mac-a
openbao_cribl_edge_mac_b_policy_name: cribl-edge-mac-b
openbao_cribl_edge_mac_b_approle_name: cribl-edge-mac-b
# Account-wide RustFS admin credential, outside secret/apps/*.
openbao_rustfs_admin_kv_path: infra/rustfs
openbao_hatchet_killtest_policy_name: hatchet-killtest
openbao_hatchet_killtest_approle_name: hatchet-killtest
# Outside secret/apps/*, which standing AI readers cover.
openbao_hatchet_killtest_kv_path: killtest/hatchet
# Authelia's signing and session material: the OIDC JWKS key, HMAC, JWT,
# session and storage keys, and the bootstrap password. Only human-gated
# identities and the apps/* writers read it
# (tests/test_openbao_authelia_signing_reach.py). The authelia role seeds this
# leaf (authelia_service_secrets_kv_path); a test keeps the two values equal.
openbao_authelia_service_secrets_kv_path: apps/authelia-signing
# The seed writer's own grant on that leaf. A separate policy, attached to the
# seed-writer AppRole only: the shared converge policy is also carried by semaphore.
openbao_authelia_signing_writer_policy_name: authelia-signing-writer
# Explicit deny on that leaf for iac-platform-deploy, a standing CI identity that
# reads apps/* through read-apps. Attached to that AppRole only.
openbao_iac_platform_deploy_signing_deny_policy_name: iac-platform-deploy-signing-deny
# Credentials that trigger external actions must stay outside ambient AI reads.
# Add future actuating leaves here; the AI global-read policy denies each one.
openbao_actuating_credential_leaves:
  - "{{ openbao_hatchet_killtest_kv_path }}"
  - "{{ openbao_rustfs_admin_kv_path }}"
  - "{{ openbao_fan_control_write_kv_path }}"
  - "{{ openbao_authelia_service_secrets_kv_path }}"
# Only the kill-test leaf has a parent dedicated to actuating credentials.
openbao_actuating_credential_dedicated_parents:
  - "{{ openbao_hatchet_killtest_kv_path | dirname }}"
openbao_apps_read_excluded_generated_apps:
  - "{{ openbao_cribl_edge_mac_a_app }}"
  - "{{ openbao_cribl_edge_mac_b_app }}"
  # Read only by the ci-resolver AppRole (github-ci-resolver-policy.hcl.j2).
  - ci-resolver
openbao_cribl_edge_mac_approle_names:
  - "{{ openbao_cribl_edge_mac_a_approle_name }}"
  - "{{ openbao_cribl_edge_mac_b_approle_name }}"
