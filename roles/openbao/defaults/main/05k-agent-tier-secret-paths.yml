---
# One exact-leaf reader, AppRole, and generated field declaration per agent tier.
openbao_agent_tier_mount: agent-tier
openbao_app_agent_tier_readers:
  - tier: vikunja-read
    trust_class: untrusted-sandbox
    cidr_class: machine_or_workstation
    legacy_app_path: apps/vikunja
    login_path: vikunja-read-login
    login_fields: [vikunja_agent_read_password]
  - tier: vikunja-write
    trust_class: trusted-agent-read
    cidr_class: machine_or_workstation
    legacy_app_path: apps/vikunja
    login_path: vikunja-write-login
    login_fields: [vikunja_agent_write_password]
  - tier: zammad-write
    trust_class: trusted-agent-read
    cidr_class: machine_or_workstation
    legacy_app_path: apps/zammad
    generated_fields: [zammad_agent_write_api_token]
openbao_app_agent_tier_paths: >-
  {{ openbao_app_agent_tier_readers | map(attribute='tier') | list }}
openbao_app_agent_tier_login_paths: >-
  {{ openbao_app_agent_tier_readers | selectattr('login_path', 'defined')
     | map(attribute='login_path') | list }}
