---
# The fleet PR reconcile workflow authenticates through GitHub Actions OIDC;
# it carries no stored runner credential.
openbao_github_pr_reconcile_policy_name: pr-reconcile-sweep
openbao_github_pr_reconcile_audience: openbao
openbao_github_pr_reconcile_repository: >-
  {{ lookup('env', 'OPENBAO_GITHUB_PR_RECONCILE_REPOSITORY') | default('', true) | trim }}
openbao_github_pr_reconcile_workflow_file: .github/workflows/pr-reconcile-sweep.yml
openbao_github_pr_reconcile_ref: refs/heads/main
openbao_github_pr_reconcile_workflow_ref: >-
  {{ openbao_github_pr_reconcile_repository ~ '/' ~ openbao_github_pr_reconcile_workflow_file
     ~ '@' ~ openbao_github_pr_reconcile_ref }}
openbao_github_pr_reconcile_event_names: [schedule, workflow_dispatch]
openbao_github_pr_reconcile_runner_environment: self-hosted
openbao_github_pr_reconcile_token_ttl: 5m
openbao_github_pr_reconcile_token_max_ttl: 10m

# Owners whose everyday-App installation the sweep may mint for, by name.
openbao_pr_reconcile_owners: >-
  {{ (lookup('env', 'OPENBAO_GITHUB_PR_RECONCILE_OWNERS') | default('', true)).split(',')
     | map('trim') | reject('equalto', '') | list }}
openbao_github_pr_reconcile_enabled: >-
  {{ openbao_github_pr_reconcile_repository | length > 0 and openbao_pr_reconcile_owners | length > 0 }}

openbao_github_pr_reconcile_permissions:
  contents: write
  issues: write
  pull_requests: write
  statuses: write

# Declared only while both inputs are set. Unset, the policy is retired (deleted
# if it exists) and the OIDC role is removed, so an empty owner list can never
# render an allow-anything org_name constraint.
openbao_pr_reconcile_policies: >-
  {{ [{'name': openbao_github_pr_reconcile_policy_name,
       'template': 'pr-reconcile-sweep-policy.hcl.j2'}]
     if openbao_github_pr_reconcile_enabled | bool else [] }}
