---
# Random length/format tunables for seed_generated_app_secret.yml. Split out
# of 01-kv-hierarchy-and-rbac.yml, which was at its token budget.

# Random length for generated app credentials (alnum). secret_key needs more
# entropy than a login credential, so it gets its own length (matches the 64-char
# key the nautobot role generates locally when none is supplied).
openbao_app_secret_length: 40
openbao_app_secret_key_length: 64
# A generated *_username is a real login name, so it is lowercase-only and
# short enough for the 32-character limit Linux enforces. 16 lowercase letters
# is ~75 bits, which is far more than a login name needs to be unguessable.
openbao_app_secret_username_suffix: _username
openbao_app_secret_username_length: 16
# LiteLLM virtual-key format; see seed_generated_app_secret.yml.
openbao_app_secret_router_key_suffix: _llm_router_key
openbao_app_secret_router_key_fields: [router_key, claude_ocg_router_key]
openbao_app_secret_router_key_prefix: "sk-"
# Per-field format rules an app enforces on a generated value. A stored value
# that fails its pattern is regenerated by the shared seed_generated contract.
openbao_app_secret_valid_patterns:
  # Hatchet admin login: 8-64 characters with an uppercase, a lowercase and a digit.
  hatchet_admin_password: '^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{8,64}$'
# On-demand rotation switch for seed_generated_app_secret.yml: empty on every
# ordinary converge. Pass field name(s) via -e in JSON form to force a regenerate, e.g.
# -e '{"openbao_seed_rotate_fields":["n8n_llm_router_key"]}'.
openbao_seed_rotate_fields: []
# The rotate request as a list. A key=value -e passes a string, so parse it.
openbao_seed_rotate_list: >-
  {{ (openbao_seed_rotate_fields | from_yaml | default([], true))
     if openbao_seed_rotate_fields is string
     else openbao_seed_rotate_fields }}
# Every field name the generate-if-absent seed tasks can write.
openbao_seed_rotate_known_fields: >-
  {{ (openbao_seeded_generated_app_secrets
      | combine(openbao_roster_agent_generated_app_secrets,
                openbao_caller_gateway_generated_app_secrets)).values()
     | flatten | unique }}
