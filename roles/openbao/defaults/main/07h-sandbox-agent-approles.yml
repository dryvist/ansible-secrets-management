---
# Per-job identities: no stored SecretID is issued during a converge. The
# dispatcher mints one wrapped SecretID for the selected read or write role.
openbao_sandbox_agent_approles:
  - name: "{{ openbao_sandbox_agent_read_approle_name }}"
    policy: "{{ openbao_sandbox_agent_read_policy_name }}"
    secret_id_bound_cidrs: "{{ openbao_sandbox_agent_cidrs }}"
    secret_id_ttl: 15m
    secret_id_num_uses: 1
    token_ttl: 15m
    token_max_ttl: 60m
    manage_secret_id: false
  - name: "{{ openbao_sandbox_agent_write_approle_name }}"
    policy: "{{ openbao_sandbox_agent_write_policy_name }}"
    secret_id_bound_cidrs: "{{ openbao_sandbox_agent_cidrs }}"
    secret_id_ttl: 15m
    secret_id_num_uses: 1
    token_ttl: 15m
    token_max_ttl: 60m
    manage_secret_id: false
  - name: "{{ openbao_sandbox_zcode_read_approle_name }}"
    policy: "{{ openbao_sandbox_zcode_read_policy_name }}"
    secret_id_bound_cidrs: "{{ openbao_sandbox_agent_cidrs }}"
    secret_id_ttl: 15m
    secret_id_num_uses: 1
    token_ttl: 15m
    token_max_ttl: 60m
    manage_secret_id: false
  - name: "{{ openbao_sandbox_zcode_write_approle_name }}"
    policy: "{{ openbao_sandbox_zcode_write_policy_name }}"
    secret_id_bound_cidrs: "{{ openbao_sandbox_agent_cidrs }}"
    secret_id_ttl: 15m
    secret_id_num_uses: 1
    token_ttl: 15m
    token_max_ttl: 60m
    manage_secret_id: false
  - name: "{{ openbao_sandbox_opencode_read_approle_name }}"
    policy: "{{ openbao_sandbox_opencode_read_policy_name }}"
    secret_id_bound_cidrs: "{{ openbao_sandbox_agent_cidrs }}"
    secret_id_ttl: 15m
    secret_id_num_uses: 1
    token_ttl: 15m
    token_max_ttl: 60m
    manage_secret_id: false
  - name: "{{ openbao_sandbox_opencode_write_approle_name }}"
    policy: "{{ openbao_sandbox_opencode_write_policy_name }}"
    secret_id_bound_cidrs: "{{ openbao_sandbox_agent_cidrs }}"
    secret_id_ttl: 15m
    secret_id_num_uses: 1
    token_ttl: 15m
    token_max_ttl: 60m
    manage_secret_id: false

# The router holds one reader credential for each exact agent-tier leaf.
# Write-tier identities require trusted callers; SecretIDs use the existing
# rotated domain-identity lifecycle consumed by the router.
openbao_app_agent_tier_reader_approles: >-
  {%- set _entries = [] -%}
  {%- for reader in openbao_app_agent_tier_readers -%}
  {%- set _name = 'app-agent-' ~ reader.tier -%}
  {%- set _ = _entries.append({
      'name': _name, 'policy': _name,
      'secret_id_bound_cidrs': openbao_approle_cidr_classes[reader.cidr_class],
      'secret_id_ttl': '0s', 'secret_id_num_uses': 0,
      'token_ttl': '15m', 'token_max_ttl': '15m'}) -%}
  {%- endfor -%}
  {{ _entries }}
