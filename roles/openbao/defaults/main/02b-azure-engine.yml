---
openbao_azure_mount: azure
openbao_azure_plugin_name: azure
openbao_azure_tenant_id: >-
  {{ lookup('env', 'OPENBAO_AZURE_TENANT_ID') | default('', true) }}
openbao_azure_roles_json: >-
  {{ lookup('env', 'OPENBAO_AZURE_ROLES') | default('', true) }}
openbao_azure_roles: >-
  {{ openbao_azure_roles_json | default('[]', true) | from_json }}
openbao_azure_engine_enabled: "{{ openbao_azure_roles_json | length > 0 }}"

# renovate: datasource=github-releases depName=openbao/openbao-plugins
openbao_azure_plugin_version: "0.23.0"
openbao_azure_plugin_catalog_version: "v{{ openbao_azure_plugin_version }}"
openbao_azure_plugin_release_base_url: "https://github.com/openbao/openbao-plugins/releases/download"
openbao_azure_plugin_release_tag: "secrets-azure-v{{ openbao_azure_plugin_version }}"
openbao_azure_plugin_tarball: "openbao-plugin-secrets-azure_linux_amd64_v1.tar.gz"
openbao_azure_plugin_binary: "openbao-plugin-secrets-azure_linux_amd64_v1"
openbao_azure_plugin_command: "{{ openbao_azure_plugin_binary }}-v{{ openbao_azure_plugin_version }}"
openbao_azure_plugin_checksums_filename: "checksums-secrets-azure.txt"
openbao_azure_plugin_checksums_url: >-
  {{ openbao_azure_plugin_release_base_url }}/{{ openbao_azure_plugin_release_tag
  }}/{{ openbao_azure_plugin_checksums_filename }}
openbao_azure_plugin_tarball_url: >-
  {{ openbao_azure_plugin_release_base_url }}/{{ openbao_azure_plugin_release_tag
  }}/{{ openbao_azure_plugin_tarball }}
openbao_azure_plugin_signature_url: "{{ openbao_azure_plugin_tarball_url }}.sig"

openbao_azure_role_policies: >-
  {%- set _entries = [] -%}
  {%- for role in (openbao_azure_roles | default([], true))
      if role is mapping and role.get('name') is string -%}
  {%- set _ = _entries.append({'name': 'azure-' ~ role.name,
      'template': 'azure-creds-policy.hcl.j2', 'azure_role_name': role.name}) -%}
  {%- endfor -%}
  {{ _entries }}

openbao_azure_workload_approles: >-
  {%- set _entries = [] -%}
  {%- for role in (openbao_azure_roles | default([], true))
      if role is mapping and role.get('name') is string
      and not role.get('gated', false) -%}
  {%- set _ = _entries.append({'name': role.name, 'policy': 'azure-' ~ role.name}) -%}
  {%- endfor -%}
  {{ _entries }}

openbao_azure_gated_approles: >-
  {%- set _entries = [] -%}
  {%- for role in (openbao_azure_roles | default([], true))
      if role is mapping and role.get('name') is string
      and role.get('gated', false) -%}
  {%- set _ = _entries.append({'name': role.name, 'policy': 'azure-' ~ role.name,
      'manage_secret_id': false,
      'secret_id_ttl': openbao_approle_human_secret_id_ttl,
      'secret_id_num_uses': 1}) -%}
  {%- endfor -%}
  {{ _entries }}

openbao_azure_gated_policy_names: >-
  {{ openbao_azure_gated_approles | map(attribute='policy') | list }}
