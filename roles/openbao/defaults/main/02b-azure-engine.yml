---
openbao_azure_mount: azure
openbao_azure_plugin_name: azure
openbao_azure_engine_enabled: true
# Azure role for the IaC/admin identity. An unset object id renders no role.
openbao_azure_iac_admin_role_name: openbao-iac-admin
openbao_azure_iac_admin_application_object_id: >-
  {{ lookup('env', 'OPENBAO_AZURE_IAC_ADMIN_APPLICATION_OBJECT_ID') | default('', true) }}
openbao_azure_iac_admin_ttl: 1h
# The only identity that may read that role's credentials. Workstation-held,
# one-use secret_id minted per call by approle-issuer (07f).
openbao_azure_iac_admin_policy_name: azure-iac-admin
openbao_azure_iac_admin_approle_name: azure-iac-admin
# The service principal OpenBao uses to mint client secrets. Written to
# azure/config only on first configuration.
openbao_azure_tenant_id: "{{ lookup('env', 'OPENBAO_AZURE_TENANT_ID') | default('', true) }}"
openbao_azure_client_id: "{{ lookup('env', 'OPENBAO_AZURE_CLIENT_ID') | default('', true) }}"
openbao_azure_client_secret: "{{ lookup('env', 'OPENBAO_AZURE_CLIENT_SECRET') | default('', true) }}"
openbao_azure_subscription_id: "{{ lookup('env', 'OPENBAO_AZURE_SUBSCRIPTION_ID') | default('', true) }}"

# renovate: datasource=github-releases depName=openbao/openbao-plugins
openbao_azure_plugin_version: "0.23.0"
# Refresh this digest with the version above when Renovate proposes an update.
openbao_azure_plugin_tarball_sha256: 016eb4ee00843d0fb95837572930c34f9f2827f4bce313d632a75013c1b78b56
openbao_azure_plugin_catalog_version: "v{{ openbao_azure_plugin_version }}"
openbao_azure_plugin_release_base_url: "https://github.com/openbao/openbao-plugins/releases/download"
openbao_azure_plugin_release_tag: "secrets-azure-v{{ openbao_azure_plugin_version }}"
openbao_azure_plugin_tarball: "openbao-plugin-secrets-azure_linux_amd64_v1.tar.gz"
openbao_azure_plugin_binary: "openbao-plugin-secrets-azure_linux_amd64_v1"
openbao_azure_plugin_command: "{{ openbao_azure_plugin_binary }}-v{{ openbao_azure_plugin_version }}"
openbao_azure_plugin_tarball_url: >-
  {{ openbao_azure_plugin_release_base_url }}/{{ openbao_azure_plugin_release_tag
  }}/{{ openbao_azure_plugin_tarball }}
openbao_azure_plugin_signature_url: "{{ openbao_azure_plugin_tarball_url }}.sig"
