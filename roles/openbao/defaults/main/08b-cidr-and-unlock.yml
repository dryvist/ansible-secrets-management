---
# --- secret_id / token CIDR binding -------------------------------------------
# `secret_id_bound_cidrs` restricts where a secret_id may be REDEEMED;
# `token_bound_cidrs` restricts where the resulting token may be USED. Together
# they turn a leaked credential into one that only works from inside the network
# segment that was supposed to hold it.
#
# Real CIDRs are NEVER committed — this repository is public and a CIDR list is
# topology. They arrive by env, the same channel and shape as
# OPENBAO_SSH_SOURCE_CIDRS (comma-separated, empty when unset).
#
# ASSERT-ON-RENDER: init/10-approles.yml fails the converge when a class that
# any declared role uses is empty, unless the operator has explicitly accepted
# unbound roles by setting openbao_approle_allow_unbound_cidrs. An unset
# variable must not quietly produce the unbound role it was added to prevent.
openbao_management_cidrs: >-
  {{ lookup('env', 'OPENBAO_MANAGEMENT_CIDRS') | default('', true) | trim }}
openbao_workstation_cidrs: >-
  {{ lookup('env', 'OPENBAO_WORKSTATION_CIDRS') | default('', true) | trim }}
openbao_ci_cidrs: >-
  {{ lookup('env', 'OPENBAO_CI_CIDRS') | default('', true) | trim }}
openbao_hermes_private_agent_secret_id_cidr: >-
  {{ openbao_platform_env.get('OPENBAO_HERMES_PRIVATE_AGENT_SECRET_ID_CIDR', '')
     | default(lookup('env', 'OPENBAO_HERMES_PRIVATE_AGENT_SECRET_ID_CIDR'), true)
     | default('', true) }}
openbao_pepper_secret_id_cidr: >-
  {{ openbao_platform_env.get('OPENBAO_PEPPER_SECRET_ID_CIDR', '')
     | default(lookup('env', 'OPENBAO_PEPPER_SECRET_ID_CIDR'), true)
     | default('', true) }}
openbao_dify_agent_cidrs: >-
  {{ openbao_platform_env.get('OPENBAO_DIFY_AGENT_CIDR', '')
     | default(lookup('env', 'OPENBAO_DIFY_AGENT_CIDR'), true)
     | default('', true) }}
# Escape hatch for a first bootstrap, where no CIDR is known yet. Only a true
# value (1, true, yes, on) downgrades the assert to the loud warning that
# preceded it; "false" or any other string keeps the assert.
openbao_approle_allow_unbound_cidrs: >-
  {{ (lookup('env', 'OPENBAO_APPROLE_ALLOW_UNBOUND_CIDRS') | default('', true) | string | trim | lower)
     in ['1', 'true', 'yes', 'on'] }}
# Roles whose secret_id and token CIDRs must render non-empty even when the
# escape hatch is set. The same check also rejects any selected role's declared
# empty source-address bind, using the normalized CLI parameter map.
openbao_approle_bound_required:
  - "{{ openbao_hatchet_killtest_approle_name }}"
openbao_approle_bound_required_unbound: >-
  {%- set _ns = namespace(names=[]) -%}
  {%- for _name in openbao_approle_bound_required if _name in openbao_approle_cli_parameters -%}
  {%- set _params = openbao_approle_cli_parameters[_name] -%}
  {%- if (_params.secret_id_bound_cidrs | trim | length == 0)
        or (_params.token_bound_cidrs | trim | length == 0) -%}
  {%- set _ns.names = _ns.names + [_name] -%}
  {%- endif -%}
  {%- endfor -%}
  {%- for _approle in (openbao_approle_config_targets | default(openbao_manageable_approles))
      if 'secret_id_bound_cidrs' in _approle -%}
  {%- set _params = openbao_approle_cli_parameters[_approle.name] -%}
  {%- if (_params.secret_id_bound_cidrs | default('', true) | length == 0)
        and _approle.name not in _ns.names -%}
  {%- set _ns.names = _ns.names + [_approle.name] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ _ns.names }}

# Named classes, so a role declares WHERE it lives rather than a literal.
openbao_approle_cidr_classes:
  machine: "{{ openbao_management_cidrs }}"
  workstation: "{{ openbao_workstation_cidrs }}"
  ci: "{{ openbao_ci_cidrs }}"
  sandbox_agent: "{{ openbao_sandbox_agent_cidrs | trim }}"
  # Union of machine + workstation, for an identity genuinely redeemed from
  # BOTH: never restate either range literally, derive from the two lists
  # above so there remains exactly one declaration of each.
  machine_or_workstation: >-
    {{ ([openbao_management_cidrs, openbao_workstation_cidrs]
        | reject('equalto', '') | list
        | map('split', ',') | list
        | sum(start=[]) | unique | list
        | join(',')) }}
  # Deliberately unbound; every member needs a reason in the override map.
  unbound: ""
openbao_approle_default_cidr_class: machine
# name -> class, for the identities that are not machine-resident.
openbao_approle_cidr_class_overrides:
  # Workstation-held: the operator's own machine runs git/gh and the unlocks.
  # admin is also the provisioning tier: redeemed on the workstation, then used
  # ON the store host by the openbao play (OPENBAO_PROVISIONING_TOKEN). A
  # workstation-only bound answers those calls 403 -- same shape as flow-lock.
  admin: machine_or_workstation
  ai-admin: workstation
  ai-admin-session: workstation
  github-admin: workstation
  github-read: workstation
  github-write: workstation
  # github-work-read and github-work-write: the work identity's git/gh path,
  # redeemed from the operator's workstation.
  github-work-read: workstation
  github-work-write: workstation
  # repo-create is an interactive, one-at-a-time operator action (the helper
  # refuses to run without a terminal), so it is redeemed from the workstation.
  github-repo-create: workstation
  # The unattended admin identity and its issuer, both workstation-held.
  github-admin-unattended: workstation
  admin-issuer: workstation
  openbao-policy-sync: workstation
  # The OpenBao-node play's own converge identity: workstation-only BY DESIGN
  # (07f), and never machine — the plane does not run that play.
  openbao-node-converge: workstation
  # Redeemed from both: the brain-sync timers on their guests, and the
  # lower-trust harnesses on the workstation. The union is a superset of the
  # machine default, so no existing holder loses access.
  ai-public: machine_or_workstation
  # The Vikunja MCP server launches from the operator's own machine.
  vikunja-mcp: workstation
  herdr-hail: workstation
  slack-approvals: workstation
  claude-code-router-key: workstation
  bao-elevate-client: workstation
  # The operator workstation identity (07f).
  operator-workstation: workstation
  proxman: workstation
  agent-workstation: workstation
  sandbox-agent-read: sandbox_agent
  sandbox-agent-write: sandbox_agent
  sandbox-zcode-read: sandbox_agent
  sandbox-zcode-write: sandbox_agent
  sandbox-opencode-read: sandbox_agent
  sandbox-opencode-write: sandbox_agent
  sandbox-cursor-read: sandbox_agent
  sandbox-cursor-write: sandbox_agent
  # Backs the interactive `aikey <harness>` function, which runs on the
  # workstation.
  ai-readonly: machine_or_workstation
  # Ephemeral CI runners sit on their own isolated segment.
  github-runner: ci
  # CI-metrics exporter runs on a regular infra guest (the prometheus host),
  # not the isolated CI segment or a human workstation.
  github-exporter: machine
  # The Hatchet eval status reporter uses the existing machine address class.
  hatchet-eval-status: machine
  # Operator-run, not machine-resident: the platform deploy is driven from the
  # operator's workstation against a remote engine, so it belongs to the same
  # class as the other identities that machine holds. It defaulted to the
  # machine class, which stopped accepting the workstation when that machine
  # moved onto a client segment — the deploy then failed on source address
  # while its credentials were perfectly valid, which reads as a broken
  # credential rather than a misclassified one.
  iac-platform-deploy: workstation
  # The cross-repo apply-lock holder: taken interactively from the operator's
  # own workstation AND by every automation host during a converge/apply. A
  # single class here would break one caller or the other -- do not "tidy"
  # this back to `machine` or `workstation` alone.
  flow-lock: machine_or_workstation
  # The mint authority is used by both the workstation and automation plane.
  approle-issuer: machine_or_workstation
  # Azure IaC admin credentials are only ever read from the operator's machine.
  azure-iac-admin: workstation
  backblaze-admin: workstation
  # The Nautobot token publisher is unlocked and run from the operator's machine.
  nautobot-token-publisher: workstation
  # The Hatchet worker-token publisher is unlocked and run from the operator's machine.
  hatchet-token-publisher: workstation
  # Routine reconciliation runs from both the execution plane and workstation.
  # Keep both sources in the credential's declared address class.
  openbao-reconcile: machine_or_workstation
  observability-workstation: workstation
  local-cloud-workstation: workstation
  monitoring-workstation: workstation
  media-workstation: workstation
  apps-workstation: workstation
  # approle-audit answers an operator-run sweep (read auth/approle/role/* back)
  # from the workstation as well as the plane -- same reasoning as reconcile.
  approle-audit: machine_or_workstation
  # The three live-only identities (05e). The union, matching what they carry in
  # the store today, so the first reconcile does not move them. Narrowing each
  # to the class it truly needs is a per-identity decision and belongs with
  # whoever owns the workload — getting it wrong refuses a valid credential on
  # source address, which reads as a broken credential rather than a
  # misclassified one, and that mistake has been made twice here already.
  terraform: machine_or_workstation
  vikunja: machine_or_workstation
  media-rotate: machine_or_workstation
  slack-admin: machine_or_workstation
  slack-ops: machine_or_workstation
  # Every openbao_secrets_domains entry (ansible-proxmox-apps
  # roles/openbao_secrets/defaults/main/) the prefetch loop logs into for a
  # workstation converge -- same failure as the entries above.
  observability: machine_or_workstation
  local-cloud: machine_or_workstation
  monitoring: machine_or_workstation
  media: machine_or_workstation
  apps: machine_or_workstation
  ntfy: machine_or_workstation
  local-llm: machine_or_workstation
  clickhouse: machine_or_workstation
  clickhouse-ingest: machine_or_workstation
  clickhouse-wall: machine_or_workstation
  local-llm-workstation: workstation
  cribl-edge-mac-a: workstation
  cribl-edge-mac-b: workstation
  agent-ssh-sign: machine_or_workstation
  # The daily session-archive launchd agent runs on the workstation.
  ai-sessions-backup: workstation
  # Human-gated, operator-driven (rotate-key.yml, W1c): the wrap+unlock and
  # the rotation run it drives both happen from the operator's own
  # workstation, not a machine-resident timer — unlike every other rotator
  # in openbao_rotators, these two carry no standing secret_id at all.
  ai-rotate: workstation
  apps-rotate: workstation
  rustfs-rotate: workstation
  # Same human-gated shape: the host secret-zero re-seed runs under
  # openbao-unlock from the workstation (openbao-rotate-approles.yml).
  approle-secret-id-rotate: workstation
  # Enterprise GitHub AppRoles are redeemed by the workstation human-unlock flow.
  github-enterprise-read: workstation
  github-enterprise-admin: workstation
# Roster agent AppRoles are redeemed by their host and may be rotated from the
# workstation, like the shared roster key readers.
openbao_roster_agent_cidr_classes: >-
  {{ dict(openbao_roster_agent_valid_names
          | zip(['machine_or_workstation']
               * (openbao_roster_agent_valid_names | length))) }}
# ai-apply-<svc> roles (one per openbao_ai_domains entry, plus ai-apply-all) are
# the human-gated write tier. The operator unlocks them from the workstation with
# openbao-unlock, so they resolve to the union class. That class is a superset of
# the machine default, so no existing holder loses access.
openbao_ai_apply_cidr_classes: >-
  {{ dict((openbao_ai_apply_approles | map(attribute='name') | list + ['ai-apply-all'])
          | zip(['machine_or_workstation']
               * ((openbao_ai_apply_approles | length) + 1))) }}
# Agent-tier readers use the router's established machine/workstation fetch path.
openbao_app_agent_tier_cidr_classes: >-
  {{ dict((openbao_app_agent_tier_readers | map(attribute='tier')
          | map('regex_replace', '^', 'app-agent-') | list)
         | zip(openbao_app_agent_tier_readers | map(attribute='cidr_class') | list)) }}
# Every declared role's class, defaults filled in and then overridden — so a
# lookup never has to cope with a missing key. (`map('extract', dict, default)`
# does NOT take a default: it raises on the first name absent from the override
# map, which is most of them. Verified, not assumed.)
openbao_approle_cidr_class_map: >-
  {{ dict(openbao_approles | map(attribute='name') | list
          | zip(openbao_approles | map(attribute='name')
                | map('regex_replace', '^.*$', openbao_approle_default_cidr_class)
                | list))
     | combine(openbao_approle_cidr_class_overrides)
     | combine(openbao_github_write_scope_cidr_classes)
     | combine(openbao_roster_agent_cidr_classes)
     | combine(openbao_roster_key_reader_cidr_classes)
     | combine(openbao_ai_apply_cidr_classes)
     | combine(openbao_app_agent_tier_cidr_classes)
     | combine(openbao_window_service_cidr_classes) }}
# Identities that log in over the node-local loopback listener and then use
# the resulting token from that same source: every enabled openbao_rotators
# entry plus the snapshot timer, the secret-age auditor and the scheduled
# AppRole secret-id rotation (openbao.hcl.j2 loopback listener). The CLI
# parameter derivation below adds the loopback address to BOTH bound lists
# of each name here, so a credential redeemed over loopback is also accepted
# on its first use from loopback.
openbao_loopback_client_approles: >-
  {%- set _ns = namespace(names=[]) -%}
  {%- for _rotator in openbao_rotators | default({}, true) | dict2items -%}
  {%- if _rotator.value.enabled is defined and (_rotator.value.enabled | bool) -%}
  {%- set _ns.names = _ns.names + [_rotator.value.approle] -%}
  {%- endif -%}
  {%- endfor -%}
  {{ _ns.names
     + [openbao_snapshot_approle_name,
        openbao_secret_age_audit_approle_name,
        openbao_approle_secret_id_rotate_scheduled_approle_name] }}
# Exact strings passed by `bao write ... key=value`; keep these shared by the
# reconcile writer and its ACL so neither side can change independently.
openbao_approle_cli_parameters: >-
  {%- set _parameters = {} -%}
  {%- for _approle in openbao_approles -%}
  {%- set _cidr_class = openbao_approle_cidr_class_map[_approle.name] -%}
  {%- if 'secret_id_bound_cidrs' in _approle -%}
  {%- set _declared_cidrs = _approle.secret_id_bound_cidrs | default('', true) -%}
  {%- if _declared_cidrs is sequence and _declared_cidrs is not string -%}
  {%- set _cidr_items = _declared_cidrs | map('default', '', true) | map('string') | map('trim') | list -%}
  {%- if '' in _cidr_items -%}
  {%- set _cidr_csv = '' -%}
  {%- else -%}
  {%- set _cidr_csv = (_cidr_items | join(',')) | trim -%}
  {%- endif -%}
  {%- else -%}
  {%- set _cidr_csv = _declared_cidrs | string | trim -%}
  {%- endif -%}
  {%- else -%}
  {%- set _cidr_csv = openbao_approle_cidr_classes[_cidr_class] | trim -%}
  {%- endif -%}
  {%- if _approle.name in openbao_loopback_client_approles
        and '127.0.0.1/32' not in (_cidr_csv | split(',') | map('trim') | list) -%}
  {%- set _cidr_csv = ((_cidr_csv | trim ~ ',') if (_cidr_csv | trim | length > 0) else '')
      ~ '127.0.0.1/32' -%}
  {%- endif -%}
  {%- set _ = _parameters.update({_approle.name: {
      'token_policies': ((_approle.token_policies | default([_approle.policy])) | join(',')),
      'bind_secret_id': ((_approle.bind_secret_id | default(openbao_approle_bind_secret_id)) | bool | string | lower),
      'token_ttl': (_approle.token_ttl | default(openbao_approle_token_ttl) | string),
      'token_max_ttl': (_approle.token_max_ttl | default(openbao_approle_token_max_ttl) | string),
      'token_explicit_max_ttl': (_approle.token_explicit_max_ttl | default(0) | string),
      'token_type': (_approle.token_type | default('default') | string),
      'secret_id_ttl': (_approle.secret_id_ttl
          | default(openbao_approle_secret_id_ttl_overrides[_approle.name]
                   | default(openbao_approle_secret_id_ttl)) | string),
      'secret_id_num_uses': (_approle.secret_id_num_uses
          | default(openbao_approle_secret_id_num_uses_overrides[_approle.name]
                   if _approle.name in openbao_approle_secret_id_num_uses_overrides
                   else openbao_approle_secret_id_num_uses) | string),
      'secret_id_bound_cidrs': _cidr_csv,
      'token_bound_cidrs': _cidr_csv
  }}) -%}
  {%- endfor -%}
  {{ _parameters }}
# The classes that actually carry a role, so the assert in init/10-approles.yml
# demands only the CIDRs this declaration set really needs. `unbound` is
# excluded by definition — it is the documented opt-out, not a missing value.
openbao_approle_cidr_classes_in_use: >-
  {{ openbao_approle_cidr_class_map.values() | unique
     | reject('equalto', 'unbound') | list }}
# Of those, the ones with nothing supplied. Empty is the healthy state; the
# assert in init/10-approles.yml fails on anything here.
openbao_approle_unsupplied_cidr_classes: >-
  {{ openbao_approle_cidr_classes_in_use
     | select('in', openbao_approle_cidr_classes | dict2items
                    | selectattr('value', 'equalto', '')
                    | map(attribute='key') | list)
     | list }}

# --- Coverage: every created AppRole must carry a class decision ---------------
# openbao_approle_cidr_class_map is built from openbao_approles ALONE. A role
# created from any other list therefore resolves to no class at all, and the
# only symptom is an undefined-variable error raised deep inside a no_log loop
# that names neither the role nor the reason. init/10-approles.yml asserts the
# set it actually loops (openbao_manageable_approles) against the map keys
# first, so the failure names the role before anything is written.
#
# `unbound` is the documented opt-out, not a gap: its members are listed with a
# reason in openbao_approle_cidr_class_overrides above, so they ARE covered.
#
# The second gap is quieter and needs its own list. An override key that names
# no declared role is a silent no-op -- the role it was meant to move keeps the
# machine default, the converge stays green, and nothing anywhere says the
# class it was given is not the class it has. Empty is the healthy state.
openbao_approle_unknown_cidr_class_overrides: >-
  {{ openbao_approle_cidr_class_overrides | list
     | reject('in', openbao_approles | map(attribute='name') | list) | list }}
