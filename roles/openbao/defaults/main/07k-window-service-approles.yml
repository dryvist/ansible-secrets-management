---
# Window identities use the native credential engine's declared scope.
openbao_window_service_defaults:
  token_ttl: 15m
  token_max_ttl: 15m
  token_type: batch
  manage_secret_id: false
  secret_id_ttl: "{{ openbao_approle_per_call_secret_id_ttl }}"
  secret_id_num_uses: 1
  cidr_class: workstation

# GitHub plugin v2.3.2 leases installation tokens and implements lease revocation.
# https://github.com/martinbaillie/vault-plugin-secrets-github/blob/v2.3.2/github/backend.go
# Accessed 2026-11-06. Window children assign their leases to the parent session.
openbao_window_services:
  - name: github
    credential_paths: >-
      {%- set _paths = [] -%}
      {%- for permission_set in openbao_github_permission_sets
          | selectattr('tier', 'equalto', 'admin') -%}
      {%- set _ = _paths.append(permission_set.mount ~ '/token/' ~ permission_set.name) -%}
      {%- endfor -%}
      {{ _paths }}
    scope: [create, update]
    lifetime: 1h
  # unifi: seeds and manages the UniFi controller credential tiers. All four
  # are exact KV-v2 data leaves, so this window writes the credential documents
  # themselves; the exact leaf list is the boundary.
  - name: unifi
    credential_paths:
      - "{{ openbao_kv_mount }}/data/unifi/main/read"
      - "{{ openbao_kv_mount }}/data/unifi/main/write"
      - "{{ openbao_kv_mount }}/data/unifi/main/admin"
      - "{{ openbao_kv_mount }}/data/unifi/main/terrakube"
    scope: [create, update, read]
    lifetime: 1h
    # A KV-v2 write carries its document as request parameters, so the default
    # parameter-deny overlay would reject every write this window exists to
    # perform (verified against a dev server: denied_parameters "*" refuses a
    # KV-v2 write even with allowed_parameters set). Drop the overlay here and
    # keep it for the github mint, where a parameter-free request is what pins
    # the permission set.
    deny_all_parameters: false

openbao_window_service_approles: >-
  {%- set _roles = [] -%}
  {%- for service in openbao_window_services -%}
  {%- set _name = 'window-' ~ service.name -%}
  {%- set _ = _roles.append(openbao_window_service_defaults
      | combine({'name': _name, 'policy': _name})) -%}
  {%- endfor -%}
  {{ _roles }}

openbao_window_service_cidr_classes: >-
  {{ dict(openbao_window_service_approles | map(attribute='name')
      | zip(openbao_window_service_approles | map(attribute='cidr_class'))) }}

openbao_window_service_policies: >-
  {%- set _policies = [] -%}
  {%- for service in openbao_window_services -%}
  {%- set _ = _policies.append({'name': 'window-' ~ service.name,
      'template': 'window-service-policy.hcl.j2', 'service': service}) -%}
  {%- endfor -%}
  {{ _policies }}
