---
# AppRole identity classes. Dynamic names are added from their source lists.
# ai-orchestrator remains a trusted-agent-write migration exception.
openbao_approle_class_map: >-
  {%- set _classes = {
    'admin': 'operator-admin',
    'admin-issuer': 'operator-admin',
    'agentgateway-agent-keys': 'service-runtime',
    'ai-admin': 'operator-admin',
    'ai-admin-session': 'operator-admin',
    'ai-apply-all': 'operator-admin',
    'ai-rotate': 'converge-automation',
    'ai-orchestrator': 'trusted-agent-write',
    'ai-public': 'untrusted-sandbox',
    'ai-readonly': 'trusted-agent-read',
    'ai-elevated': 'trusted-agent-read',
    'ai-runner': 'service-runtime',
    'ai-sessions-backup': 'service-runtime',
    'ai-donna': 'trusted-agent-read',
    'agent-ssh-sign': 'trusted-agent-write',
    'agent-workstation': 'trusted-agent-write',
    'ansible-converge': 'converge-automation',
    'apps': 'service-runtime',
    'apps-rotate': 'converge-automation',
    'apps-seed': 'converge-automation',
    'apps-workstation': 'service-runtime',
    'approle-audit': 'service-runtime',
    'approle-issuer': 'converge-automation',
    'approle-secret-id-rotate': 'converge-automation',
    'approle-secret-id-rotate-scheduled': 'converge-automation',
    'azure-iac-admin': 'operator-admin',
    'ci-resolver': 'service-runtime',
    'clickhouse': 'service-runtime',
    'config-read': 'service-runtime',
    'cribl-edge-mac-a': 'service-runtime',
    'cribl-edge-mac-b': 'service-runtime',
    'flow-lock': 'converge-automation',
    'github-admin': 'operator-admin',
    'github-admin-unattended': 'operator-admin',
    'github-enterprise-admin': 'operator-admin',
    'github-enterprise-read': 'operator-admin',
    'github-exporter': 'service-runtime',
    'github-write': 'trusted-agent-write',
    'github-read': 'trusted-agent-read',
    'github-repo-create': 'operator-admin',
    'github-runner': 'service-runtime',
    'github-work-read': 'trusted-agent-read',
    'github-work-write': 'trusted-agent-write',
    'hermes': 'trusted-agent-read',
    'hermes-private-agent': 'trusted-agent-read',
    'hermes-private': 'trusted-agent-write',
    'hermes-public': 'trusted-agent-write',
    'hermes-write': 'trusted-agent-write',
    'iac-platform-deploy': 'converge-automation',
    'llm-gate': 'service-runtime',
    'llm-router-agent-keys': 'service-runtime',
    'llm-router-write': 'trusted-agent-write',
    'local-cloud': 'service-runtime',
    'local-cloud-workstation': 'service-runtime',
    'local-llm': 'service-runtime',
    'local-llm-workstation': 'service-runtime',
    'media': 'service-runtime',
    'media-rotate': 'converge-automation',
    'media-workstation': 'service-runtime',
    'monitoring': 'service-runtime',
    'monitoring-workstation': 'service-runtime',
    'ntfy': 'service-runtime',
    'observability': 'service-runtime',
    'observability-workstation': 'service-runtime',
    'open-llm': 'untrusted-sandbox',
    'openbao-node-converge': 'converge-automation',
    'openbao-policy-sync': 'operator-admin',
    'openbao-reconcile': 'converge-automation',
    'operator-workstation': 'operator-admin',
    'packer': 'service-runtime',
    'proxman': 'service-runtime',
    'rustfs-rotate': 'converge-automation',
    'sandbox-agent-read': 'untrusted-sandbox',
    'sandbox-agent-write': 'untrusted-sandbox',
    'semaphore': 'converge-automation',
    'secret-age-audit': 'service-runtime',
    'slack-admin': 'operator-admin',
    'slack-ops': 'service-runtime',
    'snapshot': 'service-runtime',
    'splunk-mcp-rotate': 'converge-automation',
    'terraform': 'converge-automation',
    'terraform-apply': 'converge-automation',
    'vikunja': 'service-runtime',
    'vikunja-mcp': 'service-runtime'
  } -%}
  {%- for role in openbao_ai_apply_approles -%}
  {%- set _ = _classes.update({role.name: 'operator-admin'}) -%}
  {%- endfor -%}
  {%- for role in openbao_github_write_scope_approles -%}
  {%- set _ = _classes.update({role.name: 'trusted-agent-write'}) -%}
  {%- endfor -%}
  {%- for role in openbao_roster_agent_approles + openbao_roster_key_reader_approles -%}
  {%- set _ = _classes.update({role.name: 'service-runtime'}) -%}
  {%- endfor -%}
  {{ _classes }}
