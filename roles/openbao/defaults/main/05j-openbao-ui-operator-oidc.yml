---
# Human OIDC login for the OpenBao UI and CLI. The client secret is generated
# once with the existing apps/authelia seed and read back during auth setup.
openbao_operator_oidc_auth_path: oidc
openbao_operator_oidc_role_name: operator
openbao_operator_human_policy_name: operator-human
openbao_operator_oidc_client_id: openbao-ui
openbao_operator_oidc_client_secret_field: authelia_oidc_openbao_ui_client_secret
openbao_authelia_operator_group: "{{ lookup('env', 'OPENBAO_AUTHELIA_OPERATOR_GROUP') | default('', true) }}"
# On only when the issuer and operator group are both supplied, so a converge
# without them leaves the login absent instead of failing every OpenBao run.
openbao_operator_oidc_enabled: >-
  {{ (openbao_authelia_jwt_issuer | length > 0)
     and (openbao_authelia_operator_group | length > 0) }}
openbao_operator_oidc_discovery_url: "{{ openbao_authelia_jwt_issuer }}"
openbao_operator_oidc_public_url: >-
  {{ openbao_reconcile_addr | default('', true) | regex_replace('/+$', '') }}
openbao_operator_oidc_ui_redirect_uri: >-
  {{ openbao_operator_oidc_public_url }}/ui/vault/auth/oidc/oidc/callback
openbao_operator_oidc_cli_redirect_uri: "http://localhost:8250/oidc/callback"
openbao_operator_oidc_token_ttl: 1h
openbao_operator_oidc_token_max_ttl: 8h
