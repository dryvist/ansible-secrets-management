---
# Optional AI agents from the tofu inventory artifact.
openbao_ai_agents: "{{ (tofu_data | default({})).agents | default({}) }}"

openbao_roster_agent_name_pattern: '^[a-z]+-[a-z]+$'
openbao_roster_agent_slug_pattern: '^[a-z][a-z0-9-]*$'
openbao_roster_agent_policy_marker: "# managed-by: openbao roster-agent "

# Check mode has no converge token (the issuer login is skipped), so the live
# check runs only on a real converge. A real run without a token fails instead.
openbao_roster_live_check_mode: "{{ ansible_check_mode }}"
openbao_roster_live_check_enabled: >-
  {{ openbao_ai_agents | length > 0 and not (openbao_roster_live_check_mode | bool) }}

openbao_roster_live_approle_names: []
openbao_roster_live_policy_names: []
openbao_roster_live_policy_bodies: {}
openbao_roster_live_approle_configs: {}

openbao_roster_agent_invalid_names: >-
  {%- set _invalid = [] -%}
  {%- for agent in openbao_ai_agents -%}
  {%- if (agent | string | regex_search(openbao_roster_agent_name_pattern)) is none -%}
  {%- set _ = _invalid.append(agent) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ _invalid }}

openbao_roster_agent_owned_slugs: >-
  {%- set _entries = [] -%}
  {%- for agent, definition in openbao_ai_agents.items() -%}
  {%- set _owns = definition.get('owns', []) if definition is mapping else none -%}
  {%- if _owns is sequence and _owns is not string and _owns is not mapping -%}
  {%- for slug in _owns -%}
  {%- set _ = _entries.append({'agent': agent, 'slug': slug}) -%}
  {%- endfor -%}
  {%- endif -%}
  {%- endfor -%}
  {{ _entries }}

openbao_roster_agent_invalid_slugs: >-
  {%- set _invalid = [] -%}
  {%- for agent, definition in openbao_ai_agents.items() -%}
  {%- set _owns = definition.get('owns', []) if definition is mapping else none -%}
  {%- if _owns is not sequence or _owns is string or _owns is mapping -%}
  {%- set _ = _invalid.append((agent | string) ~ ' (owns must be a list)') -%}
  {%- else -%}
  {%- for slug in _owns -%}
  {%- if slug is not string or (slug | regex_search(openbao_roster_agent_slug_pattern)) is none -%}
  {%- set _ = _invalid.append((agent | string) ~ ':' ~ (slug | string)) -%}
  {%- endif -%}
  {%- endfor -%}
  {%- endif -%}
  {%- endfor -%}
  {{ _invalid }}

openbao_roster_agent_duplicate_slugs: >-
  {%- set _all = openbao_roster_agent_owned_slugs | map(attribute='slug') | list -%}
  {%- set _duplicates = [] -%}
  {%- for slug in _all -%}
  {%- if _all | select('equalto', slug) | list | length > 1 and slug not in _duplicates -%}
  {%- set _ = _duplicates.append(slug) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ _duplicates }}

openbao_roster_agent_apps_leaf_names: >-
  {{ (((openbao_generated_app_secrets | default({})).keys() | list)
      + ((openbao_promoted_app_secrets | default({})).keys() | list)
      + ((openbao_router_key_catalog | default({})).keys() | list)
      + (openbao_apps_read_published_apps | default([]))
      + (openbao_apps_read_excluded_generated_apps | default([])))
     | unique | list }}

# These are direct ai/<leaf> grants and reserved prefixes declared by AI
# policies. The mcp and agents names hold nested credentials and identities.
openbao_roster_agent_ai_leaf_names: >-
  {{ [openbao_hermes_approle_name,
      openbao_hermes_private_agent_policy_name | regex_replace('-agent$', ''),
      openbao_llm_router_write_approle_name | regex_replace('-write$', ''),
      openbao_ai_donna_approle_name | regex_replace('^ai-', ''),
      openbao_ai_public_approle_name | regex_replace('^ai-', ''),
      openbao_llm_gate_approle_name | regex_replace('-gate$', ''),
      openbao_vikunja_approle_name,
      'mcp', 'agents'] | unique | list }}

# init/10d requires live AppRoles to equal declared roles plus these exceptions;
# checking them covers live names without a token in preflight. Dead secret IDs
# are already declared roles and remain covered by openbao_approles.
openbao_roster_agent_live_name_exceptions: >-
  {{ ((openbao_live_only_approles | default([]) | map(attribute='name') | list)
      + (openbao_approle_undeclared_exceptions | default([]) | map(attribute='name') | list)
      + (openbao_approle_dead_names | default([]))
      + (openbao_retired_policies | default([]))
      + ['default', 'root']) | unique | list }}

# The candidate name and its gateway leaf must not reuse a declared identity,
# an exception name, or a KV leaf that the resulting policy would read.
openbao_roster_agent_name_collisions: >-
  {%- set _hits = [] -%}
  {%- set _valid_agents = [] -%}
  {%- for agent in openbao_ai_agents -%}
  {%- if (agent | string | regex_search(openbao_roster_agent_name_pattern)) is not none -%}
  {%- set _ = _valid_agents.append(agent) -%}
  {%- endif -%}
  {%- endfor -%}
  {%- for agent in openbao_ai_agents -%}
  {%- for candidate in [agent, (agent | string) ~ '-gw'] -%}
  {%- set _expected = 1 if candidate == agent and agent in _valid_agents else 0 -%}
  {%- if (openbao_approles | selectattr('name', 'equalto', candidate) | list | length > _expected)
        or (openbao_policies | selectattr('name', 'equalto', candidate) | list | length > _expected)
        or candidate in openbao_roster_agent_live_name_exceptions
        or candidate in openbao_roster_agent_apps_leaf_names
        or candidate in openbao_roster_agent_ai_leaf_names -%}
  {%- set _ = _hits.append(agent) -%}
  {%- endif -%}
  {%- endfor -%}
  {%- endfor -%}
  {{ _hits | unique | list }}

openbao_roster_live_policy_conflicts: >-
  {%- set _conflicts = [] -%}
  {%- for agent in openbao_ai_agents -%}
  {%- if agent in openbao_roster_live_policy_names
        and (openbao_roster_agent_policy_marker ~ agent)
            not in (openbao_roster_live_policy_bodies.get(agent, '') | string).splitlines() -%}
  {%- set _ = _conflicts.append(agent) -%}
  {%- endif -%}
  {%- endfor -%}
  {{ _conflicts }}

openbao_roster_live_approle_conflicts: >-
  {%- set _conflicts = [] -%}
  {%- for agent in openbao_ai_agents -%}
  {%- if agent in openbao_roster_live_approle_names -%}
  {%- if agent not in openbao_roster_live_policy_names
        or agent in openbao_roster_live_policy_conflicts -%}
  {%- set _ = _conflicts.append(agent ~ ' (no live marked roster policy)') -%}
  {%- else -%}
  {%- set _config = openbao_roster_live_approle_configs.get(agent, {}) -%}
  {%- set _data = _config.get('data', {}) -%}
  {%- set _policies = _data.get('token_policies', _data.get('policies',
      _config.get('token_policies', _config.get('policies', [])))) -%}
  {%- if _policies != [agent] -%}
  {%- set _ = _conflicts.append(agent ~ ' (token_policies/policies=' ~ (_policies | to_json)
      ~ '; expected ' ~ ([agent] | to_json) ~ ')') -%}
  {%- endif -%}
  {%- endif -%}
  {%- endif -%}
  {%- endfor -%}
  {{ _conflicts }}
