---
# Per-App GitHub engine mounts on the same plugin as the admin mount. Each
# App's own grant is the hard ceiling for every token its mount mints, and
# every set below states its permission map explicitly (05b asserts none holds
# administration). App IDs and private keys arrive via environment;
# installation IDs come from the env document (openbao_platform_env). A
# supplied private key is a deliberate (re)configuration.
#
#   github         everyday read/write
#   github-agents  untrusted-tier public read/write, scoped by its installation
#   github-hermes  review and allowlisted authoring, split by repository visibility
#   github-work    read and write over one installation, no administration
#   github-enterprise-read  human-gated raw-token read tier
#   github-enterprise       human-gated raw-token admin tier
#   github-enterprise-owner human-gated stored owner token, readable by the admin tiers only
openbao_github_everyday_mount: github
openbao_github_everyday_dryvist_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_DRYVIST_INSTALLATION_ID'] | default('', true) }}
openbao_github_everyday_personal_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_PERSONAL_INSTALLATION_ID'] | default('', true) }}
openbao_github_everyday_extra_read_installations: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_EXTRA_READ_INSTALLATION_IDS'] | default('', true) }}
openbao_github_everyday_extra_read_installations_parsed: >-
  {%- set parsed = namespace(entries=[]) -%}
  {%- if openbao_github_everyday_extra_read_installations | trim | length > 0 -%}
  {%- for entry in openbao_github_everyday_extra_read_installations.split(',') | map('trim') -%}
  {%- set parts = entry.split('=', 1) -%}
  {%- set installation_id = parts[1] if parts | length > 1 else '' -%}
  {%- set parsed.entries = parsed.entries + [{
      'entry': entry,
      'owner': parts[0],
      'installation_id': installation_id,
      'permission_set': {
        'name': 'read-' ~ (parts[0] | lower) ~ '-all',
        'tier': 'read',
        'installation_id': installation_id,
        'permissions': openbao_github_read_permissions
      }
    }] -%}
  {%- endfor -%}
  {%- endif -%}
  {{ parsed.entries }}
openbao_github_everyday_base_read_permission_sets:
  - name: read-dryvist-all
    tier: read
    installation_id: "{{ openbao_github_everyday_dryvist_installation_id }}"
    permissions: "{{ openbao_github_read_permissions }}"
  - name: read-personal-all
    tier: read
    installation_id: "{{ openbao_github_everyday_personal_installation_id }}"
    permissions: "{{ openbao_github_read_permissions }}"
openbao_github_read_permission_sets: >-
  {{ openbao_github_everyday_base_read_permission_sets
     + (openbao_github_everyday_extra_read_installations_parsed
        | map(attribute='permission_set') | list) }}

# open-llm can mint one-repository tokens from the raw endpoint pinned to this
# installation and from the named public-write set. The sandbox gets only
# explicitly named public-repository read and write permission sets.
openbao_github_agents_mount: github-agents
openbao_github_agents_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_AGENTS_DRYVIST_INSTALLATION_ID'] | default('', true) }}
openbao_github_agents_read_permissions:
  contents: read
  metadata: read
  pull_requests: read
  issues: read
  actions: read
  checks: read
openbao_github_agents_write_permissions:
  contents: write
  metadata: read
  pull_requests: write
  issues: write
  actions: read
  checks: read
openbao_github_agents_set_permissions:
  public-read: "{{ openbao_github_agents_read_permissions }}"
  public-write: "{{ openbao_github_agents_write_permissions }}"
openbao_github_agents_permission_sets: >-
  {{ (openbao_github_agents_set_permissions
      | dict2items(key_name='name', value_name='permissions')
      | map('combine', {'installation_id': openbao_github_agents_installation_id,
                        'public_repos_of': 'dryvist'}) | list)
     if openbao_github_agents_installation_id | length > 0 else [] }}

openbao_github_hermes_mount: github-hermes
# Two identities split by repository visibility: neither can mint a token that
# reaches the other visibility's repositories.
openbao_github_hermes_public_policy_name: hermes-public
openbao_github_hermes_public_approle_name: hermes-public
openbao_github_hermes_private_policy_name: hermes-private
openbao_github_hermes_private_approle_name: hermes-private
openbao_github_hermes_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_HERMES_DRYVIST_INSTALLATION_ID'] | default('', true) }}
# Each set's map is asserted verbatim in 05b-github-app-mount.yml; a set
# holding anything else fails the converge. Review grants no contents write:
# a review token can comment, review and label but cannot change code.
openbao_github_hermes_review_permissions:
  pull_requests: write
  issues: write
  contents: read
  checks: read
  metadata: read
openbao_github_hermes_author_permissions:
  contents: write
  pull_requests: write
  metadata: read
openbao_github_hermes_set_permissions:
  hermes-review-public: "{{ openbao_github_hermes_review_permissions }}"
  hermes-review-private: "{{ openbao_github_hermes_review_permissions }}"
  hermes-read-public: "{{ openbao_github_read_permissions }}"
  hermes-author-public: "{{ openbao_github_hermes_author_permissions }}"
  hermes-author-private: "{{ openbao_github_hermes_author_permissions }}"
# Author allowlists contain repository names, never globs. An unset list
# yields no author set: an omitted `repositories` list means the whole
# installation. `repositories_within` keeps author sets inside their review
# set's resolved list.
openbao_github_hermes_author_public_repos: >-
  {{ (openbao_platform_env['OPENBAO_GITHUB_HERMES_AUTHOR_PUBLIC_REPOS'] | default('', true)).split(',')
     | map('trim') | reject('equalto', '') | list }}
openbao_github_hermes_author_private_repos_full_names: >-
  {{ [openbao_github_oidc_docs_repository]
     if openbao_github_oidc_docs_repository | default('', true) | length > 0 else [] }}
openbao_github_hermes_author_private_repos: >-
  {{ openbao_github_hermes_author_private_repos_full_names
     | map('regex_replace', '^[^/]+/', '') | list }}
# No installation ID configured yields no sets and no mount.
openbao_github_hermes_permission_sets: >-
  {{ ([{'name': 'hermes-review-public', 'tier': 'hermes-public',
        'installation_id': openbao_github_hermes_installation_id,
        'permissions': openbao_github_hermes_review_permissions,
        'public_repos_of': 'dryvist'},
       {'name': 'hermes-review-private', 'tier': 'hermes-private',
        'installation_id': openbao_github_hermes_installation_id,
        'permissions': openbao_github_hermes_review_permissions,
        'private_repos_of': 'dryvist'},
       {'name': 'hermes-read-public', 'tier': 'hermes-private',
        'installation_id': openbao_github_hermes_installation_id,
        'permissions': openbao_github_read_permissions,
        'public_repos_of': 'dryvist'}]
      + ([{'name': 'hermes-author-public', 'tier': 'hermes-public',
           'installation_id': openbao_github_hermes_installation_id,
           'repositories': openbao_github_hermes_author_public_repos,
           'repositories_within': 'hermes-review-public',
           'permissions': openbao_github_hermes_author_permissions}]
         if openbao_github_hermes_author_public_repos | length > 0 else [])
      + ([{'name': 'hermes-author-private', 'tier': 'hermes-private',
           'installation_id': openbao_github_hermes_installation_id,
           'repositories': openbao_github_hermes_author_private_repos,
           'repositories_within': 'hermes-review-private',
           'permissions': openbao_github_hermes_author_permissions}]
         if openbao_github_hermes_author_private_repos | length > 0 else []))
     if openbao_github_hermes_installation_id | length > 0 else [] }}

# github-work: one installation, a read set and a write set, neither holding
# administration. Its mount follows the hermes shape: no installation ID means
# no sets, and an empty set list means no mount and no policy.
openbao_github_work_mount: github-work
openbao_github_work_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_WORK_INSTALLATION_ID'] | default('', true) }}
openbao_github_work_read_permissions:
  contents: read
  metadata: read
  pull_requests: read
  issues: read
  actions: read
  checks: read
openbao_github_work_write_permissions:
  contents: write
  pull_requests: write
  issues: write
  actions: read
  checks: read
  metadata: read
# Each set's map is asserted verbatim in 05b-github-app-set-checks.yml.
openbao_github_work_set_permissions:
  work-read: "{{ openbao_github_work_read_permissions }}"
  work-write: "{{ openbao_github_work_write_permissions }}"
openbao_github_work_permission_sets: >-
  {{ (openbao_github_work_set_permissions
      | dict2items(key_name='name', value_name='permissions')
      | map('combine', {'installation_id': openbao_github_work_installation_id}) | list)
     if openbao_github_work_installation_id | length > 0 else [] }}

# Enterprise Apps use their own installation as the token ceiling. They have
# no permission sets; their policies pin the raw token endpoint to one
# installation ID. Each mount, like github-work, is declared only once its
# installation ID is set; its policy follows the same input (07c).
openbao_github_enterprise_read_mount: github-enterprise-read
openbao_github_enterprise_read_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_ENTERPRISE_READ_INSTALLATION_ID'] | default('', true) }}
openbao_github_enterprise_mount: github-enterprise
openbao_github_enterprise_installation_id: >-
  {{ openbao_platform_env['OPENBAO_GITHUB_ENTERPRISE_INSTALLATION_ID'] | default('', true) }}
openbao_github_enterprise_owner_mount: github-enterprise-owner
openbao_github_enterprise_app_mounts: >-
  {{ ([{'mount': openbao_github_enterprise_read_mount,
        'app_id': lookup('env', 'OPENBAO_GITHUB_ENTERPRISE_READ_APP_ID') | default('', true),
        'private_key': lookup('env', 'OPENBAO_GITHUB_ENTERPRISE_READ_PRIVATE_KEY') | default('', true),
        'permission_sets': []}]
      if openbao_github_enterprise_read_installation_id | length > 0 else [])
     + ([{'mount': openbao_github_enterprise_mount,
          'app_id': lookup('env', 'OPENBAO_GITHUB_ENTERPRISE_APP_ID') | default('', true),
          'private_key': lookup('env', 'OPENBAO_GITHUB_ENTERPRISE_PRIVATE_KEY') | default('', true),
          'permission_sets': []}]
        if openbao_github_enterprise_installation_id | length > 0 else []) }}

openbao_github_app_mounts_base:
  - mount: "{{ openbao_github_everyday_mount }}"
    app_id: "{{ lookup('env', 'OPENBAO_GITHUB_EVERYDAY_APP_ID') | default('', true) }}"
    private_key: "{{ lookup('env', 'OPENBAO_GITHUB_EVERYDAY_APP_PRIVATE_KEY') | default('', true) }}"
    permission_sets: "{{ openbao_github_read_permission_sets }}"
  - mount: "{{ openbao_github_agents_mount }}"
    app_id: "{{ lookup('env', 'OPENBAO_GITHUB_AGENTS_APP_ID') | default('', true) }}"
    private_key: "{{ lookup('env', 'OPENBAO_GITHUB_AGENTS_APP_PRIVATE_KEY') | default('', true) }}"
    permission_sets: "{{ openbao_github_agents_permission_sets }}"
openbao_github_app_mounts: >-
  {{ openbao_github_app_mounts_base
     + ([{'mount': openbao_github_hermes_mount,
          'app_id': lookup('env', 'OPENBAO_GITHUB_HERMES_APP_ID') | default('', true),
          'private_key': lookup('env', 'OPENBAO_GITHUB_HERMES_APP_PRIVATE_KEY') | default('', true),
          'permission_sets': openbao_github_hermes_permission_sets}]
        if openbao_github_hermes_permission_sets | length > 0 else [])
     + ([{'mount': openbao_github_work_mount,
          'app_id': lookup('env', 'OPENBAO_GITHUB_WORK_APP_ID') | default('', true),
          'private_key': lookup('env', 'OPENBAO_GITHUB_WORK_PRIVATE_KEY') | default('', true),
          'permission_sets': openbao_github_work_permission_sets}]
        if openbao_github_work_permission_sets | length > 0 else [])
     + openbao_github_enterprise_app_mounts }}

# Accounts any App may be installed on: a comma-separated list in the env
# document (openbao_platform_env). The exposure check fails closed while it is
# empty.
openbao_github_app_install_allowlist: >-
  {{ (openbao_platform_env['OPENBAO_GITHUB_APP_INSTALL_ALLOWLIST'] | default('', true)).split(',')
     | map('trim') | select | list }}

# Every App whose key is present in this run: the admin App plus each mount's.
openbao_github_app_exposure_targets: >-
  {{ ([{'app_id': openbao_github_app_id, 'private_key': openbao_github_app_private_key}]
      + (openbao_github_app_mounts | map('dict2items')
         | map('selectattr', 'key', 'in', ['app_id', 'private_key'])
         | map('items2dict') | list))
     | selectattr('app_id', 'truthy') | selectattr('private_key', 'truthy') | list }}
