---
# Internal KV paths for generated credentials outside the apps subtree.
# Split from the generated-secret map to keep it within its token budget.
openbao_generated_app_secret_paths:
  clickhouse: ai/clickhouse
  clickhouse-ingest: ai/clickhouse-ingest
  laya: ai/llm
  client: core/client
openbao_app_agent_tier_generated_app_secret_paths: >-
  {%- set _paths = {} -%}
  {%- for reader in openbao_app_agent_tier_readers | default([]) -%}
  {%- set _ = _paths.update({'agent-tier-' ~ reader.tier: reader.tier}) -%}
  {%- endfor -%}
  {{ _paths }}
openbao_seed_app_path: >-
  {{ (openbao_app_agent_tier_generated_app_secret_paths | default({}, true)).get(
       openbao_seed_app,
       openbao_generated_app_secret_paths.get(openbao_seed_app, 'apps/' ~ openbao_seed_app)) }}
openbao_generated_app_secret_mounts: >-
  {{ dict((openbao_app_agent_tier_readers | default([]))
          | map(attribute='tier') | map('regex_replace', '^', 'agent-tier-') | list
          | zip([openbao_agent_tier_mount]
               * ((openbao_app_agent_tier_readers | default([])) | length))) }}
openbao_seed_app_mount: >-
  {{ openbao_generated_app_secret_mounts.get(openbao_seed_app, openbao_kv_mount) }}

# Random length/format tunables for these generated secrets:
# see 01b-app-secret-generation.yml.
