---
# Dify authenticates on every workflow run with one reusable SecretID held as a Dify secret.
# The dedicated issuer AppRole (07i, dify-agent-secret-id-issuer) holds the
# seed-writer-dify-secret-id-issuer policy that mints it; this role does not mint or store it.
# Do not create any of these roles without its host CIDR.
openbao_dify_agent_approles: >-
  {{ ([{'name': openbao_dify_agent_code_simplifier_approle_name,
        'policy': openbao_dify_agent_code_simplifier_policy_name,
        'secret_id_bound_cidrs': openbao_dify_agent_cidrs,
        'secret_id_ttl': '720h', 'secret_id_num_uses': 0,
        'token_ttl': '15m', 'token_max_ttl': '15m',
        'manage_secret_id': false},
       {'name': openbao_dify_agent_ci_fixer_approle_name,
        'policy': openbao_dify_agent_ci_fixer_policy_name,
        'secret_id_bound_cidrs': openbao_dify_agent_cidrs,
        'secret_id_ttl': '720h', 'secret_id_num_uses': 0,
        'token_ttl': '15m', 'token_max_ttl': '15m',
        'manage_secret_id': false},
       {'name': openbao_dify_agent_vikunja_clerk_approle_name,
        'policy': openbao_dify_agent_vikunja_clerk_policy_name,
        'secret_id_bound_cidrs': openbao_dify_agent_cidrs,
        'secret_id_ttl': '720h', 'secret_id_num_uses': 0,
        'token_ttl': '15m', 'token_max_ttl': '15m',
        'manage_secret_id': false},
       {'name': openbao_dify_agent_vikunja_triage_approle_name,
        'policy': openbao_dify_agent_vikunja_triage_policy_name,
        'secret_id_bound_cidrs': openbao_dify_agent_cidrs,
        'secret_id_ttl': '720h', 'secret_id_num_uses': 0,
        'token_ttl': '15m', 'token_max_ttl': '15m',
        'manage_secret_id': false},
       {'name': openbao_dify_agent_docs_updater_approle_name,
        'policy': openbao_dify_agent_docs_updater_policy_name,
        'secret_id_bound_cidrs': openbao_dify_agent_cidrs,
        'secret_id_ttl': '720h', 'secret_id_num_uses': 0,
