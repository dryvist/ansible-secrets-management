---
# Data domains use their own AppRole credentials by default. `credential_domain`
# explicitly reuses another domain's env pair without changing the result key.
- name: Resolve the credential domain for {{ openbao_domain.name }}
  ansible.builtin.set_fact:
    openbao_secrets_domain_credential_name: >-
      {{ openbao_domain.credential_domain | default(openbao_domain.name, true) }}
  no_log: true

# The env-var shape follows the credential domain, not stored per domain:
# OPENBAO_APPROLE_<NAME>_{ROLE,SECRET}_ID, upper-cased with non-alphanumerics
# replaced by '_'. `<NAME>_VAULT_{ROLE,SECRET}_ID` is the legacy fallback.
- name: Resolve role_id/secret_id env prefixes for {{ openbao_domain.name }}
  ansible.builtin.set_fact:
    openbao_secrets_domain_env_new_prefix: >-
      OPENBAO_APPROLE_{{ openbao_secrets_domain_credential_name | upper | regex_replace('[^A-Z0-9]', '_') }}
    openbao_secrets_domain_env_legacy_prefix: >-
      {{ openbao_secrets_domain_credential_name | upper | regex_replace('[^A-Z0-9]', '_') }}_VAULT
  no_log: true

- name: Resolve role_id/secret_id values, new name then legacy then operator pair for {{ openbao_domain.name }}
  ansible.builtin.set_fact:
    openbao_secrets_domain_role_id: >-
      {{ lookup('env', openbao_secrets_domain_env_new_prefix ~ '_ROLE_ID')
         | default(lookup('env', openbao_secrets_domain_env_legacy_prefix ~ '_ROLE_ID'), true)
         | default(lookup('env', 'OPERATOR_VAULT_ROLE_ID')
                   if openbao_domain.name in openbao_secrets_operator_domains
                   else '', true) }}
    openbao_secrets_domain_secret_id: >-
      {{ lookup('env', openbao_secrets_domain_env_new_prefix ~ '_SECRET_ID')
         | default(lookup('env', openbao_secrets_domain_env_legacy_prefix ~ '_SECRET_ID'), true)
         | default(lookup('env', 'OPERATOR_VAULT_SECRET_ID')
                   if openbao_domain.name in openbao_secrets_operator_domains
                   else '', true) }}
  no_log: true
