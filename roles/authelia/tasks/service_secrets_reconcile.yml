---
# Reconcile the guest copies with the seeded OpenBao values. OpenBao is authoritative: a
# copy that exists must equal its value, or the run fails naming only the field and no file
# changes. A missing copy is written from its value with the same owner, group and mode as
# the rest of the secrets directory.

- name: Start the list of guest copies that differ from OpenBao
  ansible.builtin.set_fact:
    authelia_secret_mismatches: []

- name: Record each guest copy that differs from its OpenBao value
  ansible.builtin.set_fact:
    authelia_secret_mismatches: "{{ authelia_secret_mismatches + [item.key] }}"
  loop: "{{ authelia_guest_secret_values | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: (item.value | trim) != (authelia_seed_result[item.key] | default('', true) | trim)
  no_log: true

- name: Fail when a guest copy differs from its OpenBao value
  ansible.builtin.fail:
    msg: >-
      Authelia guest copies differ from their OpenBao values for: {{ authelia_secret_mismatches | join(', ') }}.
      OpenBao is authoritative and no file was changed. Reconcile the stored field or the guest copy by hand.
  when: authelia_secret_mismatches | length > 0

# The bootstrap password copy is not written here. bootstrap_password_persist.yml writes it on
# the first-run path only, so a converge after it was removed by the passkey cleanup recreates nothing.
- name: Write each missing guest copy from its OpenBao value
  ansible.builtin.copy:
    content: "{{ authelia_seed_result[item.key] }}"
    dest: "{{ item.value }}"
    owner: "{{ authelia_user }}"
    group: "{{ authelia_group }}"
    mode: "0600"
    force: false
  loop: "{{ authelia_service_secret_paths | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.key not in authelia_guest_secret_values
    - item.key != 'bootstrap_password'
  no_log: true
