---
# Writes the one-time bootstrap password copy from its OpenBao value. It runs only while the
# users database is absent, which is the first-run path that generated the password before.
# Later converges never recreate the copy: the service-secret reconcile does not write it, and
# the passkey cleanup removes it. An existing copy is checked against OpenBao in
# service_secrets_reconcile.yml, which fails the run when the two differ.

- name: Persist the bootstrap password for one-time retrieval (root-only, first run only)
  ansible.builtin.copy:
    content: "{{ authelia_admin_user }}:{{ authelia_seed_result.bootstrap_password }}\n"
    dest: "{{ authelia_bootstrap_password_file }}"
    owner: "{{ authelia_bootstrap_password_file_owner | default('root') }}"
    group: "{{ authelia_bootstrap_password_file_group | default('root') }}"
    mode: "0600"
  when: not authelia_users_stat.stat.exists
  register: authelia_bootstrap_persist
  no_log: true
