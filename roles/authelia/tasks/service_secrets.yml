---
# Authelia service secrets. OpenBao KV secret/<authelia_service_secrets_kv_path> is
# authoritative and the guest files are copies. The shared generate-if-absent
# contract seeds missing fields with the dedicated signing-writer AppRole from
# the controller. A KV value is never replaced, and a guest copy that disagrees
# with KV fails the run (service_secrets_reconcile.yml).
#
# The field names are the ones the previous publish step wrote, so the values already in
# KV are kept as they are.
#
# The exact writer identity and its capabilities are both checked by the shared seed contract.

- name: Read and declare the Authelia service secrets
  ansible.builtin.import_tasks: service_secrets_read.yml

- name: Seed the Authelia service secrets in OpenBao through the shared contract
  delegate_to: localhost
  become: false
  delegate_facts: false
  vars:
    ansible_become: false
  no_log: true
  block:
    - name: Log in with the Authelia signing-writer AppRole
      check_mode: false
      ansible.builtin.uri:
        url: >-
          {{ lookup('env', 'BAO_ADDR') | default('', true)
             | regex_replace('/+$', '') }}/v1/auth/approle/login
        method: POST
        body_format: json
        body:
          role_id: >-
            {{ lookup('env', 'OPENBAO_APPROLE_AUTHELIA_SIGNING_WRITER_ROLE_ID')
               | default('', true) }}
          secret_id: >-
            {{ lookup('env', 'OPENBAO_APPROLE_AUTHELIA_SIGNING_WRITER_SECRET_ID')
               | default('', true) }}
        status_code: 200
        follow_redirects: none
        use_proxy: false
        timeout: 10
      register: authelia_signing_writer_login
      no_log: true

    - name: Generate-if-absent seed with the signing-writer token
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: "{{ lookup('env', 'BAO_ADDR') | default('', true) }}"
        openbao_secrets_seed_token: "{{ authelia_signing_writer_login.json.auth.client_token }}"
        openbao_secrets_seed_mount: secret
        openbao_secrets_seed_path: "{{ authelia_service_secrets_kv_path }}"
        openbao_secrets_seed_fields: "{{ authelia_seed_fields }}"
        openbao_secrets_seed_expected_writer_policy: authelia-signing-writer
        openbao_secrets_seed_check_capabilities: true
        openbao_secrets_seed_register: authelia_seed_result

- name: Reconcile the guest copies with the seeded OpenBao values
  ansible.builtin.import_tasks: service_secrets_reconcile.yml
