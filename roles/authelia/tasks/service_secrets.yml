---
# Authelia service secrets. OpenBao KV secret/apps/authelia is authoritative and the guest
# files are copies. The shared generate-if-absent contract seeds the missing KV fields,
# written by the converge token from the controller. A KV value is never replaced, and a
# guest copy that disagrees with KV fails the run (service_secrets_reconcile.yml).
#
# The field names are the ones the previous publish step wrote, so the values already in
# KV are kept as they are.
#
# The writer identity is not asserted with openbao_secrets_seed_expected_writer_policy: the
# converge token carries config-write and ssh-sign, and a one-hour TTL, so an exact-identity
# check cannot pass against it. openbao_secrets_seed_check_capabilities pins what the writer
# may do on this path instead: create, read and update on the data path, read on metadata.

- name: Read and declare the Authelia service secrets
  ansible.builtin.import_tasks: service_secrets_read.yml

- name: Seed the Authelia service secrets in OpenBao through the shared contract
  delegate_to: localhost
  become: false
  delegate_facts: false
  vars:
    ansible_become: false
  no_log: true
  block:
    - name: Generate-if-absent seed with the converge token
      ansible.builtin.include_role:
        name: dryvist.homelab.openbao_secrets
        tasks_from: seed_generated
      vars:
        openbao_secrets_seed_addr: "{{ lookup('env', 'BAO_ADDR') | default('', true) }}"
        openbao_secrets_seed_token: "{{ lookup('env', 'BAO_TOKEN') | default('', true) }}"
        openbao_secrets_seed_mount: secret
        openbao_secrets_seed_path: apps/authelia
        openbao_secrets_seed_fields: "{{ authelia_seed_fields }}"
        openbao_secrets_seed_check_capabilities: true
        openbao_secrets_seed_register: authelia_seed_result

- name: Reconcile the guest copies with the seeded OpenBao values
  ansible.builtin.import_tasks: service_secrets_reconcile.yml
