---
# Read the guest copies of Authelia's service secrets and declare each field for the
# shared seed. The guest files are copies: OpenBao is authoritative (service_secrets.yml).

- name: Name each service secret field and its guest copy
  ansible.builtin.set_fact:
    authelia_service_secret_paths: >-
      {{ authelia_secret_files | combine({'oidc_jwks_private_key': authelia_oidc_jwks_key_file}) }}

- name: Stat each service secret copy on the guest
  ansible.builtin.stat:
    path: "{{ item.value }}"
  loop: "{{ authelia_service_secret_paths | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: authelia_secret_stat

- name: Read the guest copies that exist
  ansible.builtin.slurp:
    src: "{{ item.item.value }}"
  loop: "{{ authelia_secret_stat.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item.key }}"
  register: authelia_guest_secret_blobs
  no_log: true

- name: Start the guest copy values by field name
  ansible.builtin.set_fact:
    authelia_guest_secret_values: {}
  no_log: true

- name: Collect the guest copy values by field name
  ansible.builtin.set_fact:
    authelia_guest_secret_values: >-
      {{ authelia_guest_secret_values | combine({item.item.item.key: item.content | b64decode}) }}
  loop: "{{ authelia_guest_secret_blobs.results }}"
  loop_control:
    label: "{{ item.item.item.key }}"
  no_log: true

# The OIDC signing key is the one field that is not a random string. A candidate is
# generated in memory on the controller only when no guest copy exists, and it is used
# only if OpenBao has no value either. It is the openssl call the role always ran, moved
# to the controller, where the shared seed runs.
- name: Generate an OIDC signing key candidate on the controller (only when no guest copy exists)
  ansible.builtin.command:
    argv:
      - openssl
      - genpkey
      - -algorithm
      - RSA
      - -pkeyopt
      - rsa_keygen_bits:2048
  register: authelia_jwks_candidate
  when: "'oidc_jwks_private_key' not in authelia_guest_secret_values"
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Hold the signing key candidate for the seed (empty when a guest copy exists)
  ansible.builtin.set_fact:
    authelia_seed_candidates: >-
      {{ {'oidc_jwks_private_key': authelia_jwks_candidate.stdout}
         if authelia_jwks_candidate.stdout is defined else {} }}
  no_log: true

- name: Start the seed field declarations
  ansible.builtin.set_fact:
    authelia_seed_fields: []
  no_log: true

# A caller value is written only when OpenBao has no value for the field. An empty value
# lets the shared seed generate a random string, which is what the four string secrets get
# when neither OpenBao nor a guest copy holds one.
- name: Declare each service secret field for the shared seed
  ansible.builtin.set_fact:
    authelia_seed_fields: >-
      {{ authelia_seed_fields + [{
           'name': item.key,
           'length': 64,
           'charset': 'alnum',
           'value': (authelia_seed_candidates | combine(authelia_guest_secret_values)).get(item.key, '')
         }] }}
  loop: "{{ authelia_service_secret_paths | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
