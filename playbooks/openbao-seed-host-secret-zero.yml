---
# Seed-only entry point for a manual template: the AppRole rotator with
# bootstrap_seed_only set. Carried identities are skipped while their stored
# role_id and secret_id still form a live pair.
- name: Seed host secret-zero identities into the env document
  ansible.builtin.import_playbook: openbao-rotate-approles.yml
  vars:
    bootstrap_seed_only: true
