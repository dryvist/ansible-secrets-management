---
# Extra vars outrank set_fact, so a preset result list would replace the live probe.
- name: Refuse preset roster key-reader probe results
  ansible.builtin.assert:
    that:
      - rotate_roster_guard_probe_results is not defined
    fail_msg: rotate_roster_guard_probe_results is set by the probe and must not be preset.
    quiet: true

- name: Probe the roster key-reader AppRoles
  ansible.builtin.uri:
    url: "{{ rotate_bao_addr }}/v1/auth/approle/role/{{ item }}/role-id"
    method: GET
    headers:
      X-Vault-Token: "{{ rotate_login.json.auth.client_token }}"
  loop:
    - "{{ openbao_roster_router_key_reader_name }}"
    - "{{ openbao_roster_gateway_key_reader_name }}"
  register: _rotate_roster_reader_probe
  changed_when: false
  failed_when: false
  no_log: true

- name: Record roster key-reader probe statuses
  ansible.builtin.set_fact:
    rotate_roster_guard_probe_results: >-
      {{ rotate_roster_guard_probe_results | default([])
         + [{'name': item.item, 'status': item.status | default(-1)}] }}
  loop: "{{ _rotate_roster_reader_probe.results }}"
  loop_control:
    label: "{{ item.item }}"
