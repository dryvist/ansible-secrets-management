---
- name: Require roster key-reader probes to return 200 or 404
  ansible.builtin.assert:
    that:
      - item.status | int in [200, 404]
    fail_msg: >-
      Roster key reader {{ item.name }} returned unexpected status
      {{ item.status }}; expected 200 or 404.
    quiet: true
  loop: "{{ rotate_roster_guard_probe_results }}"
  loop_control:
    label: "{{ item.name }}"

- name: Capture live roster key-reader AppRoles
  ansible.builtin.set_fact:
    rotate_roster_guard_live_roster_owned_approle_names: >-
      {{ rotate_roster_guard_probe_results
         | selectattr('status', 'equalto', 200)
         | selectattr('name', 'equalto', openbao_roster_router_key_reader_name)
         | map(attribute='name') | list }}

# The caller-registry gateway reader can be live with an empty roster, so it does not trigger the inventory gate.
- name: Load the agent roster when a roster-owned key reader is live
  ansible.builtin.include_role:
    name: dryvist.homelab.inventory_resolve
  vars:
    inventory_resolve_openbao_token: >-
      {{ (((rotate_login | default({})).json | default({})).auth | default({})).client_token
         | default(lookup('env', 'BAO_TOKEN'), true) }}
    inventory_resolve_path: >-
      {{ rotate_roster_guard_inventory_path
         | default(lookup('env', 'TOFU_INVENTORY_PATH'), true) }}
  register: rotate_roster_guard_inventory_load
  when: rotate_roster_guard_live_roster_owned_approle_names | length > 0

- name: Refuse to rotate when live roster AppRoles are absent from inventory
  vars:
    _live_reader_approle_names: "{{ rotate_roster_guard_live_roster_owned_approle_names }}"
  ansible.builtin.assert:
    that:
      - _live_reader_approle_names | length == 0
        or openbao_roster_agent_valid_names | length > 0
    fail_msg: >-
      Live roster key readers {{ _live_reader_approle_names }} exist, but the
      published inventory could not be loaded or has no valid agents. Supply
      TOFU_INVENTORY_PATH pointing at the published inventory. Refusing to
      rotate a partial set.
    quiet: true
