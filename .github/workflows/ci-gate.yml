---
# CI Gate — wrapper around the shared ansible CI gate.
#
# ansible-lint and the standardized change filter live in
# JacobPEvans/.github/.github/workflows/_ansible-ci.yml so lint runs identically
# across the dryvist Ansible repositories.
#
# Molecule stays local. The shared workflow runs lint only (molecule: false),
# and this wrapper's molecule job consumes the scenario filter exported by the
# shared workflow, so there is one change-detection definition. The local
# "Merge Gate" aggregates every job.
#
# Lint, Role tests and Molecule restore the Galaxy content cache under the key
# ansible-galaxy-v2-<os>-<hash of requirements.yml>. Runs on pushes to develop
# and main save it, and pull request runs restore it.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Runs on develop and main save the dependency caches that pull request runs
  # restore; a cache saved from a pull request ref is readable by that pull
  # request only.
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: JacobPEvans/.github/.github/workflows/_ansible-ci.yml@v1
    with:
      # Molecule is owned locally (see header); the shared workflow runs lint only.
      molecule: false
      # The only scenario is openbao. Its filter lists the roles its converge
      # play includes plus the scenario directory. A change that matches no
      # filter widens to every scenario, per the shared workflow's rule.
      molecule_scenario_filters: |
        openbao:
          - 'roles/openbao/**'
          - 'molecule/openbao/**'

  molecule:
    name: Molecule
    needs: ci
    # v1.11 reports molecule=true with an empty scenario list when no
    # scenario's files changed; an empty matrix would fail the job.
    if: >-
      ${{ needs.ci.outputs.molecule == 'true' &&
      needs.ci.outputs.molecule_scenarios != '[]' &&
      needs.ci.outputs.tiny != 'true' }}
    uses: ./.github/workflows/_molecule.yml
    with:
      scenarios: ${{ needs.ci.outputs.molecule_scenarios }}

  # Role tests moved from the consuming repository, run with the same
  # invocations that repository used: the verify playbooks, then pytest.
  tests:
    name: Role tests
    needs: ci
    if: ${{ needs.ci.outputs.tiny != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"

      - name: Install Ansible, pytest and PyYAML
        run: uv pip install --system 'ansible-core>=2.16' pytest pyyaml

      # Exact cache hits force-refresh only the floating homelab-contracts v5
      # tag; misses run the forced install for the full requirement set.
      # Same path and key as the shared Ansible CI and _molecule.yml, so one
      # saved cache serves every job.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-v2-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install the collection's dependencies
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install -r requirements.yml

      - name: Refresh homelab-contracts major tag
        if: steps.galaxy-cache.outputs.cache-hit == 'true'
        run: >-
          ansible-galaxy collection install
          'git+https://github.com/dryvist/homelab-contracts.git#/ansible/,v5' --force
        env:
          ANSIBLE_GALAXY_SERVER_TIMEOUT: "60"

      - name: Verify the AppRole source-address class map
        run: ansible-playbook tests/approle_cidr_class/verify.yml

      - name: Verify the execution plane's credential is bounded elsewhere
        run: ansible-playbook tests/plane_identity_bounds/verify.yml

      - name: Verify every non-expiring secret_id has a compensating control
        run: ansible-playbook tests/nonexpiring_secret_ids/verify.yml

      - name: Verify the AppRole CIDR bound drift
        run: python3 -m pytest -v tests/test_openbao_approle_cidr_drift.py

      - name: Verify the base-policy derivation for Terrakube workspaces
        run: python3 -m pytest -v tests/test_terrakube_base_policies_derivation.py

      - name: Verify the AppRole secret_id liveness probe
        run: python3 -m pytest -v tests/test_approle_secret_id_liveness.py

      - name: Verify the voter-health sampler emits the quorum token
        run: python3 -m pytest -v tests/test_voter_health_emits_quorum_contract.py

      - name: Verify the run wrapper's inventory and recap verdict
        run: python3 -m pytest -v tests/test_run_ansible_wrapper.py

      - name: Verify the Azure engine config-missing decision
        run: python3 -m pytest -v tests/test_openbao_azure_config_missing.py

      - name: Verify the Azure IaC admin identity is narrow and per-call
        run: python3 -m pytest -v tests/test_openbao_azure_iac_admin_identity.py

      - name: Verify the AppRole rotation roster guard and check mode
        run: python3 -m pytest -v tests/test_openbao_rotation_roster.py

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3

      - name: Verify the dispatcher raw mint grant is enforced by the ACL
        run: >-
          nix shell --inputs-from . nixpkgs#openbao
          --command python3 -m pytest -v tests/test_openbao_open_llm_raw_mint_acl.py

  gate:
    name: Merge Gate
    needs: [ci, molecule, tests]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: ${{ needs.ci.outputs.tiny == 'true' && 'molecule,tests' || 'molecule' }}
          jobs: ${{ toJSON(needs) }}
