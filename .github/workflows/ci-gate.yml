---
# CI Gate — wrapper around the shared ansible CI gate.
#
# ansible-lint and the standardized change filter live in
# JacobPEvans/.github/.github/workflows/_ansible-ci.yml so lint runs identically
# across the dryvist Ansible repositories.
#
# Molecule stays local. The shared CI workflow runs lint only (molecule: false),
# while a parallel changes call runs the same filter. Molecule consumes its
# scenario output; other local jobs retain their existing CI dependencies. The
# local "Merge Gate" aggregates every job.
#
# Lint, Role tests and Molecule restore the Galaxy content cache under the key
# ansible-galaxy-v2-<os>-<hash of requirements.yml>. Runs on pushes to develop
# and main save it, and pull request runs restore it.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Runs on develop and main save the dependency caches that pull request runs
  # restore; a cache saved from a pull request ref is readable by that pull
  # request only.
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: JacobPEvans/.github/.github/workflows/_ansible-ci.yml@v1
    with:
      # Molecule is owned locally (see header); the shared workflow runs lint only.
      molecule: false
      # The only scenario is openbao. Its filter lists the roles its converge
      # play includes plus the scenario directory. A change that matches no
      # filter widens to every scenario, per the shared workflow's rule.
      molecule_scenario_filters: &molecule_scenario_filters |
        openbao:
          - 'roles/openbao/**'
          - 'molecule/openbao/**'

  changes:
    name: Detect Changes
    uses: JacobPEvans/.github/.github/workflows/_ansible-changes.yml@v1
    with:
      molecule: false
      molecule_scenario_filters: *molecule_scenario_filters

  molecule:
    name: Molecule
    needs: changes
    # v1.11 reports molecule=true with an empty scenario list when no
    # scenario's files changed; an empty matrix would fail the job.
    if: >-
      ${{ needs.changes.outputs.molecule == 'true' &&
      needs.changes.outputs.molecule_scenarios != '[]' &&
      needs.changes.outputs.tiny != 'true' }}
    uses: ./.github/workflows/_molecule.yml
    with:
      scenarios: ${{ needs.changes.outputs.molecule_scenarios }}

  # Role tests moved from the consuming repository, run with the same
  # invocations that repository used: the verify playbooks, then pytest.
  tests:
    name: Role tests
    needs: changes
    if: ${{ needs.changes.outputs.tiny != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 10 }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"

      - name: Install Ansible, pytest, PyYAML and Jinja2
        run: uv pip install --system 'ansible-core>=2.16' pytest pyyaml jinja2

      - name: Verify the rendered Authelia configuration with Authelia's validator
        run: ansible-playbook -i localhost, -c local tests/authelia_validate_config/verify.yml

      # Exact cache hits force-refresh only the floating homelab-contracts v5
      # tag; misses run the forced install for the full requirement set.
      # Same path and key as the shared Ansible CI and _molecule.yml, so one
      # saved cache serves every job.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-v2-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install the collection's dependencies
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install -r requirements.yml

      - name: Refresh homelab-contracts major tag
        if: steps.galaxy-cache.outputs.cache-hit == 'true'
        run: >-
          ansible-galaxy collection install
          'git+https://github.com/dryvist/homelab-contracts.git#/ansible/,v5' --force
        env:
          ANSIBLE_GALAXY_SERVER_TIMEOUT: "60"

      - name: Verify the AppRole source-address class map
        run: ansible-playbook tests/approle_cidr_class/verify.yml

      - name: Verify the execution plane's credential is bounded elsewhere
        run: ansible-playbook tests/plane_identity_bounds/verify.yml

      - name: Verify every non-expiring secret_id has a compensating control
        run: ansible-playbook tests/nonexpiring_secret_ids/verify.yml

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3

      - name: Run the full pytest suite
        run: >-
          nix shell --inputs-from . nixpkgs#openbao
          --command python3 -m pytest -q tests/

  gate:
    name: Merge Gate
    needs: [ci, changes, molecule, tests]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: ${{ needs.ci.outputs.tiny == 'true' && 'molecule,tests' || 'molecule' }}
          jobs: ${{ toJSON(needs) }}
