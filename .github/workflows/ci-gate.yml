---
# CI Gate — wrapper around the shared ansible CI gate.
#
# ansible-lint and the standardized change filter live in
# dryvist/.github/.github/workflows/_ansible-ci.yml so lint runs identically
# across the dryvist Ansible repositories.
#
# Molecule stays local. The shared workflow runs lint only (molecule: false),
# and this wrapper's molecule job consumes the scenario filter exported by the
# shared workflow, so there is one change-detection definition. The local
# "Merge Gate" aggregates every job.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: dryvist/.github/.github/workflows/_ansible-ci.yml@aeab7c1ac2a9dc807e468fc507ad5b5c1c93df8c # v1.11.4
    with:
      # Molecule is owned locally (see header); the shared workflow runs lint only.
      molecule: false
      # The only scenario is openbao. Its filter lists the roles its converge
      # play includes plus the scenario directory. A change that matches no
      # filter widens to every scenario, per the shared workflow's rule.
      molecule_scenario_filters: |
        openbao:
          - 'roles/openbao/**'
          - 'molecule/openbao/**'

  molecule:
    name: Molecule
    needs: ci
    # v1.11 reports molecule=true with an empty scenario list when no
    # scenario's files changed; an empty matrix would fail the job.
    if: ${{ needs.ci.outputs.molecule == 'true' && needs.ci.outputs.molecule_scenarios != '[]' }}
    uses: ./.github/workflows/_molecule.yml
    with:
      scenarios: ${{ needs.ci.outputs.molecule_scenarios }}

  # Role tests moved from the consuming repository, run with the same
  # invocations that repository used: the verify playbooks, then pytest.
  tests:
    name: Role tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Install Ansible, pytest and PyYAML
        run: uv pip install --system 'ansible-core>=2.16' pytest pyyaml

      - name: Install the collection's dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: Verify the AppRole source-address class map
        run: ansible-playbook tests/approle_cidr_class/verify.yml

      - name: Verify the execution plane's credential is bounded elsewhere
        run: ansible-playbook tests/plane_identity_bounds/verify.yml

      - name: Verify every non-expiring secret_id has a compensating control
        run: ansible-playbook tests/nonexpiring_secret_ids/verify.yml

      - name: Verify the AppRole CIDR bound drift
        run: python3 -m pytest -v tests/test_openbao_approle_cidr_drift.py

      - name: Verify the base-policy derivation for Terrakube workspaces
        run: python3 -m pytest -v tests/test_terrakube_base_policies_derivation.py

      - name: Verify the AppRole secret_id liveness probe
        run: python3 -m pytest -v tests/test_approle_secret_id_liveness.py

      - name: Verify the voter-health sampler emits the quorum token
        run: python3 -m pytest -v tests/test_voter_health_emits_quorum_contract.py

      - name: Verify the run wrapper's inventory and recap verdict
        run: python3 -m pytest -v tests/test_run_ansible_wrapper.py

  gate:
    name: Merge Gate
    needs: [ci, molecule, tests]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: molecule
          jobs: ${{ toJSON(needs) }}
