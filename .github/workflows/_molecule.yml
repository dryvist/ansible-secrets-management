---
name: Molecule

on:
  workflow_call:
    inputs:
      scenarios:
        description: >-
          JSON array of the scenarios this change touched, from the shared
          ansible CI's `molecule_scenarios` output. An empty string means "run
          every scenario".
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # The matrix is DERIVED from the scenarios on disk, never hand-written — see
  # .github/scripts/discover-molecule-scenarios.sh for why.
  discover:
    name: Discover scenarios
    runs-on: ubuntu-latest
    outputs:
      # Narrowed set when the change is attributable, the full on-disk list
      # otherwise.
      scenarios: ${{ inputs.scenarios != '' && inputs.scenarios || steps.find.outputs.scenarios }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Find molecule scenarios
        id: find
        run: .github/scripts/discover-molecule-scenarios.sh

  test:
    name: Molecule (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.discover.outputs.scenarios) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      - name: Install Molecule and dependencies
        run: |
          uv pip install --system \
            molecule \
            'molecule-plugins[docker]>=23.0.0' \
            'ansible-core>=2.16' \
            'docker>=7.0.0' \
            netaddr \
            ansible-lint

      # Cache Galaxy content keyed on requirements.yml. On a hit the collections
      # (and any roles) are already present, so the install below is skipped;
      # on a miss (requirements.yml changed) it runs and repopulates the cache.
      # The key matches the shared Ansible CI and the Role tests job.
      - name: Cache Ansible Galaxy content
        id: galaxy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-galaxy-v2-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible collections
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: ansible-galaxy install -r requirements.yml

      - name: Run molecule tests
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_SCENARIO: ${{ matrix.scenario }}
          # Docker API client timeout (seconds) for community.docker modules,
          # incl. molecule destroy. Default is 60s.
          DOCKER_TIMEOUT: "180"
        # --destroy never skips only the run's final destroy step (the
        # leading cleanup/destroy before create still runs). The runner VM
        # is discarded after the job, so the final teardown is unneeded work.
        run: molecule test -s "$MOLECULE_SCENARIO" --destroy never
