---
- name: Load Azure role defaults for validation checks
  ansible.builtin.include_vars:
    dir: "{{ playbook_dir }}/../../roles/openbao/defaults/main"

- name: Assert an empty role input disables the engine
  ansible.builtin.assert:
    that:
      - openbao_azure_roles | length == 0
      - not openbao_azure_engine_enabled | bool
    fail_msg: "An empty Azure role input must leave the engine disabled."

- name: Create runtime-only values for Azure validation cases
  ansible.builtin.set_fact:
    azure_validation_uuid: >-
      {{ lookup('pipe', "python3 -c 'import uuid; print(uuid.uuid4())'") }}
    azure_validation_suffix: >-
      {{ lookup('pipe', "python3 -c 'import uuid; print(uuid.uuid4().hex[:8])'") }}
  no_log: true

- name: Run validation with an invalid Azure role name
  block:
    - name: Validate an invalid Azure role name
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../roles/openbao/tasks/validate-azure-roles.yml"
      vars:
        openbao_azure_roles:
          - name: "case_{{ azure_validation_suffix }}"
            application_object_id: "{{ azure_validation_uuid }}"
            ttl: 15m
            max_ttl: 15m
            gated: true
        openbao_azure_tenant_id: "{{ azure_validation_uuid }}"
  rescue:
    - name: Assert the invalid Azure role name was rejected
      ansible.builtin.assert:
        that:
          - ansible_failed_task.name == "Validate each Azure role object"
        fail_msg: "The Azure role name case failed for an unexpected reason."

- name: Run validation with an ungated long TTL
  block:
    - name: Validate an ungated Azure role with an excessive max TTL
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../roles/openbao/tasks/validate-azure-roles.yml"
      vars:
        openbao_azure_roles:
          - name: "case-{{ azure_validation_suffix }}"
            application_object_id: "{{ azure_validation_uuid }}"
            ttl: 15m
            max_ttl: 2h
            gated: false
        openbao_azure_tenant_id: "{{ azure_validation_uuid }}"
  rescue:
    - name: Assert the excessive Azure TTL was rejected by the bounds check
      ansible.builtin.assert:
        that:
          - ansible_failed_task.name == "Validate the Azure role TTL bounds"
        fail_msg: "The Azure TTL case failed for an unexpected reason."
