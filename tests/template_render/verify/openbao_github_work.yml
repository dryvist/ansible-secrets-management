---
# The github-work mount: no declared sets, a derived `read` set, two policies
# and two AppRoles. Read mints only the derived set, so it can never mint
# write; write must name repositories and sends no map, so it carries the App's
# own grant. Neither policy reaches any other path.
- name: Render and verify the github-work mount, policies and AppRoles
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    _template_dir: "../../../roles/openbao/templates"
    ansible_managed: "test fixture"
    # A grant-reading token's permissions: write and write-only grants alike.
    _grant_fixture:
      json:
        data:
          permissions:
            contents: write
            pull_requests: write
            workflows: write
            metadata: read
            checks: read
    _work_policies:
      - policy: "{{ openbao_github_work_read_policy_name }}"
        template: github-work-read-policy.hcl.j2
        tier: read
      - policy: "{{ openbao_github_work_write_policy_name }}"
        template: github-work-write-policy.hcl.j2
        tier: write
    _work_approles:
      - approle: "{{ openbao_github_work_read_approle_name }}"
        policy: "{{ openbao_github_work_read_policy_name }}"
      - approle: "{{ openbao_github_work_write_approle_name }}"
        policy: "{{ openbao_github_work_write_policy_name }}"
    _work_secret_id_paths:
      - "auth/approle/role/{{ openbao_github_work_read_approle_name }}/secret-id"
      - "auth/approle/role/{{ openbao_github_work_write_approle_name }}/secret-id"

  tasks:
    - name: Load the openbao role defaults
      ansible.builtin.include_vars:
        dir: ../../../roles/openbao/defaults/main

    - name: Pin the unconfigured case
      ansible.builtin.set_fact:
        openbao_github_work_installation_id: ""
        # Fixture workspace names: a real converge reads these from the runtime
        # environment, and the declared policy list renders them.
        openbao_terrakube_network_workspace: example-network
        openbao_terrakube_aws_workspace: example-aws

    - name: Assert no installation ID yields no mount and no policy
      ansible.builtin.assert:
        that:
          - openbao_github_work_mount not in (openbao_github_app_mounts | map(attribute='mount') | list)
          - >-
            _work_policies | map(attribute='policy')
            | select('in', openbao_policies | map(attribute='name') | list) | list == []
        quiet: true

    - name: Pin the configured case
      ansible.builtin.set_fact:
        openbao_github_work_installation_id: "1"

    - name: Assert a configured installation declares the mount with no sets, and both policies
      vars:
        _mount: >-
          {{ openbao_github_app_mounts | selectattr('mount', 'equalto', openbao_github_work_mount) | first }}
      ansible.builtin.assert:
        that:
          - _mount.permission_sets == []
          - _mount.derive_read
          - _mount.installation_id == openbao_github_work_installation_id
        quiet: true

    - name: Assert the derived read map is the standard read list cut to the grant, all read
      vars:
        openbao_github_app_mount_grant: "{{ _grant_fixture }}"
      ansible.builtin.assert:
        that:
          - >-
            openbao_github_app_mount_read_permissions
            == {'checks': 'read', 'contents': 'read', 'metadata': 'read', 'pull_requests': 'read'}
          - >-
            _work_policies | map(attribute='policy')
            | reject('in', openbao_policies | map(attribute='name') | list) | list == []
        quiet: true

    - name: Render the work policies
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item.template }}"
        dest: "{{ _fixture_dir }}/work-{{ item.tier }}-policy.hcl"
        mode: "0644"
      loop: "{{ _work_policies }}"

    - name: Read the rendered work policies
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/work-{{ item.tier }}-policy.hcl"
      loop: "{{ _work_policies }}"
      register: _work_policy_raw

    - name: Assert read mints only the derived set and write names repositories with no map
      vars:
        _m: "{{ openbao_github_work_mount }}"
        _read_text: "{{ _work_policy_raw.results[0].content | b64decode }}"
        _write_text: "{{ _work_policy_raw.results[1].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - (_read_text | regex_findall('(?m)^path "([^"]+)"')) == [_m ~ '/token/read']
          - (_write_text | regex_findall('(?m)^path "([^"]+)"')) == [_m ~ '/token']
          - _write_text is search('required_parameters = \\["org_name", "repositories"\\]')
          - _write_text is not search('"permissions"')
          - _write_text is search('"installation_id" = \\[\\]')
          - (_read_text ~ _write_text) is not search('administration')
          - >-
            ((_read_text ~ _write_text) | regex_findall('capabilities = (.*)')
             | select('search', 'read|list|delete|sudo') | list) == []
        fail_msg: >-
          github-work-read must grant only {{ _m }}/token/read and github-work-write
          must require repositories and send no map on {{ _m }}/token.
        quiet: true

    - name: Assert each work AppRole is human-minted, workstation-bound and capped at one hour
      vars:
        _role: >-
          {{ openbao_approles | selectattr('name', 'equalto', item.approle) | first }}
      ansible.builtin.assert:
        that:
          - _role.policy == item.policy
          - _role.manage_secret_id is defined and not _role.manage_secret_id
          - _role.token_ttl == '1h'
          - _role.token_explicit_max_ttl == '1h'
          - _role.secret_id_ttl == '0s'
          - _role.secret_id_num_uses == 0
          - openbao_approle_cidr_class_map[item.approle] == 'workstation'
          - item.approle not in openbao_rotate_doppler_sync_domains
        quiet: true
      loop: "{{ _work_approles }}"

    - name: Assert github-work and github-work-admin are retired and no longer declared
      ansible.builtin.assert:
        that:
          - "item in openbao_retired_approles"
          - "item in openbao_retired_policies"
          - "item not in (openbao_approles | map(attribute='name') | list)"
          - "item not in (openbao_policies | map(attribute='name') | list)"
        quiet: true
      loop: [github-work, github-work-admin]

    - name: Render the human-unlock and approle-issuer policies
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item }}.j2"
        dest: "{{ _fixture_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - human-unlock-policy.hcl
        - approle-issuer-policy.hcl

    - name: Read the rendered human-unlock and approle-issuer policies
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/{{ item }}"
      register: _unlock_issuer_raw
      loop:
        - human-unlock-policy.hcl
        - approle-issuer-policy.hcl

    - name: Assert human-unlock mints all work secret_ids and approle-issuer mints none
      vars:
        _unlock_paths: >-
          {{ _unlock_issuer_raw.results[0].content | b64decode
             | regex_findall('(?m)^path "([^"]+)"') }}
        _issuer_paths: >-
          {{ _unlock_issuer_raw.results[1].content | b64decode
             | regex_findall('(?m)^path "([^"]+)"') }}
      ansible.builtin.assert:
        that:
          - _work_secret_id_paths | select('in', _unlock_paths) | list == _work_secret_id_paths
          - _work_secret_id_paths | select('in', _issuer_paths) | list == []
        fail_msg: >-
          human-unlock must mint the secret_id of each work AppRole, and
          approle-issuer must mint none.
        quiet: true
