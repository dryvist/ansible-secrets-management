---
- name: Render and verify the GitHub org-secrets read policy
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    ansible_managed: test fixture
    _fixture_dir: "{{ render_tmp }}"
    _template_dir: ../../../roles/openbao/templates

  tasks:
    - name: Load the openbao role defaults
      ansible.builtin.include_vars:
        dir: ../../../roles/openbao/defaults/main

    - name: Pin the runtime Terrakube workspace names to fixtures
      ansible.builtin.set_fact:
        openbao_terrakube_network_workspace: fixture-network
        openbao_terrakube_aws_workspace: fixture-aws

    - name: Pin organization installation IDs to fixture values
      ansible.builtin.set_fact:
        openbao_github_dryvist_installation_id: fixture
        openbao_github_jacobpevans_installation_id: fixture
        openbao_github_jpe_ansible_installation_id: fixture
        openbao_github_jpe_cribl_installation_id: fixture
        openbao_github_jpe_private_installation_id: fixture
        openbao_github_jpe_splunk_installation_id: fixture
        openbao_github_jpe_openbao_plugin_secrets_installation_id: fixture

    - name: Assert the permission map and all configured org sets are exact
      vars:
        _org_secret_sets: "{{ openbao_github_org_secrets_permission_sets }}"
        _expected_org_secret_names:
          - dryvist-org-secrets
          - jacobpevans-org-secrets
          - jpe-ansible-org-secrets
          - jpe-cribl-org-secrets
          - jpe-private-org-secrets
          - jpe-splunk-org-secrets
          - jpe-openbao-plugin-secrets-org-secrets
      ansible.builtin.assert:
        that:
          - openbao_github_org_secrets_permissions.keys() | list == ['organization_secrets']
          - openbao_github_org_secrets_permissions.organization_secrets == 'write'
          - _org_secret_sets | map(attribute='name') | list == _expected_org_secret_names
          - _org_secret_sets | map(attribute='tier') | unique | list == ['org-secrets']
          - _org_secret_sets | selectattr('installation_id', 'equalto', '') | list == []
          - >-
            _org_secret_sets
            | selectattr('permissions', 'equalto', openbao_github_org_secrets_permissions)
            | list | length == 7
        fail_msg: >-
          Org-secret sets must cover each configured organization, use the
          organization_secrets:write map, and omit empty installation IDs.

    - name: Leave one organization installation unconfigured
      ansible.builtin.set_fact:
        openbao_github_jpe_splunk_installation_id: ""

    - name: Assert an empty installation ID creates no permission set
      ansible.builtin.assert:
        that:
          - >-
            openbao_github_org_secrets_permission_sets
            | selectattr('name', 'equalto', 'jpe-splunk-org-secrets') | list == []
          - >-
            openbao_github_org_secrets_permission_sets
            | selectattr('installation_id', 'equalto', '') | list == []
        fail_msg: An org-secret permission set must not have an empty installation ID.

    - name: Render github-mint with configured organization sets
      ansible.builtin.template:
        src: "{{ _template_dir }}/github-mint-policy.hcl.j2"
        dest: "{{ _fixture_dir }}/github-mint-policy.hcl"
        mode: "0644"

    - name: Read github-mint with configured organization sets
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/github-mint-policy.hcl"
      register: _github_mint_policy_raw

    - name: Assert github-mint excludes all org-secrets sets
      vars:
        _mint_paths: >-
          {{ (_github_mint_policy_raw.content | b64decode)
             | regex_findall('(?m)^path "([^\"]+)"') }}
      ansible.builtin.assert:
        that:
          - _mint_paths | select('search', '/token/[^/]*-org-secrets$') | list == []
        fail_msg: github-mint must not grant any org-secrets permission set.

    - name: Assert the org-secrets workspace is separate from public tofu-github
      vars:
        _org_workspace: >-
          {{ openbao_terrakube_workspaces
             | selectattr('name', 'equalto', openbao_terrakube_org_secrets_workspace_name)
             | first }}
        _public_github_workspace_names: >-
          {{ openbao_terrakube_workspaces
             | selectattr('name', 'equalto', 'tofu-github')
             | map(attribute='name') | list }}
      ansible.builtin.assert:
        that:
          - _public_github_workspace_names == ['tofu-github']
          - _org_workspace.name == 'github-org-secrets'
          - _org_workspace.api_read | length == 6
          - _org_workspace.additional_policies == [openbao_github_org_secrets_read_policy_name]
          - not (_org_workspace.github_admin_raw | default(false) | bool)
          - _org_workspace.kv_write | default([]) == []
          - openbao_terrakube_org_secrets_workspace_name not in openbao_config_write_terrakube_workspaces
        fail_msg: >-
          The org-secrets workspace must have an exact separate identity,
          scoped read policies, no raw admin endpoint, and no config-write.

    - name: Assert the org-secrets workspace is the only one with a Transit key
      ansible.builtin.assert:
        that:
          - >-
            (openbao_terrakube_workspaces
             | selectattr('state_transit_key', 'defined')
             | map(attribute='name') | list)
            == ['github-org-secrets']
          - >-
            _org_workspace.state_transit_key
            == openbao_github_org_secrets_state_transit_key
      vars:
        _org_workspace: >-
          {{ openbao_terrakube_workspaces
             | selectattr('name', 'equalto', openbao_terrakube_org_secrets_workspace_name)
             | first }}

    - name: Render the org-secrets workspace policy
      ansible.builtin.template:
        src: "{{ _template_dir }}/terrakube-workspace-policy.hcl.j2"
        dest: "{{ _fixture_dir }}/terrakube-github-org-secrets-policy.hcl"
        mode: "0644"
      loop: >-
        {{ openbao_terrakube_base_policies
           | selectattr('name', 'equalto', 'terrakube-github-org-secrets') | list }}

    - name: Read the org-secrets workspace policy
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/terrakube-github-org-secrets-policy.hcl"
      register: _terrakube_org_secrets_policy_raw

    - name: Assert the workspace policy grants exact token and transit paths
      vars:
        _workspace_policy_text: "{{ _terrakube_org_secrets_policy_raw.content | b64decode }}"
        _workspace_policy_paths: >-
          {{ _workspace_policy_text | regex_findall('(?m)^path \"([^\"]+)\"') }}
        _workspace_policy_capabilities: >-
          {{ _workspace_policy_text | regex_findall('(?m)^  capabilities = (.*)$') }}
        _expected_token_paths: >-
          {{ openbao_github_org_secrets_permission_sets
             | map(attribute='name')
             | map('regex_replace', '^', openbao_github_mount ~ '/token/')
             | list }}
        _expected_transit_paths:
          - >-
            {{ openbao_transit_mount }}/datakey/plaintext/{{
            openbao_github_org_secrets_state_transit_key }}
          - >-
            {{ openbao_transit_mount }}/decrypt/{{
            openbao_github_org_secrets_state_transit_key }}
      ansible.builtin.assert:
        that:
          - _workspace_policy_paths == _expected_token_paths + _expected_transit_paths
          - >-
            _workspace_policy_capabilities
            == (['["read"]'] * (_expected_token_paths | length)
                + ['["update"]', '["update"]'])
          - >-
            openbao_transit_mount ~ '/datakey/plaintext/' ~ openbao_tofu_state_transit_key
            not in _workspace_policy_paths
          - >-
            openbao_transit_mount ~ '/decrypt/' ~ openbao_tofu_state_transit_key
            not in _workspace_policy_paths
          - "'auth/token/' not in _workspace_policy_text"
          - "'github-admin/token\"' not in _workspace_policy_text"
        fail_msg: >-
          The Terrakube org-secrets policy must read configured token sets and
          use only its own Transit key for state encryption.

    - name: Render the org-secrets Terrakube JWT role payload
      vars:
        terrakube_workspace: >-
          {{ openbao_terrakube_workspaces
             | selectattr('name', 'equalto', openbao_terrakube_org_secrets_workspace_name)
             | first }}
      ansible.builtin.template:
        src: "{{ _template_dir }}/terrakube-workspace-jwt-role.json.j2"
        dest: "{{ _fixture_dir }}/terrakube-github-org-secrets-role.json"
        mode: "0644"

    - name: Read the org-secrets JWT role payload
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/terrakube-github-org-secrets-role.json"
      register: _terrakube_org_secrets_role_raw

    - name: Assert the org-secrets JWT role is exact and carries no config-write
      vars:
        _org_role: "{{ _terrakube_org_secrets_role_raw.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - >-
            _org_role.bound_claims.sub
            == 'organization:' ~ openbao_terrakube_organization
               ~ ':workspace:' ~ openbao_terrakube_org_secrets_workspace_name
          - _org_role.bound_claims_type == 'string'
          - >-
            _org_role.policies
            == ['github-org-secrets-read', 'terrakube-github-org-secrets']
          - openbao_config_write_policy_name not in _org_role.policies
        fail_msg: >-
          The JWT role must bind only github-org-secrets and attach only
          its workspace policy plus github-org-secrets-read.

    - name: Render the public tofu-github JWT role payload
      vars:
        terrakube_workspace: >-
          {{ openbao_terrakube_workspaces
             | selectattr('name', 'equalto', 'tofu-github') | first }}
      ansible.builtin.template:
        src: "{{ _template_dir }}/terrakube-workspace-jwt-role.json.j2"
        dest: "{{ _fixture_dir }}/terrakube-tofu-github-role.json"
        mode: "0644"

    - name: Read the public tofu-github JWT role payload
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/terrakube-tofu-github-role.json"
      register: _terrakube_public_github_role_raw

    - name: Assert public tofu-github retains the original workspace glob
      vars:
        _public_role: "{{ _terrakube_public_github_role_raw.content | b64decode | from_json }}"
        _org_role: "{{ _terrakube_org_secrets_role_raw.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - >-
            _public_role.bound_claims.sub
            == ['organization:dryvist:workspace:tofu-github',
                'organization:dryvist:workspace:tofu-github-*']
          - _public_role.bound_claims_type == 'glob'
          - _public_role.policies == ['terrakube-tofu-github']
          - _public_role.bound_claims.sub != _org_role.bound_claims.sub
          - "'tofu-github' not in openbao_config_write_terrakube_workspaces"
          - "openbao_terrakube_aws_workspace not in openbao_config_write_terrakube_workspaces"
        fail_msg: >-
          The public tofu-github workspace must retain the original exact-name
          and `tofu-github-*` glob subject bindings without config-write.

    - name: Render the tofu-github webhook reader policy
      ansible.builtin.template:
        src: "{{ _template_dir }}/terrakube-workspace-policy.hcl.j2"
        dest: "{{ _fixture_dir }}/terrakube-tofu-github-policy.hcl"
        mode: "0644"
      loop: >-
        {{ openbao_terrakube_base_policies
           | selectattr('name', 'equalto', 'terrakube-tofu-github') | list }}

    - name: Render the AWS webhook writer policy
      ansible.builtin.template:
        src: "{{ _template_dir }}/terrakube-workspace-policy.hcl.j2"
        dest: "{{ _fixture_dir }}/terrakube-fixture-aws-policy.hcl"
        mode: "0644"
      loop: >-
        {{ openbao_terrakube_base_policies
           | selectattr('name', 'equalto', 'terrakube-fixture-aws') | list }}

    - name: Read the webhook reader and writer policies
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/terrakube-{{ item }}-policy.hcl"
      register: _webhook_workspace_policies
      loop:
        - tofu-github
        - fixture-aws

    - name: Assert webhook fields use their separate mounts with scoped capabilities
      vars:
        _reader_text: >-
          {{ (_webhook_workspace_policies.results[0].content | b64decode) }}
        _writer_text: >-
          {{ (_webhook_workspace_policies.results[1].content | b64decode) }}
        _reader_paths: >-
          {{ _reader_text | regex_findall('(?m)^path "([^"]+)"')
             | select('search', 'apps/hermes-webhook') | list }}
        _writer_paths: >-
          {{ _writer_text | regex_findall('(?m)^path "([^"]+)"')
             | select('search', 'apps/hermes-webhook') | list }}
        _external_path: "secrets-external/data/{{ openbao_hermes_webhook_kv_path }}"
        _config_path: "{{ openbao_config_mount }}/data/{{ openbao_hermes_webhook_kv_path }}"
      ansible.builtin.assert:
        that:
          - _reader_paths == [_external_path, _config_path]
          - _writer_paths == [_external_path, _config_path]
          - >-
            _reader_text is search('(?s)path "' ~ _external_path ~ '" \{\s*capabilities = \["read"\]\s*\}')
          - >-
            _reader_text is search('(?s)path "' ~ _config_path ~ '" \{\s*capabilities = \["read"\]\s*\}')
          - >-
            _writer_text is search(
            '(?s)path "' ~ _external_path ~ '" \{\s*capabilities = '
            ~ '\["create", "read", "update"\]\s*\}')
          - >-
            _writer_text is search(
            '(?s)path "' ~ _config_path ~ '" \{\s*capabilities = '
            ~ '\["create", "read", "update"\]\s*\}')
          - >-
            openbao_kv_mount ~ '/data/' ~ openbao_hermes_webhook_kv_path
            not in _reader_text
          - >-
            openbao_kv_mount ~ '/data/' ~ openbao_hermes_webhook_kv_path
            not in _writer_text
        fail_msg: >-
          The webhook reader and writer policies must use only the external and
          config mounts with read-only and write capabilities respectively.

    - name: Assert the retired role prefix cannot match the org-secrets role
      ansible.builtin.assert:
        that:
          - openbao_retired_terrakube_prefix == 'terrakube-tofu-github-'
          - >-
            ('terrakube-github-org-secrets'
             | regex_search('^' ~ (openbao_retired_terrakube_prefix | regex_escape))) is none
        fail_msg: The retired per-owner prefix must not match github-org-secrets.

    - name: Render the GitHub org-secrets read policy
      ansible.builtin.template:
        src: "{{ _template_dir }}/github-org-secrets-read-policy.hcl.j2"
        dest: "{{ _fixture_dir }}/github-org-secrets-read-policy.hcl"
        mode: "0644"

    - name: Read the rendered policy
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/github-org-secrets-read-policy.hcl"
      register: _github_org_secrets_policy_raw

    - name: Assert the policy contains exactly the two declared data paths
      vars:
        _policy_text: "{{ _github_org_secrets_policy_raw.content | b64decode }}"
        _policy_paths: "{{ _policy_text | regex_findall('(?m)^path \"([^\"]+)\"') }}"
        _policy_capabilities: "{{ _policy_text | regex_findall('(?m)^  capabilities = (.*)$') }}"
      ansible.builtin.assert:
        that:
          - _policy_paths == [
              openbao_github_org_secrets_mount ~ '/data/' ~ openbao_github_org_disclosure_denylist_path,
              openbao_github_org_secrets_mount ~ '/data/' ~ openbao_github_org_gitleaks_path]
          - _policy_capabilities == ['["read"]', '["read"]']
          - openbao_github_org_disclosure_denylist_field == 'terms'
          - openbao_github_org_gitleaks_fields == ['private_config', 'license_key']
        fail_msg: >-
          The github-org-secrets-read policy must read only the two declared
          secrets-external data paths, with no wildcard or metadata grant.
