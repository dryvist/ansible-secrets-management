---
- name: Render and verify the GitHub org-secrets read policy
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    ansible_managed: test fixture
    _fixture_dir: "{{ render_tmp }}"
    _template_dir: ../../../roles/openbao/templates

  tasks:
    - name: Load the openbao role defaults
      ansible.builtin.include_vars:
        dir: ../../../roles/openbao/defaults/main

    - name: Pin organization installation IDs to fixture values
      ansible.builtin.set_fact:
        openbao_github_dryvist_installation_id: fixture
        openbao_github_jacobpevans_installation_id: fixture
        openbao_github_jpe_ansible_installation_id: fixture
        openbao_github_jpe_cribl_installation_id: fixture
        openbao_github_jpe_private_installation_id: fixture
        openbao_github_jpe_splunk_installation_id: fixture
        openbao_github_jpe_openbao_plugin_secrets_installation_id: fixture

    - name: Assert the permission map and all configured org sets are exact
      vars:
        _org_secret_sets: "{{ openbao_github_org_secrets_permission_sets }}"
        _expected_org_secret_names:
          - dryvist-org-secrets
          - jacobpevans-org-secrets
          - jpe-ansible-org-secrets
          - jpe-cribl-org-secrets
          - jpe-private-org-secrets
          - jpe-splunk-org-secrets
          - jpe-openbao-plugin-secrets-org-secrets
      ansible.builtin.assert:
        that:
          - openbao_github_org_secrets_permissions.keys() | list == ['organization_secrets']
          - openbao_github_org_secrets_permissions.organization_secrets == 'write'
          - _org_secret_sets | map(attribute='name') | list == _expected_org_secret_names
          - _org_secret_sets | map(attribute='tier') | unique | list == ['org-secrets']
          - _org_secret_sets | selectattr('installation_id', 'equalto', '') | list == []
          - >-
            _org_secret_sets
            | selectattr('permissions', 'equalto', openbao_github_org_secrets_permissions)
            | list | length == 7
        fail_msg: >-
          Org-secret sets must cover each configured organization, use the
          organization_secrets:write map, and omit empty installation IDs.

    - name: Leave one organization installation unconfigured
      ansible.builtin.set_fact:
        openbao_github_jpe_splunk_installation_id: ""

    - name: Assert an empty installation ID creates no permission set
      ansible.builtin.assert:
        that:
          - >-
            openbao_github_org_secrets_permission_sets
            | selectattr('name', 'equalto', 'jpe-splunk-org-secrets') | list == []
          - >-
            openbao_github_org_secrets_permission_sets
            | selectattr('installation_id', 'equalto', '') | list == []
        fail_msg: An org-secret permission set must not have an empty installation ID.

    - name: Render github-mint with configured organization sets
      ansible.builtin.template:
        src: "{{ _template_dir }}/github-mint-policy.hcl.j2"
        dest: "{{ _fixture_dir }}/github-mint-policy.hcl"
        mode: "0644"

    - name: Read github-mint with configured organization sets
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/github-mint-policy.hcl"
      register: _github_mint_policy_raw

    - name: Assert github-mint excludes all org-secrets sets
      vars:
        _mint_paths: >-
          {{ (_github_mint_policy_raw.content | b64decode)
             | regex_findall('(?m)^path "([^\"]+)"') }}
      ansible.builtin.assert:
        that:
          - _mint_paths | select('search', '/token/[^/]*-org-secrets$') | list == []
        fail_msg: github-mint must not grant any org-secrets permission set.

    - name: Render the GitHub org-secrets read policy
      ansible.builtin.template:
        src: "{{ _template_dir }}/github-org-secrets-read-policy.hcl.j2"
        dest: "{{ _fixture_dir }}/github-org-secrets-read-policy.hcl"
        mode: "0644"

    - name: Read the rendered policy
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/github-org-secrets-read-policy.hcl"
      register: _github_org_secrets_policy_raw

    - name: Assert the policy contains exactly the two declared data paths
      vars:
        _policy_text: "{{ _github_org_secrets_policy_raw.content | b64decode }}"
        _policy_paths: "{{ _policy_text | regex_findall('(?m)^path \"([^\"]+)\"') }}"
        _policy_capabilities: "{{ _policy_text | regex_findall('(?m)^  capabilities = (.*)$') }}"
      ansible.builtin.assert:
        that:
          - _policy_paths == [
              openbao_github_org_secrets_mount ~ '/data/' ~ openbao_github_org_disclosure_denylist_path,
              openbao_github_org_secrets_mount ~ '/data/' ~ openbao_github_org_gitleaks_path]
          - _policy_capabilities == ['["read"]', '["read"]']
          - openbao_github_org_disclosure_denylist_field == 'terms'
          - openbao_github_org_gitleaks_fields == ['private_config', 'license_key']
        fail_msg: >-
          The github-org-secrets-read policy must read only the two declared
          secrets-external data paths, with no wildcard or metadata grant.
