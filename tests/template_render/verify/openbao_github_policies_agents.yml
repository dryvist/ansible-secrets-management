---
- name: Assert open-llm holds only its bucket, external key, role IDs, broker, and mint grants
  vars:
    _raw_token_stanza: >-
      {{ _open_llm_text | regex_search('(?ms)path "' ~ openbao_github_agents_mount
         ~ '/token" [{].*?^[}]') }}
    _token_stanza: >-
      {{ _open_llm_text | regex_search('(?ms)path "' ~ openbao_github_agents_mount
         ~ '/token/public-write" [{].*?^[}]') }}
    _raw_allowed_parameters: >-
      {{ _raw_token_stanza | regex_search('(?ms)^  allowed_parameters = [{].*?^  }') }}
    _raw_denied_parameters: >-
      {{ _raw_token_stanza | regex_search('(?ms)^  denied_parameters = [{].*?^  }') }}
    _read_role_id_stanza: >-
      {{ _open_llm_text | regex_search('(?ms)path "auth/approle/role/'
         ~ openbao_sandbox_agent_read_approle_name ~ '/role-id" [{].*?^[}]') }}
    _write_role_id_stanza: >-
      {{ _open_llm_text | regex_search('(?ms)path "auth/approle/role/'
         ~ openbao_sandbox_agent_write_approle_name ~ '/role-id" [{].*?^[}]') }}
  ansible.builtin.assert:
    that:
      - >-
        _open_llm_paths == [openbao_kv_mount ~ '/data/apps/open-llm',
                            openbao_kv_mount ~ '/metadata/apps/open-llm',
                            'secrets-external/data/ai/saas/zai',
                            openbao_github_agents_mount ~ '/token',
                            openbao_github_agents_mount ~ '/token/public-write',
                            'auth/approle/role/' ~ openbao_sandbox_agent_read_approle_name ~ '/role-id',
                            'auth/approle/role/' ~ openbao_sandbox_agent_read_approle_name ~ '/secret-id',
                            'auth/approle/role/' ~ openbao_sandbox_agent_write_approle_name ~ '/role-id',
                            'auth/approle/role/' ~ openbao_sandbox_agent_write_approle_name ~ '/secret-id',
                            'auth/approle/role/' ~ openbao_sandbox_zcode_read_approle_name ~ '/role-id',
                            'auth/approle/role/' ~ openbao_sandbox_zcode_read_approle_name ~ '/secret-id',
                            'auth/approle/role/' ~ openbao_sandbox_zcode_write_approle_name ~ '/role-id',
                            'auth/approle/role/' ~ openbao_sandbox_zcode_write_approle_name ~ '/secret-id',
                            'auth/approle/role/' ~ openbao_sandbox_opencode_read_approle_name ~ '/role-id',
                            'auth/approle/role/' ~ openbao_sandbox_opencode_read_approle_name ~ '/secret-id',
                            'auth/approle/role/' ~ openbao_sandbox_opencode_write_approle_name ~ '/role-id',
                            'auth/approle/role/' ~ openbao_sandbox_opencode_write_approle_name ~ '/secret-id',
                            'auth/approle/role/' ~ openbao_sandbox_cursor_read_approle_name ~ '/role-id',
                            'auth/approle/role/' ~ openbao_sandbox_cursor_read_approle_name ~ '/secret-id',
                            'auth/approle/role/' ~ openbao_sandbox_cursor_write_approle_name ~ '/role-id',
                            'auth/approle/role/' ~ openbao_sandbox_cursor_write_approle_name ~ '/secret-id']
      - _read_role_id_stanza | regex_findall('capabilities = (.*)') == ['["read"]']
      - _write_role_id_stanza | regex_findall('capabilities = (.*)') == ['["read"]']
      - >-
        'capabilities = ["create", "update"]' in _raw_token_stanza
      - >-
        'required_parameters = ["repositories", "permissions"]'
        in _raw_token_stanza
      - >-
        _raw_allowed_parameters | regex_findall('(?m)^    "([^"]+)" =')
        == ['org_name', 'repositories', 'permissions']
      - >-
        '"org_name" = []' in _raw_allowed_parameters
      - >-
        '"repositories" = []' in _raw_allowed_parameters
      - >-
        _raw_denied_parameters | regex_findall('(?m)^    "([^"]+)" =')
        == ['installation_id', 'repository_ids']
      - >-
        '"installation_id" = []' in _raw_denied_parameters
      - >-
        '"repository_ids" = []' in _raw_denied_parameters
      - >-
        '"permissions" = [{ "contents" = "write", "pull_requests" = "write" }, { "contents" = "read" }]'
        in _raw_token_stanza
      - >-
        'capabilities = ["create", "update"]' in _token_stanza
      - >-
        'max_wrapping_ttl = "15m"' in _open_llm_text
      - _open_llm_text | regex_findall('min_wrapping_ttl = "1s"') | length == 8
      - >-
        _open_llm_paths | select('match', '^(github|github-admin|' ~ openbao_github_hermes_mount ~ ')/')
        | list == []
      - >-
        _open_llm_text | regex_findall('capabilities = (.*)')
        | select('search', 'list|delete|sudo') | list == []
    fail_msg: >-
      open-llm grants {{ _open_llm_paths }}. It must read only its internal
      bucket, exact Z.ai leaf, and sandbox role IDs, mint raw tokens
      and use the named public-write set, and issue wrapped one-use SecretIDs
      for the sandbox roles.

- name: Render per-tool sandbox policies
  ansible.builtin.template:
    src: "{{ _template_dir }}/{{ item }}-policy.hcl.j2"
    dest: "{{ _fixture_dir }}/{{ item }}-policy.hcl"
    mode: "0644"
  loop:
    - sandbox-zcode-read
    - sandbox-zcode-write
    - sandbox-opencode-read
    - sandbox-opencode-write
    - sandbox-cursor-read
    - sandbox-cursor-write

- name: Read per-tool sandbox policies
  ansible.builtin.slurp:
    src: "{{ _fixture_dir }}/{{ item }}-policy.hcl"
  loop:
    - sandbox-zcode-read
    - sandbox-zcode-write
    - sandbox-opencode-read
    - sandbox-opencode-write
    - sandbox-cursor-read
    - sandbox-cursor-write
  register: _sandbox_tool_policies

- name: Assert each per-tool policy has exactly its credential and token grants
  vars:
    _policy: "{{ item.content | b64decode }}"
    _credential: >-
      {{ 'secrets-external/data/ai/saas/zai' if 'zcode' in item.item
         else ('secrets-external/data/ai/saas/cursor' if 'cursor' in item.item
               else openbao_kv_mount ~ '/data/apps/sandbox-agent-router') }}
    _token: >-
      {{ openbao_github_agents_mount ~ '/token/public-'
         ~ ('read' if item.item.endswith('-read') else 'write') }}
  ansible.builtin.assert:
    that:
      - _policy | regex_findall('(?m)^path "([^"]+)"') == [_credential, _token]
      - _policy | regex_findall('capabilities = (.*)') == ['["read"]', '["create", "update"]']
  loop: "{{ _sandbox_tool_policies.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Render fleet agent GitHub policies
  ansible.builtin.template:
    src: "{{ _template_dir }}/{{ item }}-policy.hcl.j2"
    dest: "{{ _fixture_dir }}/{{ item }}-policy.hcl"
    mode: "0644"
  loop:
    - "{{ openbao_dify_agent_code_simplifier_policy_name }}"
    - "{{ openbao_dify_agent_ci_fixer_policy_name }}"
    - "{{ openbao_dify_agent_vikunja_clerk_policy_name }}"
    - "{{ openbao_dify_agent_vikunja_triage_policy_name }}"
    - "{{ openbao_dify_agent_docs_updater_policy_name }}"

- name: Read fleet agent GitHub policies
  ansible.builtin.slurp:
    src: "{{ _fixture_dir }}/{{ item }}-policy.hcl"
  loop:
    - "{{ openbao_dify_agent_code_simplifier_policy_name }}"
    - "{{ openbao_dify_agent_ci_fixer_policy_name }}"
    - "{{ openbao_dify_agent_vikunja_clerk_policy_name }}"
    - "{{ openbao_dify_agent_vikunja_triage_policy_name }}"
    - "{{ openbao_dify_agent_docs_updater_policy_name }}"
  register: _fleet_agent_policies

- name: Assert fleet agent policies mint only their named set
  vars:
    _policy: "{{ item.content | b64decode }}"
    _path: "{{ openbao_github_agents_mount }}/token/{{ item.item }}"
  ansible.builtin.assert:
    that:
      - _policy | regex_findall('(?m)^path "([^\"]+)"') == [_path]
      - _policy | regex_findall('capabilities = (.*)') == ['["create", "update"]']
      - "'secret/data/' not in _policy"
      - "'secret/metadata/' not in _policy"
      - "'sys/' not in _policy"
      - "'*' not in _policy"
      - >-
        _policy | regex_findall('(?m)^path "([^\"]+)"')
        | select('match', '^' ~ openbao_github_agents_mount ~ '/token/')
        | reject('equalto', _path) | list == []
  loop: "{{ _fleet_agent_policies.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Assert per-tool dispatcher grants require wrapping
  vars:
    _role_id: >-
      {{ _open_llm_text | regex_search('(?ms)path "auth/approle/role/'
         ~ item ~ '/role-id" [{].*?^[}]') }}
    _secret_id: >-
      {{ _open_llm_text | regex_search('(?ms)path "auth/approle/role/'
         ~ item ~ '/secret-id" [{].*?^[}]') }}
  ansible.builtin.assert:
    that:
      - _role_id | regex_findall('capabilities = (.*)') == ['["read"]']
      - _secret_id | regex_findall('capabilities = (.*)') == ['["create", "update"]']
      - >-
        'min_wrapping_ttl = "1s"' in _secret_id
      - >-
        'max_wrapping_ttl = "15m"' in _secret_id
  loop:
    - "{{ openbao_sandbox_zcode_read_approle_name }}"
    - "{{ openbao_sandbox_zcode_write_approle_name }}"
    - "{{ openbao_sandbox_opencode_read_approle_name }}"
    - "{{ openbao_sandbox_opencode_write_approle_name }}"
    - "{{ openbao_sandbox_cursor_read_approle_name }}"
    - "{{ openbao_sandbox_cursor_write_approle_name }}"

- name: Assert no other tier reaches the agents mount
  ansible.builtin.assert:
    that:
      - >-
        (_publisher_paths + _mint_paths + _read_paths + _repo_create_paths
         + _org_admin_paths + _write_paths + _ai_public_paths)
        | select('match', '^' ~ openbao_github_agents_mount ~ '/') | list == []
      - _ai_public_paths | select('match', '^github') | list == []
    fail_msg: Only open-llm may mint from {{ openbao_github_agents_mount }}.
