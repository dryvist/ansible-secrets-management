---
# The GitHub token tiers are a privilege boundary expressed entirely in Jinja
# loops over one shared list, so a set added for one identity silently reaches
# every other policy whose loop does not exclude it. `github-mint` is the
# dangerous one: it is attached to every apply-tier estate actor, so it must
# select the read tier explicitly. A write grant landing there would hand
# repository write to identities that are only ever meant to read.
#
# Rendering is the only place this is observable: the declarations look correct
# in isolation, and no converge assertion compares one policy against another.
- name: Render and verify the GitHub tier policies
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    _fixture_dir: "{{ render_tmp }}"
    _template_dir: "../../../roles/openbao/templates"
    ansible_managed: "test fixture"
    _publisher_path: >-
      {{ openbao_github_mount }}/token/{{ openbao_github_docs_publisher_set_name }}
    _publisher_kv_paths:
      - "{{ openbao_kv_mount }}/data/apps/{{ openbao_github_docs_publisher_kv_app }}"
      - "{{ openbao_kv_mount }}/metadata/apps/{{ openbao_github_docs_publisher_kv_app }}"
    _ci_resolver_path: >-
      {{ openbao_github_mount }}/token/{{ openbao_github_ci_resolver_set_name }}
    _ci_resolver_kv_paths:
      - "{{ openbao_kv_mount }}/data/apps/ci-resolver"
      - "{{ openbao_kv_mount }}/metadata/apps/ci-resolver"
    _repo_create_path: >-
      {{ openbao_github_mount }}/token/dryvist-repo-create
    _org_admin_path: >-
      {{ openbao_github_mount }}/token/dryvist-org-admin

  tasks:
    - name: Verify runner and mount configuration boundaries
      ansible.builtin.include_tasks: openbao_github_policies_setup.yml

    - name: Verify publisher and GitHub write-tier boundaries
      ansible.builtin.include_tasks: openbao_github_policies_writes.yml

    - name: Verify sandbox and fleet-agent token policies
      ansible.builtin.include_tasks: openbao_github_policies_agents.yml

    - name: Verify agent mount configuration and permission sets
      ansible.builtin.include_tasks: openbao_github_policies_mounts.yml
