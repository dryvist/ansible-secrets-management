---
- name: Render and verify Enterprise GitHub mounts, policies and AppRoles
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_become: false
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _fixture_dir: "{{ render_tmp }}"
    _template_dir: ../../../roles/openbao/templates
    ansible_managed: "test fixture"

  tasks:
    - name: Load the openbao role defaults
      ansible.builtin.include_vars:
        dir: ../../../roles/openbao/defaults/main

    - name: Pin both Enterprise installations to the unconfigured case
      ansible.builtin.set_fact:
        openbao_github_enterprise_read_installation_id: ""
        openbao_github_enterprise_installation_id: ""
        openbao_terrakube_network_workspace: example-network
        openbao_terrakube_aws_workspace: example-aws
        _enterprise_policy_specs:
          - policy: "{{ openbao_github_enterprise_read_policy_name }}"
            approle: "{{ openbao_github_enterprise_read_approle_name }}"
            mount: "{{ openbao_github_enterprise_read_mount }}"
            template: github-enterprise-read-policy.hcl.j2
            installation_id: "4242"
          - policy: "{{ openbao_github_enterprise_admin_policy_name }}"
            approle: "{{ openbao_github_enterprise_admin_approle_name }}"
            mount: "{{ openbao_github_enterprise_mount }}"
            template: github-enterprise-admin-policy.hcl.j2
            installation_id: "4343"

    - name: Assert only the AppRoles are declared without installation IDs
      ansible.builtin.assert:
        that:
          - >-
            (_enterprise_policy_specs | map(attribute='mount') | list
             | select('in', openbao_github_app_mounts | map(attribute='mount') | list) | list) == []
          - >-
            (_enterprise_policy_specs | map(attribute='policy') | list
             | select('in', openbao_policies | map(attribute='name') | list) | list) == []
          - >-
            (_enterprise_policy_specs | map(attribute='approle') | list
             | reject('in', openbao_approles | map(attribute='name') | list) | list) == []
        fail_msg: >-
          With no installation IDs, neither Enterprise mount nor policy may be
          declared (an empty policy must never be written); both AppRoles stay.
        quiet: true

    - name: Render both policies without installation IDs
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item.template }}"
        dest: "{{ _fixture_dir }}/unset-{{ item.policy }}.hcl"
        mode: "0644"
      loop: "{{ _enterprise_policy_specs }}"

    - name: Read the policies rendered without installation IDs
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/unset-{{ item.policy }}.hcl"
      loop: "{{ _enterprise_policy_specs }}"
      register: _enterprise_unset_policy_raw

    - name: Assert unset installation IDs produce no token path
      vars:
        _unset_policy_texts: >-
          {{ _enterprise_unset_policy_raw.results | map(attribute='content') | map('b64decode') | list }}
      ansible.builtin.assert:
        that:
          - >-
            _unset_policy_texts | map('regex_findall', '(?m)^path "([^"]+)"')
            | flatten | list == []
        quiet: true

    - name: Pin both Enterprise installations to non-numeric values
      ansible.builtin.set_fact:
        openbao_github_enterprise_read_installation_id: "*"
        openbao_github_enterprise_installation_id: '4343" }'

    - name: Render both policies with non-numeric installation IDs
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item.template }}"
        dest: "{{ _fixture_dir }}/malformed-{{ item.policy }}.hcl"
        mode: "0644"
      loop: "{{ _enterprise_policy_specs }}"

    - name: Read the policies rendered with non-numeric installation IDs
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/malformed-{{ item.policy }}.hcl"
      loop: "{{ _enterprise_policy_specs }}"
      register: _enterprise_malformed_policy_raw

    - name: Assert a glob or quoted installation ID produces no token path
      vars:
        _malformed_policy_texts: >-
          {{ _enterprise_malformed_policy_raw.results | map(attribute='content') | map('b64decode') | list }}
      ansible.builtin.assert:
        that:
          - >-
            _malformed_policy_texts | map('regex_findall', '(?m)^path "([^"]+)"')
            | flatten | list == []
        fail_msg: >-
          A non-numeric installation ID must render no path, so the converge's
          empty-policy check fails instead of writing a glob or injected pin.
        quiet: true

    - name: Pin both Enterprise installations to configured test IDs
      ansible.builtin.set_fact:
        openbao_github_enterprise_read_installation_id: "4242"
        openbao_github_enterprise_installation_id: "4343"

    - name: Assert configured installation IDs declare both mounts and policies
      ansible.builtin.assert:
        that:
          - >-
            (openbao_github_app_mounts
             | selectattr('mount', 'in', _enterprise_policy_specs | map(attribute='mount') | list)
             | map(attribute='permission_sets') | list) == [[], []]
          - >-
            (_enterprise_policy_specs | map(attribute='policy') | list
             | reject('in', openbao_policies | map(attribute='name') | list) | list) == []
        quiet: true

    - name: Render both policies with installation IDs
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item.template }}"
        dest: "{{ _fixture_dir }}/configured-{{ item.policy }}.hcl"
        mode: "0644"
      loop: "{{ _enterprise_policy_specs }}"

    - name: Read the policies rendered with installation IDs
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/configured-{{ item.policy }}.hcl"
      loop: "{{ _enterprise_policy_specs }}"
      register: _enterprise_configured_policy_raw

    - name: Assert each policy grants only its pinned raw token endpoint
      vars:
        _policy_texts: >-
          {{ _enterprise_configured_policy_raw.results | map(attribute='content') | map('b64decode') | list }}
        _policy_paths: >-
          {{ _policy_texts | map('regex_findall', '(?m)^path "([^"]+)"') | list }}
        _parameter_keys: >-
          {{ _policy_texts | map('regex_findall', '"([^"]+)"\s*=') | list }}
      ansible.builtin.assert:
        that:
          - >-
            _policy_paths == [[_enterprise_policy_specs[0].mount ~ '/token'],
                              [_enterprise_policy_specs[1].mount ~ '/token']]
          - _policy_texts[0] is search('allowed_parameters = \{ "installation_id" = \["4242"\] \}')
          - _policy_texts[1] is search('allowed_parameters = \{ "installation_id" = \["4343"\] \}')
          - _parameter_keys == [['installation_id'], ['installation_id']]
          - >-
            _policy_texts | select('search', 'required_parameters = \["installation_id"\]')
            | list | length == 2
          - >-
            _policy_texts | select('search', 'capabilities\s*=\s*\["create", "update"\]')
            | list | length == 2
        fail_msg: >-
          Each Enterprise policy must allow create/update on its raw token path
          with only its own installation ID as an allowed parameter.
        quiet: true

    - name: Assert both AppRoles are inert, single-use and workstation-bound
      vars:
        _role: "{{ openbao_approles | selectattr('name', 'equalto', item.approle) | first }}"
      ansible.builtin.assert:
        that:
          - _role.policy == item.policy
          - _role.token_ttl == openbao_ai_admin_token_ttl
          - _role.token_max_ttl == openbao_ai_admin_token_ttl
          - _role.manage_secret_id is defined and not _role.manage_secret_id
          - _role.secret_id_ttl == openbao_ai_elevated_secret_id_ttl
          - _role.secret_id_num_uses | int == 1
          - openbao_approle_cidr_class_map[item.approle] == 'workstation'
        quiet: true
      loop: "{{ _enterprise_policy_specs }}"

    - name: Assert reconciliation protects only the full-grant Enterprise policy
      ansible.builtin.assert:
        that:
          - openbao_github_enterprise_admin_policy_name in openbao_reconcile_excluded_policies
          - openbao_ai_admin_guard_policy_name in openbao_reconcile_excluded_policies
          - openbao_github_enterprise_read_policy_name not in openbao_reconcile_excluded_policies
        quiet: true

    - name: Render the human-unlock and approle-issuer policies
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item }}.j2"
        dest: "{{ _fixture_dir }}/enterprise-{{ item }}"
        mode: "0644"
      loop:
        - human-unlock-policy.hcl
        - approle-issuer-policy.hcl

    - name: Read the human-unlock and approle-issuer policies
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/enterprise-{{ item }}"
      loop:
        - human-unlock-policy.hcl
        - approle-issuer-policy.hcl
      register: _enterprise_unlock_issuer_raw

    - name: Assert only human-unlock may mint the Enterprise secret IDs
      vars:
        _unlock_policy_text: "{{ _enterprise_unlock_issuer_raw.results[0].content | b64decode }}"
        _issuer_policy_text: "{{ _enterprise_unlock_issuer_raw.results[1].content | b64decode }}"
        _human_gated_paths:
          - "auth/approle/role/{{ openbao_github_enterprise_read_approle_name }}/secret-id"
          - "auth/approle/role/{{ openbao_github_enterprise_read_approle_name }}/role-id"
          - "auth/approle/role/{{ openbao_github_enterprise_admin_approle_name }}/secret-id"
          - "auth/approle/role/{{ openbao_github_enterprise_admin_approle_name }}/role-id"
      ansible.builtin.assert:
        that:
          - _human_gated_paths | select('in', _unlock_policy_text) | list == _human_gated_paths
          - _human_gated_paths | select('in', _issuer_policy_text) | list == []
        fail_msg: >-
          human-unlock must expose both Enterprise roles and approle-issuer
          must expose neither.
        quiet: true

    - name: Render the owner-token access policies
      ansible.builtin.template:
        src: "{{ _template_dir }}/{{ item.template }}"
        dest: "{{ _fixture_dir }}/owner-{{ item.name }}.hcl"
        mode: "0644"
      loop:
        - name: admin
          template: ai-admin-policy.hcl.j2
        - name: reconcile
          template: openbao-reconcile-policy.hcl.j2
        - name: human-unlock
          template: human-unlock-policy.hcl.j2

    - name: Read the owner-token access policies
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/owner-{{ item }}.hcl"
      loop:
        - admin
        - reconcile
        - human-unlock
      register: _owner_policy_raw

    - name: Assert only the admin tiers can read the owner token
      vars:
        _admin_policy_text: "{{ _owner_policy_raw.results[0].content | b64decode }}"
        _reconcile_policy_text: "{{ _owner_policy_raw.results[1].content | b64decode }}"
        _human_unlock_policy_text: "{{ _owner_policy_raw.results[2].content | b64decode }}"
        _owner_pat_path: "{{ openbao_github_enterprise_owner_mount }}/data/pat"
      ansible.builtin.assert:
        that:
          - >-
            _admin_policy_text is search('(?ms)^path "' ~ openbao_github_enterprise_owner_mount
            ~ '/data/\\*" \\{\\s*capabilities = \\["read", "list"\\]\\s*\\}')
          - >-
            _admin_policy_text is search('(?ms)^path "' ~ openbao_github_enterprise_owner_mount
            ~ '/metadata/\\*" \\{\\s*capabilities = \\["read", "list"\\]\\s*\\}')
          - openbao_github_enterprise_owner_mount not in _reconcile_policy_text
          - >-
            _human_unlock_policy_text is search('(?ms)^path "' ~ _owner_pat_path
            ~ '" \\{\\s*capabilities = \\["create", "update"\\]\\s*\\}')
          - _human_unlock_policy_text is not search('(?ms)^path "' ~ _owner_pat_path ~ '" \\{[^}]*"read"')
        fail_msg: >-
          Only ai-admin may read the owner mount; reconcile must omit it and
          human-unlock may only create or update the stored PAT.
        quiet: true

    - name: Render the ai-admin guard policy
      ansible.builtin.template:
        src: "{{ _template_dir }}/ai-admin-guard-policy.hcl.j2"
        dest: "{{ _fixture_dir }}/ai-admin-guard.hcl"
        mode: "0644"

    - name: Read the ai-admin guard policy
      ansible.builtin.slurp:
        src: "{{ _fixture_dir }}/ai-admin-guard.hcl"
      register: _ai_admin_guard_raw

    - name: Assert the admin guard denies self-extension paths
      vars:
        _guard_policy_text: "{{ _ai_admin_guard_raw.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - >-
            _guard_policy_text is search('(?ms)^path "auth/token/create-orphan"'
            ~ ' \\{\\s*capabilities = \\["deny"\\]\\s*\\}')
          - >-
            _guard_policy_text is search('(?ms)^path "auth/approle/role/' ~ openbao_ai_admin_session_approle_name
            ~ '/\\*" \\{\\s*capabilities = \\["deny"\\]\\s*\\}')
          - >-
            _guard_policy_text is search('(?ms)^path "sys/policies/acl/' ~ openbao_ai_admin_policy_name
            ~ '" \\{\\s*capabilities = \\["deny"\\]\\s*\\}')
          - >-
            _guard_policy_text is search('(?ms)^path "sys/audit/\\*" \\{\\s*capabilities = \\["deny"\\]\\s*\\}')
          - >-
            _guard_policy_text is search('(?ms)^path "identity/mfa/\\*" \\{\\s*capabilities = \\["deny"\\]\\s*\\}')
          - _guard_policy_text is not search('(?m)^path "auth/token/create"')
        fail_msg: >-
          ai-admin-guard must deny the requested self-extension and control-plane
          paths while preserving plain child-token creation.
        quiet: true

    - name: Assert only the admin window attaches the guard overlay
      vars:
        _ai_admin_role: >-
          {{ openbao_approles | selectattr('name', 'equalto', openbao_ai_admin_approle_name) | first }}
        _ai_admin_session_role: >-
          {{ openbao_approles | selectattr('name', 'equalto', openbao_ai_admin_session_approle_name) | first }}
        _operator_admin_role: >-
          {{ openbao_approles | selectattr('name', 'equalto', 'admin') | first }}
      ansible.builtin.assert:
        that:
          - _ai_admin_role.policy == openbao_ai_admin_policy_name
          - _ai_admin_role.token_policies is not defined
          - >-
            (_ai_admin_session_role.token_policies | sort)
            == ([openbao_ai_admin_policy_name, openbao_ai_admin_guard_policy_name] | sort)
          - _operator_admin_role.policy == openbao_ai_admin_policy_name
          - _operator_admin_role.token_policies is not defined
        quiet: true
