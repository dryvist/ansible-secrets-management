---
- name: Pin the agents installation before loading defaults
  ansible.builtin.set_fact:
    openbao_github_agents_installation_id: "4242"

# The real defaults, not a mirrored subset: the composition of
# openbao_github_permission_sets from its base list plus the conditional
# publish tier IS what is under test, so a hand-written fixture would test
# the fixture. `dir` resolves relative to this file.
- name: Load the openbao role defaults
  ansible.builtin.include_vars:
    dir: ../../../roles/openbao/defaults/main

- name: Pin the personal App installation to the unconfigured case
  ansible.builtin.set_fact:
    openbao_github_personal_installation_id: ""

- name: Assert an unconfigured personal installation declares no mount or set
  vars:
    _personal_mounts: >-
      {{ openbao_github_app_mounts
         | selectattr('mount', 'equalto', openbao_github_personal_mount) | list }}
    _personal_sets: >-
      {{ openbao_github_permission_sets
         | selectattr('name', 'equalto', openbao_github_personal_write_set_name) | list }}
  ansible.builtin.assert:
    that:
      - openbao_github_personal_permission_sets == []
      - _personal_mounts == []
      - _personal_sets == []
    fail_msg: >-
      An unset personal installation ID must omit its mount and write set.

- name: Pin Pepper mount inputs to the unconfigured case
  ansible.builtin.set_fact:
    openbao_github_pepper_app_id: ""
    openbao_github_pepper_app_private_key: ""
    openbao_github_pepper_installation_id: ""
    openbao_github_pepper_repository: ""
    _openbao_github_pepper_repositories_csv: ""

- name: Assert an unconfigured Pepper App declares no set or mount
  vars:
    _pepper_mounts: >-
      {{ openbao_github_app_mounts
         | selectattr('mount', 'equalto', openbao_github_pepper_mount) | list }}
    _pepper_global_sets: >-
      {{ openbao_github_permission_sets
         | selectattr('name', 'equalto', openbao_github_pepper_read_set_name) | list }}
  ansible.builtin.assert:
    that:
      - openbao_github_pepper_permission_sets == []
      - _pepper_mounts == []
      - _pepper_global_sets == []
    fail_msg: >-
      Without every Pepper input, its permission set and mount must be omitted
      so the mount converge skips it.

- name: Pin the github-human-obsidian mount inputs to the unconfigured case
  ansible.builtin.set_fact:
    openbao_github_human_obsidian_app_id: ""
    openbao_github_human_obsidian_app_private_key: ""
    openbao_github_human_obsidian_installation_id: ""
    _openbao_github_human_obsidian_repositories_csv: ""

- name: Assert an unconfigured github-human-obsidian App declares no set or mount
  vars:
    _obsidian_mounts: >-
      {{ openbao_github_app_mounts
         | selectattr('mount', 'equalto', openbao_github_human_obsidian_mount) | list }}
    _obsidian_global_sets: >-
      {{ openbao_github_permission_sets
         | selectattr('name', 'equalto', openbao_github_human_obsidian_write_set_name) | list }}
  ansible.builtin.assert:
    that:
      - openbao_github_human_obsidian_permission_sets == []
      - _obsidian_mounts == []
      - _obsidian_global_sets == []
    fail_msg: >-
      Without every github-human-obsidian input, its permission set and mount
      must be omitted so the mount converge skips it.

- name: Pin runner App credentials to the unconfigured case
  ansible.builtin.set_fact:
    openbao_github_runner_app_id: ""
    openbao_github_runner_app_private_key: ""

- name: Render the runner policy without runner App credentials
  ansible.builtin.template:
    src: "{{ _template_dir }}/github-runner-policy.hcl.j2"
    dest: "{{ _fixture_dir }}/unset-github-runner-policy.hcl"
    mode: "0644"

- name: Read the runner policy without runner App credentials
  ansible.builtin.slurp:
    src: "{{ _fixture_dir }}/unset-github-runner-policy.hcl"
  register: _github_runner_unset_raw

- name: Assert a converge without runner App credentials keeps the mount and raw token grant
  ansible.builtin.assert:
    that:
      - >-
        openbao_github_runner_mount in
        (openbao_github_app_mounts | map(attribute='mount') | list)
      - >-
        (_github_runner_unset_raw.content | b64decode)
        | regex_findall('(?m)^path "' ~ openbao_github_runner_mount ~ '/token" [{]$')
        | length == 1
    fail_msg: >-
      The runner mount and its raw token policy path must stay declared
      when the one-time App credentials are absent.

- name: Pin runner App credentials to the configured case
  ansible.builtin.set_fact:
    openbao_github_runner_app_id: "4242"
    openbao_github_runner_app_private_key: fixture-private-key

- name: Render the runner policy with runner App credentials
  ansible.builtin.template:
    src: "{{ _template_dir }}/github-runner-policy.hcl.j2"
    dest: "{{ _fixture_dir }}/set-github-runner-policy.hcl"
    mode: "0644"

- name: Read the runner policy with runner App credentials
  ansible.builtin.slurp:
    src: "{{ _fixture_dir }}/set-github-runner-policy.hcl"
  register: _github_runner_set_raw

- name: Assert the runner App mount and raw token policy are narrowly scoped
  vars:
    _runner_mounts: >-
      {{ openbao_github_app_mounts
         | selectattr('mount', 'equalto', openbao_github_runner_mount) | list }}
    _runner_token_stanza: >-
      {{ (_github_runner_set_raw.content | b64decode)
         | regex_search('(?ms)^path "' ~ openbao_github_runner_mount
            ~ '/token" [{].*?^[}]') }}
  ansible.builtin.assert:
    that:
      - _runner_mounts | length == 1
      - _runner_mounts[0].app_id == '4242'
      - _runner_mounts[0].private_key == 'fixture-private-key'
      - _runner_mounts[0].permission_sets == []
      - >-
        'installation_id' not in _runner_mounts[0]
      - >-
        (_github_runner_set_raw.content | b64decode)
        | regex_findall('(?m)^path "' ~ openbao_github_runner_mount ~ '/token" [{]$')
        | length == 1
      - >-
        'capabilities = ["create", "update"]' in _runner_token_stanza
      - >-
        'required_parameters = ["org_name"]' in _runner_token_stanza
      - >-
        _runner_token_stanza
        | regex_findall('(?m)^    "([^"]+)" =') == ['org_name']
      - >-
        'installation_id' not in _runner_token_stanza
      - >-
        'repositories' not in _runner_token_stanza
      - >-
        'permissions' not in _runner_token_stanza
    fail_msg: >-
      The runner App must have no permission sets and its raw token path
      must allow only org_name.

- name: Assert the CI resolver repository input is split, trimmed, and empty-safe
  ansible.builtin.assert:
    that:
      - >-
        openbao_github_ci_resolver_repos
        == ((lookup('env', 'OPENBAO_GITHUB_CI_RESOLVER_REPOS')
             | default('', true)).split(',') | map('trim')
            | reject('equalto', '') | list)
    fail_msg: The CI resolver repository input must be comma-split, trimmed, and empty-safe.

- name: Render the general write policy
  ansible.builtin.template:
    src: "{{ _template_dir }}/github-write-policy.hcl.j2"
    dest: "{{ _fixture_dir }}/github-write-installation.hcl"
    mode: "0644"

- name: Read the rendered general write policy
  ansible.builtin.slurp:
    src: "{{ _fixture_dir }}/github-write-installation.hcl"
  register: _github_write_installation_raw

- name: Assert installation scope renders the installation selector
  vars:
    _personal_write_path: >-
      {{ openbao_github_personal_mount }}/token/{{ openbao_github_personal_write_set_name }}
    _write_policy_paths: >-
      {{ (_github_write_installation_raw.content | b64decode)
         | regex_findall('(?m)^path "([^"]+)"') }}
  ansible.builtin.assert:
    that:
      - >-
        '"repositories" = []' in
        (_github_write_installation_raw.content | b64decode)
      - >-
        'fixture-repo' not in
        (_github_write_installation_raw.content | b64decode)
      - _personal_write_path not in _write_policy_paths
    fail_msg: Installation scope must leave repository selection to the GitHub installation.

# set_fact, not task vars: include_vars sits ABOVE task vars in Ansible's
# precedence order, so a task-level override of a value it loaded is
# ignored. Pinning both cases here also keeps the result independent of
# whether the caller happens to have the publisher variable in its own
# environment.
