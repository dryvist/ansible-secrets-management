---
- name: Pin the publisher repository list to the unconfigured case
  ansible.builtin.set_fact:
    openbao_github_docs_publisher_repos: []

- name: Render the publisher policy with no repository configured
  ansible.builtin.template:
    src: "{{ _template_dir }}/github-docs-publisher-policy.hcl.j2"
    dest: "{{ _fixture_dir }}/unset-github-docs-publisher-policy.hcl"
    mode: "0644"

- name: Read the policy rendered without a publisher repository
  ansible.builtin.slurp:
    src: "{{ _fixture_dir }}/unset-github-docs-publisher-policy.hcl"
  register: _publisher_unset_raw

# An omitted `repositories` on a permission set means every repository of
# the installation. A publisher with no configured repository must
# therefore grant nothing at all, rather than a write grant with no bound.
- name: Assert an unconfigured publisher grants no path
  ansible.builtin.assert:
    that:
      - >-
        (_publisher_unset_raw.content | b64decode)
        | regex_findall('(?m)^path "([^"]+)"') | length == 0
    fail_msg: >-
      The docs-publisher policy grants a path with no publisher repository
      configured. An unbounded set would carry write over the whole
      installation.

- name: Pin the CI resolver repository list to the unconfigured case
  ansible.builtin.set_fact:
    openbao_github_ci_resolver_repos: []

- name: Render the CI resolver policy with no repository configured
  ansible.builtin.template:
    src: "{{ _template_dir }}/github-ci-resolver-policy.hcl.j2"
    dest: "{{ _fixture_dir }}/unset-github-ci-resolver-policy.hcl"
    mode: "0644"

- name: Read the policy rendered without a CI resolver repository
  ansible.builtin.slurp:
    src: "{{ _fixture_dir }}/unset-github-ci-resolver-policy.hcl"
  register: _ci_resolver_unset_raw

- name: Assert an unconfigured CI resolver has no set and an empty policy
  ansible.builtin.assert:
    that:
      - openbao_github_ci_resolver_permission_sets == []
      - >-
        openbao_github_admin_permission_sets
        | selectattr('name', 'equalto', openbao_github_ci_resolver_set_name) | list == []
      - >-
        (_ci_resolver_unset_raw.content | b64decode)
        | regex_findall('(?m)^path "([^"]+)"') | length == 0
    fail_msg: An empty CI resolver repository list must omit its set and every policy grant.

- name: Pin the publisher and CI resolver repository lists to the configured case
  ansible.builtin.set_fact:
    openbao_github_docs_publisher_repos: [fixture-repo]
    openbao_github_ci_resolver_repos: [fixture-repo]

- name: Pin the personal App installation to the configured case
  ansible.builtin.set_fact:
    openbao_github_personal_installation_id: fixture-installation

- name: Pin Pepper inputs to the configured fixture case
  ansible.builtin.set_fact:
    openbao_github_pepper_app_id: fixture-app-id
    openbao_github_pepper_app_private_key: fixture-private-key
    openbao_github_pepper_installation_id: fixture-installation
    openbao_github_pepper_repository: fixture-repo

- name: Render the tier policies with a publisher repository configured
  ansible.builtin.template:
    src: "{{ _template_dir }}/{{ item }}.j2"
    dest: "{{ _fixture_dir }}/set-{{ item }}"
    mode: "0644"
  loop: &tier_policies
    - github-docs-publisher-policy.hcl
    - github-mint-policy.hcl
    - github-read-policy.hcl
    - github-repo-create-policy.hcl
    - github-org-admin-policy.hcl
    - github-write-policy.hcl
    - open-llm-policy.hcl
    - ai-public-policy.hcl
    - github-ci-resolver-policy.hcl
    - ai-orchestrator-policy.hcl

- name: Read the policies rendered with a publisher repository
  ansible.builtin.slurp:
    src: "{{ _fixture_dir }}/set-{{ item }}"
  register: _tier_raw
  loop: *tier_policies

- name: Reduce each rendered policy to its path lines
  ansible.builtin.set_fact:
    _publisher_paths: "{{ _paths[0] }}"
    _mint_paths: "{{ _paths[1] }}"
    _read_paths: "{{ _paths[2] }}"
    _repo_create_paths: "{{ _paths[3] }}"
    _org_admin_paths: "{{ _paths[4] }}"
    _org_admin_text: "{{ _tier_raw.results[4].content | b64decode }}"
    _write_paths: "{{ _paths[5] }}"
    _open_llm_paths: "{{ _paths[6] }}"
    _open_llm_text: "{{ _tier_raw.results[6].content | b64decode }}"
    _ai_public_paths: "{{ _paths[7] }}"
    _ci_resolver_paths: "{{ _paths[8] }}"
    _ci_resolver_capabilities: >-
      {{ _tier_raw.results[8].content | b64decode
         | regex_findall('(?m)^  capabilities = (.*)$') }}
    _ai_orchestrator_paths: "{{ _paths[9] }}"
  vars:
    _paths: >-
      {{ _tier_raw.results | map(attribute='content') | map('b64decode')
         | map('regex_findall', '(?m)^path "([^"]+)"') | list }}

- name: Render the Pepper policy
  ansible.builtin.template:
    src: "{{ _template_dir }}/pepper-policy.hcl.j2"
    dest: "{{ _fixture_dir }}/set-pepper-policy.hcl"
    mode: "0644"

- name: Read the rendered Pepper policy
  ansible.builtin.slurp:
    src: "{{ _fixture_dir }}/set-pepper-policy.hcl"
  register: _pepper_policy_raw

- name: Assert the Pepper set is exact and its token path is exclusive
  vars:
    _pepper_sets: "{{ openbao_github_pepper_permission_sets }}"
    _pepper_mounts: >-
      {{ openbao_github_app_mounts
         | selectattr('mount', 'equalto', openbao_github_pepper_mount) | list }}
    _pepper_global_sets: >-
      {{ openbao_github_permission_sets
         | selectattr('name', 'equalto', openbao_github_pepper_read_set_name) | list }}
    _pepper_path: >-
      {{ openbao_github_pepper_mount }}/token/{{ openbao_github_pepper_read_set_name }}
    _pepper_policy_text: "{{ _pepper_policy_raw.content | b64decode }}"
    _pepper_policy_paths: >-
      {{ _pepper_policy_text | regex_findall('(?m)^path "([^"]+)"') }}
    _pepper_github_paths: >-
      {{ _pepper_policy_paths | select('match', '^github(-[^/]+)?/') | list }}
    _pepper_token_stanza: >-
      {{ _pepper_policy_text
         | regex_search('(?ms)^path "' ~ _pepper_path ~ '" [{].*?^[}]') }}
  ansible.builtin.assert:
    that:
      - _pepper_sets | length == 1
      - _pepper_sets[0].name == openbao_github_pepper_read_set_name
      - _pepper_sets[0].tier == openbao_github_pepper_read_tier
      - _pepper_sets[0].installation_id == 'fixture-installation'
      - _pepper_sets[0].repositories == ['fixture-repo']
      - >-
        _pepper_sets[0].permissions
        == {'contents': 'read', 'metadata': 'read'}
      - _pepper_mounts | length == 1
      - _pepper_mounts[0].app_id == 'fixture-app-id'
      - _pepper_mounts[0].private_key == 'fixture-private-key'
      - _pepper_mounts[0].permission_sets == _pepper_sets
      - _pepper_global_sets | length == 1
      - _pepper_global_sets[0].mount == openbao_github_pepper_mount
      - _pepper_global_sets[0].tier == openbao_github_pepper_read_tier
      - _pepper_global_sets[0].repositories == ['fixture-repo']
      - _pepper_github_paths == [_pepper_path]
      - openbao_github_pepper_mount ~ '/token' not in _pepper_policy_paths
      - >-
        'capabilities = ["create", "update"]' in _pepper_token_stanza
      - _pepper_path not in _mint_paths
      - _pepper_path not in _read_paths
      - _pepper_path not in _publisher_paths
      - _pepper_path not in _repo_create_paths
      - _pepper_path not in _org_admin_paths
      - _pepper_path not in _write_paths
      - _pepper_path not in _open_llm_paths
      - _pepper_path not in _ci_resolver_paths
      - _pepper_path not in _ai_public_paths
      - _pepper_path not in _ai_orchestrator_paths
      - >-
        openbao_github_agents_permission_sets
        | selectattr('name', 'equalto', openbao_github_pepper_read_set_name)
        | list == []
    fail_msg: >-
      Pepper must have only its one read set, and no other GitHub identity
      policy may mint that set.

- name: Assert the personal write set and its write-tier grant are exact
  vars:
    _personal_mounts: >-
      {{ openbao_github_app_mounts
         | selectattr('mount', 'equalto', openbao_github_personal_mount) | list }}
    _personal_sets: "{{ openbao_github_personal_permission_sets }}"
    _personal_policy_sets: >-
      {{ openbao_github_permission_sets
         | selectattr('name', 'equalto', openbao_github_personal_write_set_name) | list }}
    _personal_write_path: >-
      {{ openbao_github_personal_mount }}/token/{{ openbao_github_personal_write_set_name }}
  ansible.builtin.assert:
    that:
      - _personal_sets | length == 1
      - _personal_sets[0].name == openbao_github_personal_write_set_name
      - _personal_sets[0].tier == 'write'
      - _personal_sets[0].installation_id == openbao_github_personal_installation_id
      - >-
        _personal_sets[0].permissions
        == {'contents': 'write', 'pull_requests': 'write',
            'workflows': 'write', 'checks': 'read',
            'statuses': 'read', 'metadata': 'read'}
      - _personal_mounts | length == 1
      - _personal_mounts[0].permission_sets == _personal_sets
      - _personal_mounts[0].app_id == openbao_github_personal_app_id
      - _personal_mounts[0].private_key == openbao_github_personal_app_private_key
      - _personal_policy_sets | length == 1
      - _personal_policy_sets[0].mount == openbao_github_personal_mount
      - _write_paths | select('equalto', _personal_write_path) | list | length == 1
      - _personal_write_path not in _mint_paths
      - _personal_write_path not in _read_paths
      - _personal_write_path not in _repo_create_paths
      - _personal_write_path not in _org_admin_paths
      - _personal_write_path not in _publisher_paths
      - _personal_write_path not in _ci_resolver_paths
      - _personal_write_path not in _open_llm_paths
      - _personal_write_path not in _ai_public_paths
      - _personal_write_path not in _ai_orchestrator_paths
    fail_msg: >-
      The personal write set must remain installation-pinned and be
      granted by the existing write-tier policy without leaking to
      another consumer tier.

- name: Assert the publisher policy grants exactly its own set
  ansible.builtin.assert:
    that:
      - _publisher_paths == [_publisher_path] + _publisher_kv_paths
    fail_msg: >-
      The docs-publisher policy grants {{ _publisher_paths }}. It must
      grant exactly its own permission set and one app bucket:
      no raw token endpoint, no read or admin set, no lock subtree.

- name: Assert no other tier inherits the publisher's grant
  ansible.builtin.assert:
    that:
      - _publisher_path not in _mint_paths
      - _publisher_path not in _read_paths
    fail_msg: >-
      A tier other than docs-publisher grants the publisher's set.
      github-mint must select only the read tier.

- name: Assert the CI resolver set is exact, repository-scoped, and the only token path
  vars:
    _ci_resolver_set: "{{ openbao_github_ci_resolver_permission_sets | first }}"
  ansible.builtin.assert:
    that:
      - openbao_github_ci_resolver_permission_sets | length == 1
      - _ci_resolver_set.name == openbao_github_ci_resolver_set_name
      - _ci_resolver_set.tier == 'ci-resolver'
      - _ci_resolver_set.installation_id == openbao_github_dryvist_installation_id
      - _ci_resolver_set.repositories == ['fixture-repo']
      - >-
        _ci_resolver_set.permissions
        == {'actions': 'write', 'checks': 'write', 'contents': 'write', 'pull_requests': 'write'}
      - openbao_github_ci_resolver_permissions == _ci_resolver_set.permissions
      - _ci_resolver_paths == [_ci_resolver_path] + _ci_resolver_kv_paths
      - _ci_resolver_capabilities == ['["create", "read", "update"]', '["read"]', '["read"]']
    fail_msg: >-
      The CI resolver may mint only its stored set with the four write
      permissions and read only its one service bucket.

- name: Assert no broad identity inherits the CI resolver write set
  ansible.builtin.assert:
    that:
      - _ci_resolver_path not in _mint_paths
      - _ci_resolver_path not in _ai_orchestrator_paths
      - _ci_resolver_path not in _read_paths
    fail_msg: The CI resolver's stored write set must remain exclusive to its own policy.

- name: Assert the repo-create policy grants exactly its own set
  ansible.builtin.assert:
    that:
      - _repo_create_paths == [openbao_github_mount ~ '/token', _repo_create_path]
    fail_msg: >-
      The github-repo-create policy grants {{ _repo_create_paths }}. It
      must grant its raw admin-mount token path and repo-create set, with
      no read, publish, or full-automation set.

- name: Assert no other tier inherits the repo-create grant
  ansible.builtin.assert:
    that:
      - _repo_create_path not in _mint_paths
      - _repo_create_path not in _read_paths
    fail_msg: >-
      A tier other than github-repo-create grants administration:write.
      github-mint must select only the read tier.

- name: Assert the org-admin policy grants exactly its own set, and no other tier does
  vars:
    _mint_forbidden_set_pattern: >-
      {{ '^' ~ openbao_github_mount ~ '/token/'
         ~ '(runner-register-dryvist|exporter-dryvist|.*-full-automation'
         ~ '|.*-repo-create|.*-org-admin|.*-org-secrets)$' }}
  ansible.builtin.assert:
    that:
      - _org_admin_paths == [_org_admin_path, openbao_github_mount ~ '/token']
      - _org_admin_path not in _mint_paths
      - _org_admin_path not in _read_paths
      - _org_admin_path not in _repo_create_paths
      - >-
        _mint_paths
        | select('match', _mint_forbidden_set_pattern)
        | list == []
      - >-
        'required_parameters = ["org_name", "permissions"]' in _org_admin_text
      - >-
        '"org_name" = []' in _org_admin_text
      - >-
        '"organization_administration" = "write"' in _org_admin_text
      - >-
        '"installation_id" = []' in _org_admin_text
      - >-
        '"repositories" = []' not in _org_admin_text
    fail_msg: >-
      github-org-admin grants {{ _org_admin_paths }}, another tier grants
      organization_administration:write, or github-mint contains an
      excluded set. github-mint may grant read-tier sets only.

- name: Assert everyday writes use the everyday mount and never the admin mount
  ansible.builtin.assert:
    that:
      - (openbao_github_everyday_mount ~ '/token') in _write_paths
      - _write_paths | select('match', '^' ~ openbao_github_mount ~ '/') | list == []
      - _mint_paths | select('match', '^' ~ openbao_github_mount ~ '/token/read-') | list == []
      - _read_paths | select('match', '^' ~ openbao_github_mount ~ '/') | list == []
    fail_msg: >-
      An everyday read or write policy reaches the admin mount
      ({{ openbao_github_mount }}). Everyday tokens must come only from
      {{ openbao_github_everyday_mount }}.
