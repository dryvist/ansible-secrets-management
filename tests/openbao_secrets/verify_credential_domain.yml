---
- name: Verify AppRole credential-domain resolution
  hosts: localhost
  gather_facts: false
  vars:
    openbao_secrets_operator_domains: [apps]
  tasks:
    - name: Select an explicit credential domain
      ansible.builtin.set_fact:
        openbao_domain:
          name: postgres_backup_s3
          credential_domain: apps

    - name: Resolve credentials for the separate result domain
      ansible.builtin.include_tasks: ../../roles/openbao_secrets/tasks/resolve_domain_app_role.yml

    - name: Assert the existing apps credential pair is selected
      ansible.builtin.assert:
        that:
          - openbao_secrets_domain_env_new_prefix == 'OPENBAO_APPROLE_APPS'
          - openbao_secrets_domain_role_id == 'fixture-role-id'
          - openbao_secrets_domain_secret_id == 'fixture-secret-id'
        quiet: true

    - name: Select a domain with the default credential identity
      ansible.builtin.set_fact:
        openbao_domain:
          name: harness

    - name: Resolve credentials using the domain name by default
      ansible.builtin.include_tasks: ../../roles/openbao_secrets/tasks/resolve_domain_app_role.yml

    - name: Assert the default credential identity remains domain-scoped
      ansible.builtin.assert:
        that:
          - openbao_secrets_domain_env_new_prefix == 'OPENBAO_APPROLE_HARNESS'
          - openbao_secrets_domain_role_id == 'harness-role-id'
          - openbao_secrets_domain_secret_id == 'harness-secret-id'
        quiet: true
