---
# Proves the Authelia service-secret reconcile on real guest files. The shared seed is
# replaced by its documented result (an OpenBao value is kept, else the caller value is
# used, else a generated one), so the cases run without OpenBao. The seed itself is
# covered by the homelab-contracts seed_generated tests.
#
# Cases: a guest copy with no OpenBao value; both equal; both differ; a missing copy with an
# OpenBao value; both missing. Each case asserts the file contents, the modes, whether the
# existing copy was replaced (inode), and that a failing run changed no file.
- name: Verify the Authelia service secret reconcile
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    verify_owner: "{{ lookup('pipe', 'id -un') }}"
    verify_group: "{{ lookup('pipe', 'id -gn') }}"
    authelia_admin_user: authelia-test
    verify_cases:
      - name: guest-only
        guest: {jwt_secret: guest-jwt, bootstrap_password: guest-bootstrap}
        kv: {}
        expect_fail: false
        expect_jwt: guest-jwt
        expect_bootstrap_password: guest-bootstrap
      - name: equal
        guest: {jwt_secret: same-jwt, bootstrap_password: same-bootstrap}
        kv: {jwt_secret: same-jwt, bootstrap_password: same-bootstrap}
        expect_fail: false
        expect_jwt: same-jwt
        expect_bootstrap_password: same-bootstrap
      - name: differ
        guest: {jwt_secret: guest-jwt, bootstrap_password: guest-bootstrap}
        kv: {jwt_secret: kv-jwt, bootstrap_password: kv-bootstrap}
        expect_fail: true
        expect_jwt: guest-jwt
        expect_bootstrap_password: guest-bootstrap
      - name: kv-only
        guest: {}
        kv: {jwt_secret: kv-jwt, bootstrap_password: kv-bootstrap}
        expect_fail: false
        expect_jwt: kv-jwt
      - name: neither
        guest: {}
        kv: {}
        expect_fail: false
        expect_jwt: generated-jwt_secret
  tasks:
    - name: Create the scratch directory for the guest copies
      ansible.builtin.tempfile:
        state: directory
        prefix: authelia-reconcile-
      register: verify_root

    - name: Run each reconcile case
      ansible.builtin.include_tasks: case.yml
      loop: "{{ verify_cases }}"
      loop_control:
        loop_var: verify_case
        label: "{{ verify_case.name }}"

    - name: Remove the scratch directory
      ansible.builtin.file:
        path: "{{ verify_root.path }}"
        state: absent
